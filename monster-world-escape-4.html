<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monster World: The Escape</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Special+Elite&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0f;
    color: #c8f0c8;
    font-family: 'VT323', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(120, 20, 60, 0.15), transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(20, 80, 40, 0.15), transparent 50%);
  }

  .game-wrap {
    position: relative;
    width: 720px;
    max-width: 100vw;
  }

  h1 {
    font-family: 'Special Elite', serif;
    font-size: 36px;
    color: #ff3355;
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: 3px;
    text-shadow: 2px 2px 0 #330011, 0 0 20px rgba(255,50,80,0.5);
  }

  .subtitle {
    text-align: center;
    color: #88aa88;
    font-size: 20px;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 20px;
    padding: 8px 14px;
    background: #141420;
    border: 2px solid #2a4a2a;
    margin-bottom: 4px;
    letter-spacing: 1px;
    gap: 10px;
  }

  .hud .status { color: #ffdd55; flex: 1; text-align: center; }
  .hud .keys { color: #ffdd55; }
  .key-icon {
    display: inline-block;
    color: #ffdd55;
    text-shadow: 0 0 8px rgba(255,221,85,0.8);
    font-size: 22px;
    margin: 0 1px;
  }

  canvas {
    display: block;
    background: #1a1a24;
    border: 2px solid #2a4a2a;
    width: 100%;
    image-rendering: pixelated;
  }

  canvas.coop {
    width: auto;
    max-width: 100%;
    max-height: 85vh;
    margin: 0 auto;
    aspect-ratio: 420 / 720;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(8, 4, 10, 0.94);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    text-align: center;
    z-index: 10;
    overflow-y: auto;
  }

  .overlay.hidden { display: none; }

  .overlay h2 {
    font-family: 'Special Elite', serif;
    font-size: 38px;
    color: #ff3355;
    letter-spacing: 3px;
    margin-bottom: 16px;
    text-shadow: 0 0 20px rgba(255,50,80,0.6);
  }

  .overlay p {
    font-size: 21px;
    max-width: 560px;
    line-height: 1.4;
    margin-bottom: 12px;
    color: #c8f0c8;
  }

  .overlay .controls {
    color: #88aa88;
    font-size: 19px;
    margin: 14px 0;
  }

  .keys-earned {
    font-size: 36px;
    margin: 8px 0;
    letter-spacing: 6px;
  }
  .keys-earned .key-icon { font-size: 36px; }

  button {
    font-family: 'VT323', monospace;
    font-size: 22px;
    background: #330011;
    color: #ff6688;
    border: 2px solid #ff3355;
    padding: 10px 30px;
    cursor: pointer;
    letter-spacing: 3px;
    margin-top: 8px;
    transition: all 0.2s;
  }

  button:hover {
    background: #ff3355;
    color: #0a0a0f;
    box-shadow: 0 0 20px rgba(255,50,80,0.7);
  }

  .to-be-continued {
    font-family: 'Special Elite', serif;
    font-size: 42px;
    color: #ff3355;
    animation: flicker 2s infinite;
    letter-spacing: 4px;
    text-shadow: 0 0 30px rgba(255,50,80,0.8);
    margin: 14px 0;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    48% { opacity: 1; }
    50% { opacity: 0.3; }
    52% { opacity: 1; }
  }

  .boss-silhouette {
    width: 140px;
    height: 140px;
    background: radial-gradient(circle at 50% 40%, #ff3355 0%, #880022 30%, #000 70%);
    border-radius: 50% 50% 40% 40%;
    margin: 12px auto;
    position: relative;
    animation: pulse-boss 1.5s infinite;
  }
  .boss-silhouette::before, .boss-silhouette::after {
    content: '';
    position: absolute;
    top: 38%;
    width: 18px;
    height: 18px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 12px #ffdd33;
  }
  .boss-silhouette::before { left: 28%; }
  .boss-silhouette::after { right: 28%; }

  @keyframes pulse-boss {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .key-slots {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 18px 0;
  }
  .key-slot {
    width: 52px;
    height: 52px;
    border: 2px dashed #555;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: #333;
    border-radius: 8px;
    transition: all 0.4s;
  }
  .key-slot.filled {
    border: 2px solid #ffdd55;
    color: #ffdd55;
    text-shadow: 0 0 12px rgba(255,221,85,0.9);
    background: rgba(255,221,85,0.08);
    animation: key-place 0.5s;
  }
  @keyframes key-place {
    0% { transform: scale(0.3) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .mobile-controls {
    display: none;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
  }
  .mobile-controls button {
    font-size: 28px;
    padding: 16px 20px;
    margin: 0;
    min-width: 60px;
  }
  @media (hover: none) and (pointer: coarse) {
    .mobile-controls { display: flex; flex-wrap: wrap; }
    h1 { font-size: 28px; }
  }
</style>
</head>
<body>
<div class="game-wrap">
  <h1>MONSTER WORLD</h1>
  <div class="subtitle" id="part-label">— THE ESCAPE —</div>
  <div class="hud">
    <div>LEVEL <span id="level">1</span></div>
    <div class="status" id="status">SNEAK PAST THE LASER</div>
    <div class="keys">KEYS: <span id="keys-icons"></span></div>
    <div id="timer">—</div>
  </div>
  <canvas id="game" width="720" height="480"></canvas>

  <div class="mobile-controls">
    <button data-key="ArrowUp">▲</button>
    <button data-key="ArrowLeft">◄</button>
    <button data-key="ArrowDown">▼</button>
    <button data-key="ArrowRight">►</button>
    <button data-key=" ">SPACE</button>
  </div>

  <div class="overlay" id="overlay"></div>
</div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const overlay = document.getElementById('overlay');
  const levelEl = document.getElementById('level');
  const statusEl = document.getElementById('status');
  const timerEl = document.getElementById('timer');
  const keysIcons = document.getElementById('keys-icons');
  const partLabel = document.getElementById('part-label');

  const keys = {};
  window.addEventListener('keydown', e => { keys[e.key] = true; keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', e => { keys[e.key] = false; keys[e.key.toLowerCase()] = false; });

  document.querySelectorAll('.mobile-controls button').forEach(btn => {
    const k = btn.dataset.key;
    const press = e => { e.preventDefault(); keys[k] = true; };
    const release = e => { e.preventDefault(); keys[k] = false; };
    btn.addEventListener('touchstart', press);
    btn.addEventListener('touchend', release);
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
  });

  let state = 'menu';
  let level = 1;
  let keysEarned = 0;
  let player = { x: 60, y: 240, size: 16, speed: 2.4 };
  let levelStart = 0;
  let laserPhase = 0;
  let guards = [];
  let parts = [];
  let rocket = null;
  let stars = [];
  let kingShip = null;
  let l4Phase = 'build';
  let dialogueIndex = 0;
  let dialogueTimer = 0;

  const throneDialogue = [
    { speaker: 'KING', text: 'We are going to strike in 50 days.' },
    { speaker: 'KING', text: 'You will take the humans on a rocket ship to our planet to mine minerals. We make them work for us.' },
    { speaker: 'PRINCE', text: 'What if I see the rocket?' },
    { speaker: 'KING', text: 'Sure. Come, I will show you.' }
  ];

  function updateKeysDisplay() {
    let html = '';
    for (let i = 0; i < 6; i++) {
      html += i < keysEarned
        ? '<span class="key-icon">⚷</span>'
        : '<span style="color:#333;">⚷</span>';
    }
    keysIcons.innerHTML = html;
  }

  // -------- SHARED --------
  function updatePlayer() {
    let dx = 0, dy = 0;
    if (keys['ArrowUp'] || keys['w']) dy -= 1;
    if (keys['ArrowDown'] || keys['s']) dy += 1;
    if (keys['ArrowLeft'] || keys['a']) dx -= 1;
    if (keys['ArrowRight'] || keys['d']) dx += 1;
    if (dx && dy) { dx *= 0.707; dy *= 0.707; }
    player.x += dx * player.speed;
    player.y += dy * player.speed;
    player.x = Math.max(0, Math.min(W - player.size, player.x));
    player.y = Math.max(0, Math.min(H - player.size, player.y));
  }

  function drawPlayer(x, y) {
    ctx.fillStyle = '#f4c37a';
    ctx.fillRect(x + 4, y, 8, 6);
    ctx.fillStyle = '#3a7aaa';
    ctx.fillRect(x + 2, y + 6, 12, 8);
    ctx.fillStyle = '#222';
    ctx.fillRect(x + 3, y + 14, 4, 2);
    ctx.fillRect(x + 9, y + 14, 4, 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 2, y, 12, 16);
  }

  function pointToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx*dx + dy*dy;
    if (len2 === 0) return Math.hypot(px - x1, py - y1);
    let t = ((px - x1) * dx + (py - y1) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  function updateGuard(g) {
    const target = g.path[g.wp];
    const dx = target.x - g.x, dy = target.y - g.y;
    const d = Math.hypot(dx, dy);
    if (d < 2) { g.wp = (g.wp + 1) % g.path.length; }
    else {
      g.x += (dx / d) * g.speed;
      g.y += (dy / d) * g.speed;
      g.facing = Math.atan2(dy, dx);
    }
  }

  function drawVisionCone(g) {
    const range = 120, spread = 0.6, steps = 24;
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(g.facing);
    const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, range);
    grad.addColorStop(0, 'rgba(255,220,80,0.35)');
    grad.addColorStop(1, 'rgba(255,220,80,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    for (let i = 0; i <= steps; i++) {
      const a = -spread + (spread * 2 * i / steps);
      ctx.lineTo(Math.cos(a) * range, Math.sin(a) * range);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function inVisionCone(g, px, py) {
    const range = 120, spread = 0.6;
    const dx = px - g.x, dy = py - g.y;
    if (Math.hypot(dx, dy) > range) return false;
    let diff = Math.atan2(dy, dx) - g.facing;
    while (diff > Math.PI) diff -= 2 * Math.PI;
    while (diff < -Math.PI) diff += 2 * Math.PI;
    return Math.abs(diff) < spread;
  }

  function drawGuard(g) {
    ctx.fillStyle = '#2a5a3a';
    ctx.beginPath();
    ctx.arc(g.x, g.y, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff3355';
    ctx.beginPath();
    ctx.arc(g.x + Math.cos(g.facing) * 6, g.y + Math.sin(g.facing) * 6, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1a3a28';
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(g.x + Math.cos(a) * 10, g.y + Math.sin(a) * 10);
      ctx.lineTo(g.x + Math.cos(a) * 14, g.y + Math.sin(a) * 14);
      ctx.stroke();
    }
  }

  function wrapText(text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '', curY = y;
    for (const w of words) {
      const test = line + w + ' ';
      if (ctx.measureText(test).width > maxWidth && line) {
        ctx.fillText(line, x, curY);
        line = w + ' ';
        curY += lineHeight;
      } else line = test;
    }
    ctx.fillText(line, x, curY);
  }

  // -------- LEVEL 1 --------
  function initLevel1() {
    level = 1; levelEl.textContent = '1';
    partLabel.textContent = '— THE ESCAPE —';
    player.x = 50; player.y = 240;
    laserPhase = 0;
    statusEl.textContent = 'AVOID THE LASER';
    timerEl.textContent = '—';
  }

  function drawLevel1() {
    ctx.fillStyle = '#181826'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#24243a'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.fillStyle = '#3a2030';
    ctx.fillRect(0, 0, W, 20); ctx.fillRect(0, H-20, W, 20);
    ctx.fillRect(0, 0, 20, H);
    // Entire right wall is now an open exit

    const eg = ctx.createLinearGradient(W-50, 0, W, 0);
    eg.addColorStop(0, 'rgba(80,255,120,0)');
    eg.addColorStop(1, 'rgba(80,255,120,0.35)');
    ctx.fillStyle = eg; ctx.fillRect(W-50, 20, 50, H-40);
    ctx.fillStyle = '#50ff78'; ctx.font = '18px VT323';
    ctx.fillText('EXIT →', W-80, 50);
    ctx.fillText('EXIT →', W-80, H/2);
    ctx.fillText('EXIT →', W-80, H-40);

    ctx.fillStyle = '#2a2a40';
    ctx.fillRect(80, 80, 100, 40); ctx.fillRect(540, 360, 80, 60);
    ctx.strokeStyle = '#44446a';
    ctx.strokeRect(80, 80, 100, 40); ctx.strokeRect(540, 360, 80, 60);

    laserPhase += 0.012;
    const emX = 360, emY = 20;
    const angle = Math.PI/2 + Math.sin(laserPhase) * 0.7;
    const lx = emX + Math.cos(angle) * 460;
    const ly = emY + Math.sin(angle) * 460;

    ctx.fillStyle = '#555'; ctx.fillRect(emX-12, 10, 24, 18);
    ctx.fillStyle = '#ff3355'; ctx.fillRect(emX-4, 24, 8, 6);

    const grad = ctx.createLinearGradient(emX, emY, lx, ly);
    grad.addColorStop(0, 'rgba(255,50,80,1)');
    grad.addColorStop(1, 'rgba(255,50,80,0.4)');
    ctx.strokeStyle = grad; ctx.lineWidth = 3;
    ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(emX, emY); ctx.lineTo(lx, ly); ctx.stroke();
    ctx.shadowBlur = 0;

    drawPlayer(player.x, player.y);

    const pcx = player.x + player.size/2, pcy = player.y + player.size/2;
    if (pointToSegment(pcx, pcy, emX, emY, lx, ly) < player.size/2 + 1) {
      loseGame('THE LASER CAUGHT YOU'); return;
    }
    if (player.x + player.size >= W - 4) winLevel(1);
  }

  // -------- LEVEL 2 --------
  const hideSpots = [
    { x: 80, y: 80, w: 70, h: 40 },
    { x: 240, y: 60, w: 50, h: 30 },
    { x: 120, y: 280, w: 60, h: 60 },
    { x: 360, y: 400, w: 80, h: 40 },
    { x: 540, y: 120, w: 50, h: 50 }
  ];

  function initLevel2() {
    level = 2; levelEl.textContent = '2';
    statusEl.textContent = 'HIDE FOR 1 SECOND';
    player.x = 40; player.y = 240;
    levelStart = performance.now();
    guards = [
      { x: 300, y: 120, path: [{x:300,y:120},{x:500,y:120},{x:500,y:220},{x:300,y:220}], wp: 0, speed: 0.8, facing: 0 },
      { x: 200, y: 360, path: [{x:200,y:360},{x:420,y:360},{x:420,y:300},{x:200,y:300}], wp: 0, speed: 1.0, facing: 0 },
      { x: 600, y: 380, path: [{x:600,y:380},{x:600,y:80},{x:640,y:80},{x:640,y:380}], wp: 0, speed: 0.9, facing: 0 }
    ];
  }

  function inHiding() {
    const cx = player.x + player.size/2, cy = player.y + player.size/2;
    return hideSpots.some(s => cx > s.x && cx < s.x + s.w && cy > s.y && cy < s.y + s.h);
  }

  function drawLevel2() {
    ctx.fillStyle = '#2a1a22'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#3a2028';
    for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.fillStyle = '#4a2a30';
    ctx.fillRect(0, 0, W, 16); ctx.fillRect(0, H-16, W, 16);
    ctx.fillRect(0, 0, 16, H); ctx.fillRect(W-16, 0, 16, H);
    ctx.fillRect(180, 16, 8, 50); ctx.fillRect(460, H-80, 8, 64);

    hideSpots.forEach(s => {
      ctx.fillStyle = '#5a3828'; ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.strokeStyle = '#7a5038'; ctx.strokeRect(s.x, s.y, s.w, s.h);
      ctx.fillStyle = 'rgba(255,220,120,0.1)'; ctx.fillRect(s.x, s.y, s.w, s.h);
    });

    guards.forEach(g => { updateGuard(g); drawVisionCone(g); drawGuard(g); });

    const hidden = inHiding();
    ctx.globalAlpha = hidden ? 0.45 : 1;
    drawPlayer(player.x, player.y);
    ctx.globalAlpha = 1;
    if (hidden) {
      ctx.fillStyle = '#ffdd55'; ctx.font = '14px VT323';
      ctx.fillText('HIDDEN', player.x - 4, player.y - 4);
    }

    if (!hidden) {
      for (const g of guards) {
        if (inVisionCone(g, player.x + player.size/2, player.y + player.size/2)) {
          loseGame('A MONSTER SPOTTED YOU'); return;
        }
      }
    }

    const elapsed = (performance.now() - levelStart) / 1000;
    const remaining = Math.max(0, 1 - elapsed);
    timerEl.textContent = `${Math.floor(remaining/60)}:${Math.floor(remaining%60).toString().padStart(2,'0')}`;
    if (remaining <= 0) winLevel(2);
  }

  // -------- LEVEL 3: THRONE ROOM --------
  function initLevel3() {
    level = 3; levelEl.textContent = '3';
    partLabel.textContent = '— PART 2: INVASION —';
    statusEl.textContent = 'DON\'T GET SPOTTED';
    player.x = 40; player.y = 420;
    dialogueIndex = 0; dialogueTimer = 0;
    timerEl.textContent = '0/' + throneDialogue.length;
    guards = [
      { x: 200, y: 100, path: [{x:200,y:100},{x:520,y:100}], wp: 0, speed: 1.2, facing: 0 },
      { x: 520, y: 360, path: [{x:520,y:360},{x:200,y:360}], wp: 0, speed: 1.1, facing: 0 }
    ];
  }

  function drawLevel3() {
    ctx.fillStyle = '#1a0a20'; ctx.fillRect(0, 0, W, H);
    const cg = ctx.createLinearGradient(0, 0, 0, H);
    cg.addColorStop(0, '#4a1020'); cg.addColorStop(1, '#2a0818');
    ctx.fillStyle = cg; ctx.fillRect(280, 0, 160, H);

    ctx.fillStyle = '#2a1028';
    ctx.fillRect(0, 0, W, 20); ctx.fillRect(0, H-20, W, 20);
    ctx.fillRect(0, 0, 20, H); ctx.fillRect(W-20, 0, 20, H);

    // Pillars (decorative)
    ctx.fillStyle = '#3a1a30';
    ctx.fillRect(540, 220, 50, 60);
    ctx.strokeStyle = '#5a3050'; ctx.strokeRect(540, 220, 50, 60);
    ctx.fillStyle = '#3a1a30';
    ctx.fillRect(130, 220, 50, 60); ctx.strokeRect(130, 220, 50, 60);
    ctx.fillRect(130, 60, 30, 30); ctx.fillRect(560, 60, 30, 30);
    ctx.fillRect(130, 390, 30, 30); ctx.fillRect(560, 390, 30, 30);

    // Throne
    ctx.fillStyle = '#ffdd55'; ctx.fillRect(340, 40, 40, 50);
    ctx.fillStyle = '#aa8833'; ctx.fillRect(340, 80, 40, 10);

    const kingPos = { x: 360, y: 140 };
    const princePos = { x: 360, y: 220 };
    drawKing(kingPos.x, kingPos.y);
    drawPrince(princePos.x, princePos.y);

    guards.forEach(g => { updateGuard(g); drawVisionCone(g); drawGuard(g); });

    const pcx = player.x + player.size/2, pcy = player.y + player.size/2;

    drawPlayer(player.x, player.y);

    // Detection (always active — no hiding spots needed, dialogue plays regardless)
    for (const g of guards) {
      if (inVisionCone(g, pcx, pcy)) { loseGame('THE GUARDS SAW YOU'); return; }
    }

    // Dialogue plays automatically from the moment the level starts
    dialogueTimer += 1/60;
    if (dialogueTimer > 4.0) {
      dialogueTimer = 0;
      dialogueIndex++;
      if (dialogueIndex >= throneDialogue.length) { winLevel(3); return; }
    }

    // Speech bubble next to the current speaker
    if (dialogueIndex < throneDialogue.length) {
      const d = throneDialogue[dialogueIndex];
      const speakerPos = d.speaker === 'KING' ? kingPos : princePos;
      drawSpeechBubble(speakerPos.x, speakerPos.y, d.speaker, d.text);
    }

    timerEl.textContent = `${dialogueIndex}/${throneDialogue.length}`;
  }

  // Draw a speech bubble to the right of (or left of) a character
  function drawSpeechBubble(sx, sy, speaker, text) {
    const padding = 10;
    ctx.font = '18px VT323';
    // Measure text in lines
    const maxWidth = 220;
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
      const test = line + w + ' ';
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line.trim());
        line = w + ' ';
      } else line = test;
    }
    if (line) lines.push(line.trim());

    const lineHeight = 20;
    const boxW = maxWidth + padding * 2;
    const boxH = lineHeight * lines.length + padding * 2 + 18; // +18 for speaker label

    // Position: prefer right side, fall back to left if it would clip
    let bx = sx + 30;
    let by = sy - boxH / 2;
    let pointFromLeft = true;
    if (bx + boxW > W - 30) {
      bx = sx - 30 - boxW;
      pointFromLeft = false;
    }
    by = Math.max(10, Math.min(H - boxH - 10, by));

    // Bubble background
    ctx.fillStyle = 'rgba(10,10,20,0.92)';
    ctx.strokeStyle = speaker === 'KING' ? '#ff3355' : '#ffdd55';
    ctx.lineWidth = 2;
    roundRect(bx, by, boxW, boxH, 8, true, true);

    // Pointer triangle toward speaker
    ctx.beginPath();
    if (pointFromLeft) {
      ctx.moveTo(bx, sy - 6);
      ctx.lineTo(bx - 10, sy);
      ctx.lineTo(bx, sy + 6);
    } else {
      ctx.moveTo(bx + boxW, sy - 6);
      ctx.lineTo(bx + boxW + 10, sy);
      ctx.lineTo(bx + boxW, sy + 6);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(10,10,20,0.92)';
    ctx.fill();
    ctx.stroke();

    // Speaker label
    ctx.fillStyle = speaker === 'KING' ? '#ff6688' : '#ffdd55';
    ctx.font = '16px Special Elite, serif';
    ctx.fillText(speaker + ':', bx + padding, by + padding + 12);

    // Text
    ctx.fillStyle = '#c8f0c8';
    ctx.font = '18px VT323';
    lines.forEach((ln, i) => {
      ctx.fillText(ln, bx + padding, by + padding + 30 + i * lineHeight);
    });
  }

  function roundRect(x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
  }

  function drawKing(x, y) {
    ctx.fillStyle = '#1a0010';
    ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff3355';
    ctx.beginPath(); ctx.arc(x-6, y-2, 3, 0, Math.PI*2); ctx.arc(x+6, y-2, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffdd55';
    ctx.beginPath();
    ctx.moveTo(x-14, y-16); ctx.lineTo(x-10, y-24); ctx.lineTo(x-6, y-18);
    ctx.lineTo(x, y-26); ctx.lineTo(x+6, y-18); ctx.lineTo(x+10, y-24); ctx.lineTo(x+14, y-16);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#440011'; ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const a = (i/8) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a)*18, y + Math.sin(a)*18);
      ctx.lineTo(x + Math.cos(a)*24, y + Math.sin(a)*24);
      ctx.stroke();
    }
  }

  function drawPrince(x, y) {
    ctx.fillStyle = '#3a1a3a';
    ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffdd55';
    ctx.beginPath(); ctx.arc(x-4, y-1, 2, 0, Math.PI*2); ctx.arc(x+4, y-1, 2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffdd55';
    ctx.beginPath();
    ctx.moveTo(x-8, y-12); ctx.lineTo(x-4, y-18); ctx.lineTo(x, y-12);
    ctx.lineTo(x+4, y-18); ctx.lineTo(x+8, y-12);
    ctx.closePath(); ctx.fill();
  }

    parts = [

      { x: 560, y: 100, w: 20, h: 20, name: 'FUEL', got: false, color: '#55ff88' },
      { x: 120, y: 380, w: 20, h: 20, name: 'HULL', got: false, color: '#88aaff' },
      { x: 580, y: 360, w: 20, h: 20, name: 'NAV', got: false, color: '#ff55cc' }
    ];
    guards = [
      { x: 360, y: 240, path: [{x:200,y:240},{x:520,y:240},{x:520,y:140},{x:200,y:140},{x:200,y:340},{x:520,y:340}], wp: 0, speed: 1.2, facing: 0 }
    ];

  function drawLevel4Build() {
    ctx.fillStyle = '#141820'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#22283a';
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    ctx.fillStyle = '#2a3040';
    ctx.fillRect(0, 0, W, 20); ctx.fillRect(0, H-20, W, 20);
    ctx.fillRect(0, 0, 20, H); ctx.fillRect(W-20, 0, 20, H);

    ctx.fillStyle = '#3a2818';
    ctx.fillRect(100, 60, 80, 60); ctx.fillRect(540, 60, 80, 60);
    ctx.fillRect(100, 360, 80, 60); ctx.fillRect(540, 340, 80, 60);

    const allGot = parts.every(p => p.got);
    ctx.fillStyle = allGot ? '#55ff88' : '#3a3a3a';
    ctx.fillRect(W-80, 200, 60, 80);
    ctx.fillStyle = allGot ? '#000' : '#888';
    ctx.font = '14px VT323';
    ctx.fillText(allGot ? 'LAUNCH' : 'LOCKED', W-70, 244);
    if (allGot) {
      ctx.shadowColor = '#55ff88'; ctx.shadowBlur = 14;
      ctx.strokeStyle = '#55ff88'; ctx.lineWidth = 2;
      ctx.strokeRect(W-80, 200, 60, 80);
      ctx.shadowBlur = 0;
    }

    parts.forEach(p => {
      if (p.got) return;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color; ctx.shadowBlur = 10;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff'; ctx.font = '12px VT323';
      ctx.fillText(p.name, p.x - 4, p.y - 4);
    });

    guards.forEach(g => { updateGuard(g); drawVisionCone(g); drawGuard(g); });

    drawPlayer(player.x, player.y);

    const pcx = player.x + player.size/2, pcy = player.y + player.size/2;
    parts.forEach(p => {
      if (!p.got && pcx > p.x - 4 && pcx < p.x + p.w + 4 && pcy > p.y - 4 && pcy < p.y + p.h + 4) {
        p.got = true;
      }
    });

    timerEl.textContent = `${parts.filter(p => p.got).length}/4`;

    for (const g of guards) {
      if (inVisionCone(g, pcx, pcy)) { loseGame('THE ENGINEER CAUGHT YOU'); return; }
    }

    if (allGot && pcx > W-80 && pcy > 200 && pcy < 280) {
      l4Phase = 'fly'; initLevel4Fly();
    }
  }

  // -------- LEVEL 4b: FLY --------
  function initLevel4Fly() {
    statusEl.textContent = 'FLEE TO EARTH';
    timerEl.textContent = '—';
    rocket = { x: W/2, y: H-60, phase: 'launch', launchProgress: 0 };
    kingShip = { x: W/2, y: H + 80, active: false, projectiles: [] };
    stars = [];
    for (let i = 0; i < 80; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, speed: Math.random() * 1.5 + 0.3 });
    }
  }

  function drawLevel4Fly() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    stars.forEach(s => {
      ctx.globalAlpha = s.s / 2.5;
      ctx.fillRect(s.x, s.y, s.s, s.s);
      s.y += s.speed;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    });
    ctx.globalAlpha = 1;

    if (rocket.phase === 'launch') {
      rocket.launchProgress += 1/60;
      rocket.y = Math.max(H/2, H - 60 - rocket.launchProgress * 40);
      drawRocket(rocket.x, rocket.y);
      if (rocket.launchProgress > 2.5) {
        rocket.phase = 'chase';
        kingShip.active = true;
        kingShip.y = H + 40;
        statusEl.textContent = 'DODGE THE KING!';
      }
    } else if (rocket.phase === 'chase') {
      if (keys['ArrowLeft'] || keys['a']) rocket.x -= 3;
      if (keys['ArrowRight'] || keys['d']) rocket.x += 3;
      rocket.x = Math.max(30, Math.min(W-30, rocket.x));

      const earthProgress = Math.min(1, (rocket.launchProgress - 2.5) / 8);
      drawEarth(W/2, -120 + earthProgress * 260, 80 + earthProgress * 40);

      kingShip.y -= 0.8;
      const trackDx = rocket.x - kingShip.x;
      kingShip.x += Math.sign(trackDx) * Math.min(1.2, Math.abs(trackDx) * 0.03);
      drawKingShip(kingShip.x, kingShip.y);

      if (Math.random() < 0.025) {
        kingShip.projectiles.push({ x: kingShip.x, y: kingShip.y - 20, vy: -4 });
      }
      kingShip.projectiles = kingShip.projectiles.filter(p => p.y > -20);
      kingShip.projectiles.forEach(p => {
        p.y += p.vy;
        ctx.fillStyle = '#ff3355';
        ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 8;
        ctx.fillRect(p.x - 2, p.y, 4, 10);
        ctx.shadowBlur = 0;
      });

      for (const p of kingShip.projectiles) {
        if (Math.hypot(p.x - rocket.x, p.y - rocket.y) < 18) {
          loseGame('THE KING SHOT YOU DOWN'); return;
        }
      }
      if (Math.hypot(kingShip.x - rocket.x, kingShip.y - rocket.y) < 40) {
        loseGame('THE KING RAMMED YOU'); return;
      }

      drawRocket(rocket.x, rocket.y);
      rocket.launchProgress += 1/60;
      if (earthProgress >= 1) {
        rocket.phase = 'land'; rocket.landProgress = 0;
      }
    } else if (rocket.phase === 'land') {
      rocket.landProgress += 1/60;
      drawEarth(W/2, 140 + rocket.landProgress * 100, 120 + rocket.landProgress * 200);
      rocket.y += 1;
      drawRocket(rocket.x, rocket.y);
      kingShip.y -= 0.3;
      ctx.globalAlpha = 0.8;
      drawKingShip(kingShip.x, Math.max(kingShip.y, 40));
      ctx.globalAlpha = 1;

      ctx.fillStyle = '#ffdd55'; ctx.font = '22px VT323';
      ctx.fillText('LANDING ON EARTH...', W/2 - 100, 30);

      if (rocket.landProgress > 3) winLevel(4);
    }
  }

  function drawRocket(x, y) {
    ctx.fillStyle = '#ddd';
    ctx.beginPath();
    ctx.moveTo(x, y-20); ctx.lineTo(x-10, y+10); ctx.lineTo(x+10, y+10);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#55aaff';
    ctx.beginPath(); ctx.arc(x, y-5, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff3355';
    ctx.beginPath();
    ctx.moveTo(x-10, y+10); ctx.lineTo(x-16, y+18); ctx.lineTo(x-6, y+10);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x+10, y+10); ctx.lineTo(x+16, y+18); ctx.lineTo(x+6, y+10);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffaa33';
    ctx.beginPath();
    ctx.moveTo(x-5, y+10); ctx.lineTo(x, y+20 + Math.random()*6); ctx.lineTo(x+5, y+10);
    ctx.closePath(); ctx.fill();
  }

  function drawKingShip(x, y) {
    ctx.fillStyle = '#330011';
    ctx.beginPath(); ctx.ellipse(x, y, 36, 18, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#660022';
    ctx.beginPath(); ctx.ellipse(x, y-6, 18, 10, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff3355';
    ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(x-8, y-6, 2, 0, Math.PI*2); ctx.arc(x+8, y-6, 2, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#880022'; ctx.lineWidth = 2;
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath();
      ctx.moveTo(x + i*10, y+12); ctx.lineTo(x + i*10, y+20);
      ctx.stroke();
    }
  }

  function drawEarth(x, y, r) {
    const g = ctx.createRadialGradient(x - r*0.3, y - r*0.3, r*0.2, x, y, r);
    g.addColorStop(0, '#66aaff'); g.addColorStop(0.6, '#2266aa'); g.addColorStop(1, '#112244');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#44aa55';
    ctx.beginPath(); ctx.ellipse(x - r*0.3, y - r*0.1, r*0.3, r*0.2, 0.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + r*0.2, y + r*0.3, r*0.35, r*0.15, -0.3, 0, Math.PI*2); ctx.fill();
  }

  // -------- LEVEL 5: THE WAR --------
  // Multi-phase level:
  // (1) confront - walk up to King, hear his warning
  // (2) sword    - find the glowing sword
  // (3) multiply - use the King's magic rocket, tap/click to double the army five times
  // (4) rally    - player gives the speech, army marches toward monsters
  let l5Phase = 'confront';
  let l5Timer = 0;
  let armyCount = 8_000_000_000; // 8B
  let multiplyStep = 0; // 0..5
  let monsterCount = 80_000_000_000; // 80B
  let kingDialogueIndex = 0;
  let kingDialogueTimer = 0;
  const kingWarPos = { x: 540, y: 240 };
  const swordPos = { x: 120, y: 120 };
  const rocketPos = { x: 360, y: 120 };
  let rocketActivated = false;
  let swordPicked = false;
  let multiplyBtnReady = false;

  const kingWarDialogue = [
    'You HEARD me, human.',
    'I am telling the Prince — we strike EARLY now.',
    'Your world has weeks. Not 50 days. WEEKS.'
  ];

  function initLevel5() {
    level = 5; levelEl.textContent = '5';
    partLabel.textContent = '— PART 3: THE WAR —';
    statusEl.textContent = 'CONFRONT THE KING';
    timerEl.textContent = '—';
    player.x = 40; player.y = 240;
    l5Phase = 'confront';
    l5Timer = 0;
    armyCount = 8_000_000_000;
    multiplyStep = 0;
    kingDialogueIndex = 0;
    kingDialogueTimer = 0;
    rocketActivated = false;
    swordPicked = false;
    multiplyBtnReady = false;
  }

  function formatBig(n) {
    if (n >= 1_000_000_000) return (n / 1_000_000_000).toFixed(n % 1_000_000_000 === 0 ? 0 : 1) + 'B';
    if (n >= 1_000_000) return (n / 1_000_000).toFixed(0) + 'M';
    return n.toString();
  }

  function drawLevel5() {
    // Earth battlefield — green fields with red storm clouds
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#3a1a2a');
    sky.addColorStop(0.5, '#5a3050');
    sky.addColorStop(1, '#2a4a2a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    // Ground
    ctx.fillStyle = '#1a3a20';
    ctx.fillRect(0, H - 120, W, 120);
    ctx.strokeStyle = '#2a5a2a';
    for (let y = H - 110; y < H; y += 20) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // Walls
    ctx.fillStyle = '#2a1a20';
    ctx.fillRect(0, 0, W, 16); ctx.fillRect(0, H-16, W, 16);
    ctx.fillRect(0, 0, 16, H); ctx.fillRect(W-16, 0, 16, H);

    const pcx = player.x + player.size/2, pcy = player.y + player.size/2;

    if (l5Phase === 'confront') {
      statusEl.textContent = 'CONFRONT THE KING';
      drawKing(kingWarPos.x, kingWarPos.y);
      drawPlayer(player.x, player.y);

      // Distance check — when close, trigger dialogue
      const dist = Math.hypot(pcx - kingWarPos.x, pcy - kingWarPos.y);
      if (dist < 80) {
        kingDialogueTimer += 1/60;
        if (kingDialogueIndex < kingWarDialogue.length) {
          drawSpeechBubble(kingWarPos.x, kingWarPos.y, 'KING', kingWarDialogue[kingDialogueIndex]);
          if (kingDialogueTimer > 3.5) {
            kingDialogueTimer = 0;
            kingDialogueIndex++;
          }
        } else {
          // Dialogue finished — King teleports away, sword phase begins
          l5Phase = 'sword';
          statusEl.textContent = 'FIND THE SWORD';
        }
        // Hint
        ctx.fillStyle = '#ffdd55'; ctx.font = '14px VT323';
        ctx.fillText(`LISTENING ${kingDialogueIndex + 1}/${kingWarDialogue.length}`, 20, H - 40);
      } else {
        ctx.fillStyle = '#ffdd55'; ctx.font = '18px VT323';
        ctx.fillText('→ Approach the King', 20, H - 40);
      }
      timerEl.textContent = `${kingDialogueIndex}/${kingWarDialogue.length}`;
    }

    else if (l5Phase === 'sword') {
      // Sword glowing in upper-left, king's magic rocket glowing in top-center
      // Player must pick up sword first
      const t = performance.now() / 300;
      const glow = 8 + Math.sin(t) * 4;

      ctx.shadowColor = '#ffdd55'; ctx.shadowBlur = glow * 2;
      // Sword shape
      ctx.strokeStyle = '#ffdd55'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(swordPos.x, swordPos.y - 20);
      ctx.lineTo(swordPos.x, swordPos.y + 20);
      ctx.stroke();
      ctx.strokeStyle = '#ffaa33'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(swordPos.x - 10, swordPos.y + 10);
      ctx.lineTo(swordPos.x + 10, swordPos.y + 10);
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#ffdd55'; ctx.font = '14px VT323';
      ctx.fillText('SWORD', swordPos.x - 20, swordPos.y - 30);

      drawPlayer(player.x, player.y);

      if (Math.hypot(pcx - swordPos.x, pcy - swordPos.y) < 25) {
        swordPicked = true;
        l5Phase = 'rocket';
        statusEl.textContent = 'USE THE KING\'S ROCKET';
      }

      ctx.fillStyle = '#ffdd55'; ctx.font = '18px VT323';
      ctx.fillText('→ Grab the sword', 20, H - 40);
    }

    else if (l5Phase === 'rocket') {
      // Rocket pulsing red-gold
      const t = performance.now() / 400;
      const pulse = 0.7 + Math.sin(t) * 0.3;

      // Draw player holding sword
      drawPlayer(player.x, player.y);
      ctx.strokeStyle = '#ffdd55'; ctx.lineWidth = 2;
      ctx.shadowColor = '#ffdd55'; ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.moveTo(player.x + 16, player.y + 2);
      ctx.lineTo(player.x + 24, player.y - 6);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // King's magic rocket
      ctx.save();
      ctx.translate(rocketPos.x, rocketPos.y);
      ctx.shadowColor = '#ff3355';
      ctx.shadowBlur = 20 * pulse;
      ctx.fillStyle = '#660022';
      ctx.beginPath();
      ctx.moveTo(0, -30);
      ctx.lineTo(-14, 20);
      ctx.lineTo(14, 20);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ff3355';
      ctx.beginPath(); ctx.arc(0, -10, 5, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();

      ctx.fillStyle = '#ff6688'; ctx.font = '14px VT323';
      ctx.fillText('MAGIC ROCKET', rocketPos.x - 44, rocketPos.y - 42);

      if (Math.hypot(pcx - rocketPos.x, pcy - rocketPos.y) < 35) {
        rocketActivated = true;
        l5Phase = 'multiply';
        multiplyStep = 0;
        multiplyBtnReady = true;
        statusEl.textContent = 'MULTIPLY THE ARMY';
      }

      ctx.fillStyle = '#ffdd55'; ctx.font = '18px VT323';
      ctx.fillText('→ Take the sword to the magic rocket', 20, H - 40);
    }

    else if (l5Phase === 'multiply') {
      // Full-screen multiplication mini-game
      // Show army count and monster count, and a MULTIPLY button (keyboard: SPACE)
      drawMultiplyScene();

      // Keyboard input: space to double
      if ((keys[' '] || keys['Enter']) && multiplyBtnReady) {
        multiplyBtnReady = false;
        armyCount *= 2;
        multiplyStep++;
        setTimeout(() => { multiplyBtnReady = true; }, 600);
        if (multiplyStep >= 4) {
          // final value will be 128B at step 4 -> 8*2^4=128B
          setTimeout(() => {
            l5Phase = 'rally';
            l5Timer = 0;
            statusEl.textContent = 'RALLY HUMANITY';
          }, 1200);
        }
      }

      timerEl.textContent = `${multiplyStep}/4`;
    }

    else if (l5Phase === 'rally') {
      drawRallyScene();
      l5Timer += 1/60;
      if (l5Timer > 7) {
        winLevel(5);
      }
      timerEl.textContent = 'FINAL';
    }
  }

  // Tap to multiply scene
  function drawMultiplyScene() {
    // Dark cosmic background
    ctx.fillStyle = '#0a0614'; ctx.fillRect(0, 0, W, H);
    // Stars
    for (let i = 0; i < 60; i++) {
      const sx = (i * 97) % W;
      const sy = (i * 53) % H;
      ctx.fillStyle = `rgba(255,255,255,${0.3 + (i % 3) * 0.2})`;
      ctx.fillRect(sx, sy, 2, 2);
    }

    // Title
    ctx.fillStyle = '#ffdd55';
    ctx.font = '28px Special Elite, serif';
    ctx.textAlign = 'center';
    ctx.fillText('THE KING\'S ROCKET MULTIPLIES', W/2, 60);
    ctx.textAlign = 'left';

    // Earth on left
    drawEarth(180, 240, 90);
    ctx.fillStyle = '#55ff88';
    ctx.font = '20px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('HUMANITY', 180, 360);
    ctx.font = '32px Special Elite, serif';
    ctx.shadowColor = '#55ff88'; ctx.shadowBlur = 14;
    ctx.fillText(formatBig(armyCount), 180, 400);
    ctx.shadowBlur = 0;

    // Monster planet on right
    drawMonsterPlanet(540, 240, 90);
    ctx.fillStyle = '#ff3355';
    ctx.font = '20px VT323';
    ctx.fillText('MONSTERS', 540, 360);
    ctx.font = '32px Special Elite, serif';
    ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 14;
    ctx.fillText(formatBig(monsterCount), 540, 400);
    ctx.shadowBlur = 0;
    ctx.textAlign = 'left';

    // Multiply button indicator
    const btnY = H - 50;
    const btnPulse = Math.sin(performance.now() / 200) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255,221,85,${multiplyBtnReady ? btnPulse : 0.25})`;
    ctx.fillRect(W/2 - 140, btnY - 20, 280, 36);
    ctx.strokeStyle = '#ffdd55'; ctx.lineWidth = 2;
    ctx.strokeRect(W/2 - 140, btnY - 20, 280, 36);
    ctx.fillStyle = multiplyBtnReady ? '#0a0614' : '#555';
    ctx.font = '20px VT323';
    ctx.textAlign = 'center';
    ctx.fillText(multiplyBtnReady ? '[SPACE] TO MULTIPLY ×2' : 'MULTIPLYING...', W/2, btnY + 4);
    ctx.textAlign = 'left';

    // Progress pips
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = i < multiplyStep ? '#ffdd55' : '#333';
      ctx.fillRect(W/2 - 60 + i * 32, btnY - 40, 20, 8);
    }

    // Sequence text
    const seq = ['8B', '16B', '32B', '64B', '128B'];
    ctx.fillStyle = '#88aa88'; ctx.font = '18px VT323';
    ctx.textAlign = 'center';
    ctx.fillText(seq.slice(0, multiplyStep + 1).join(' → '), W/2, 100);
    ctx.textAlign = 'left';
  }

  function drawMonsterPlanet(x, y, r) {
    const g = ctx.createRadialGradient(x - r*0.3, y - r*0.3, r*0.2, x, y, r);
    g.addColorStop(0, '#ff6688'); g.addColorStop(0.6, '#882244'); g.addColorStop(1, '#220011');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    // Spikes
    ctx.strokeStyle = '#440011'; ctx.lineWidth = 2;
    for (let i = 0; i < 12; i++) {
      const a = (i/12) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
      ctx.lineTo(x + Math.cos(a) * (r + 10), y + Math.sin(a) * (r + 10));
      ctx.stroke();
    }
  }

  function drawRallyScene() {
    // Earth surface with rising army
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#2a1a3a');
    sky.addColorStop(0.5, '#5a4070');
    sky.addColorStop(1, '#2a5a3a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    // Ground
    ctx.fillStyle = '#1a3a20'; ctx.fillRect(0, H - 140, W, 140);

    // Player on a raised platform
    ctx.fillStyle = '#3a2818';
    ctx.fillRect(W/2 - 50, H - 160, 100, 20);

    // Army of little figures — density grows over time
    const density = Math.min(1, l5Timer / 4);
    const rows = 5;
    const maxPerRow = 40;
    for (let r = 0; r < rows; r++) {
      const y = H - 100 + r * 18;
      const count = Math.floor(maxPerRow * density);
      for (let i = 0; i < count; i++) {
        const x = (W / (maxPerRow + 1)) * (i + 1) + (r % 2 === 0 ? 0 : 8);
        // tiny person
        ctx.fillStyle = '#f4c37a';
        ctx.fillRect(x, y, 3, 2);
        ctx.fillStyle = '#3a7aaa';
        ctx.fillRect(x - 1, y + 2, 5, 4);
        // tiny glowing sword
        ctx.fillStyle = '#ffdd55';
        ctx.fillRect(x + 5, y - 2, 1, 6);
      }
    }

    // Player hero
    const px = W/2 - 8, py = H - 180;
    drawPlayer(px, py);
    // Raised sword
    ctx.strokeStyle = '#ffdd55'; ctx.lineWidth = 3;
    ctx.shadowColor = '#ffdd55'; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(px + 14, py + 4);
    ctx.lineTo(px + 26, py - 20);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Speech
    ctx.fillStyle = 'rgba(10,10,20,0.85)';
    ctx.fillRect(W/2 - 280, 60, 560, 80);
    ctx.strokeStyle = '#ffdd55';
    ctx.strokeRect(W/2 - 280, 60, 560, 80);
    ctx.fillStyle = '#ffdd55';
    ctx.font = '22px Special Elite, serif';
    ctx.textAlign = 'center';
    ctx.fillText('"WE WILL FIGHT FOR ALL', W/2, 95);
    ctx.fillText('OF OUR SAKES."', W/2, 125);
    ctx.textAlign = 'left';

    // Stat bar at bottom
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(20, H - 40, W - 40, 28);
    ctx.fillStyle = '#55ff88'; ctx.font = '18px VT323';
    ctx.fillText('HUMANITY: 128B', 40, H - 20);
    ctx.fillStyle = '#ff3355';
    ctx.fillText('MONSTERS: 80B', 280, H - 20);
    ctx.fillStyle = '#ffdd55';
    ctx.fillText('WE OUTNUMBER THEM', 480, H - 20);
  }

  // -------- LEVEL 6: THE WAR BREAKS OUT --------
  // Phases:
  // (a) kingFight  - duel the King with swords (HP-based melee)
  // (b) transform  - fight waves of monsters; SPACE to swing; each hit TURNS the enemy into a human
  // (c) gem        - pick up a glowing gem and throw it into the dark rift, then retrieve it
  // (d) freeing    - use the gem to shatter monster cages, freeing caged civilizations
  // (e) kraken     - a kraken rises, screen shakes, win transitions
  let l6Phase = 'kingFight';
  let kingHP = 5;
  let playerHP = 5;
  let kingDuel = { x: 540, y: 240, attackCooldown: 0, telegraph: 0, attacking: false };
  let playerAttack = { cooldown: 0, swinging: 0, dir: 1 };
  let transformEnemies = [];
  let humansFreed = [];
  let l6Timer = 0;
  let gemState = { x: 120, y: 240, phase: 'pickup', carried: false, thrown: false, throwT: 0, retrieveT: 0 };
  let darkRift = { x: W - 100, y: 240, size: 60, opened: false };
  let cages = [];
  let krakenState = { rising: 0, shake: 0 };

  function initLevel6() {
    level = 6; levelEl.textContent = '6';
    partLabel.textContent = '— PART 3: THE WAR —';
    statusEl.textContent = 'FIGHT THE KING';
    timerEl.textContent = 'HP: 5';
    player.x = 120; player.y = 240;
    l6Phase = 'kingFight';
    kingHP = 5;
    playerHP = 5;
    kingDuel = { x: 540, y: 240, attackCooldown: 60, telegraph: 0, attacking: false };
    playerAttack = { cooldown: 0, swinging: 0, dir: 1 };
    l6Timer = 0;
  }

  function initL6Transform() {
    l6Phase = 'transform';
    statusEl.textContent = 'TURN THEM HUMAN';
    player.x = 60; player.y = 240;
    transformEnemies = [];
    humansFreed = [];
    // Spawn 6 monsters scattered around
    const spawns = [
      {x: 200, y: 100}, {x: 400, y: 140}, {x: 600, y: 120},
      {x: 200, y: 380}, {x: 420, y: 380}, {x: 580, y: 360}
    ];
    spawns.forEach(s => transformEnemies.push({
      x: s.x, y: s.y, hp: 1, state: 'monster', angle: 0, hitFlash: 0
    }));
  }

  function initL6Gem() {
    l6Phase = 'gem';
    statusEl.textContent = 'GRAB THE GEM';
    player.x = 60; player.y = 240;
    gemState = { x: 150, y: 240, phase: 'pickup', carried: false, thrown: false, throwT: 0, retrieveT: 0 };
    darkRift = { x: W - 100, y: 240, size: 60, opened: true };
    timerEl.textContent = 'GEM';
  }

  function initL6Freeing() {
    l6Phase = 'freeing';
    statusEl.textContent = 'FREE THE CIVILIZATIONS';
    player.x = 60; player.y = 240;
    cages = [
      { x: 220, y: 100, w: 60, h: 50, name: 'ELDAR', color: '#88aaff', freed: false },
      { x: 420, y: 100, w: 60, h: 50, name: 'VORN', color: '#ff8833', freed: false },
      { x: 580, y: 240, w: 60, h: 50, name: 'GLINT', color: '#55ff88', freed: false },
      { x: 420, y: 380, w: 60, h: 50, name: 'ZEPH', color: '#ff55cc', freed: false },
      { x: 220, y: 380, w: 60, h: 50, name: 'KUURI', color: '#ffdd55', freed: false }
    ];
    timerEl.textContent = '0/5';
  }

  function initL6Kraken() {
    l6Phase = 'kraken';
    statusEl.textContent = 'IT IS THE END';
    krakenState = { rising: 0, shake: 0 };
    timerEl.textContent = '—';
  }

  function drawLevel6() {
    if (l6Phase === 'kingFight') drawL6KingFight();
    else if (l6Phase === 'transform') drawL6Transform();
    else if (l6Phase === 'gem') drawL6Gem();
    else if (l6Phase === 'freeing') drawL6Freeing();
    else if (l6Phase === 'kraken') drawL6Kraken();
  }

  // ----- Phase A: Duel the King -----
  function drawL6KingFight() {
    // Battlefield
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#4a1020'); sky.addColorStop(1, '#2a2a3a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#1a2a20'; ctx.fillRect(0, H - 120, W, 120);

    // Smoke / fire dots
    for (let i = 0; i < 30; i++) {
      const t = (performance.now() / 40 + i * 37) % (W + 100);
      ctx.fillStyle = `rgba(255,${100 + (i*13)%100},50,0.15)`;
      ctx.fillRect(t - 50, 200 + (i * 11) % 80, 3, 3);
    }

    // King
    const k = kingDuel;
    // Telegraph: flash red before attack
    if (k.telegraph > 0) {
      ctx.fillStyle = `rgba(255,50,80,${k.telegraph / 30})`;
      ctx.fillRect(k.x - 30, k.y - 30, 60, 60);
    }
    drawKing(k.x, k.y);
    // King's sword
    ctx.strokeStyle = '#ff3355'; ctx.lineWidth = 4;
    ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 8;
    const kSwordExt = k.attacking ? 40 : 22;
    ctx.beginPath();
    ctx.moveTo(k.x - 18, k.y);
    ctx.lineTo(k.x - 18 - kSwordExt, k.y - 8);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Player
    drawPlayer(player.x, player.y);
    // Player's sword (swinging animation)
    ctx.strokeStyle = '#ffdd55'; ctx.lineWidth = 3;
    ctx.shadowColor = '#ffdd55'; ctx.shadowBlur = 8;
    let swordEndX = player.x + 18, swordEndY = player.y;
    if (playerAttack.swinging > 0) {
      swordEndX = player.x + 18 + 30;
      swordEndY = player.y + 4;
    }
    ctx.beginPath();
    ctx.moveTo(player.x + 14, player.y + 4);
    ctx.lineTo(swordEndX, swordEndY);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // HP bars
    drawHPBar(40, 30, playerHP, 5, '#55ff88', 'YOU');
    drawHPBar(W - 180, 30, kingHP, 5, '#ff3355', 'KING');

    // Attack input
    if (playerAttack.cooldown > 0) playerAttack.cooldown--;
    if (playerAttack.swinging > 0) playerAttack.swinging--;
    if ((keys[' '] || keys['Enter']) && playerAttack.cooldown <= 0) {
      playerAttack.cooldown = 30;
      playerAttack.swinging = 10;
      // Hit check: distance between player and king
      const dx = k.x - (player.x + 8);
      const dy = k.y - (player.y + 8);
      const dist = Math.hypot(dx, dy);
      if (dist < 70) {
        kingHP--;
        k.x += 20; // knockback
      }
    }

    // King AI
    if (k.attackCooldown > 0) k.attackCooldown--;
    // Move toward player if far
    const dx = (player.x + 8) - k.x;
    const dy = (player.y + 8) - k.y;
    const distToP = Math.hypot(dx, dy);
    if (distToP > 60 && !k.attacking) {
      k.x += Math.sign(dx) * 1.2;
      k.y += Math.sign(dy) * 0.8;
    }
    // Attack telegraph + swing
    if (k.attackCooldown <= 0 && distToP < 80 && !k.attacking) {
      k.telegraph = 30;
      k.attackCooldown = 120;
    }
    if (k.telegraph > 0) {
      k.telegraph--;
      if (k.telegraph === 0) {
        k.attacking = true;
        // Immediate hit if player still in range
        if (distToP < 80) {
          playerHP--;
        }
        setTimeout(() => { k.attacking = false; }, 300);
      }
    }

    // Clamp positions
    k.x = Math.max(40, Math.min(W - 40, k.x));
    k.y = Math.max(40, Math.min(H - 40, k.y));

    timerEl.textContent = `HP: ${playerHP}`;

    // Hint
    ctx.fillStyle = '#ffdd55'; ctx.font = '16px VT323';
    ctx.fillText('[SPACE] to swing', 20, H - 20);

    // Win/lose
    if (kingHP <= 0) {
      setTimeout(() => { initL6Transform(); }, 100);
      l6Phase = 'kingFight_done'; // prevent double-trigger
    }
    if (playerHP <= 0) {
      loseGame('THE KING STRUCK YOU DOWN');
    }
  }

  function drawHPBar(x, y, hp, max, color, label) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(x - 4, y - 4, 150, 28);
    ctx.fillStyle = '#fff'; ctx.font = '14px VT323';
    ctx.fillText(label, x, y - 6);
    for (let i = 0; i < max; i++) {
      ctx.fillStyle = i < hp ? color : '#333';
      ctx.fillRect(x + i * 28, y, 24, 16);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
      ctx.strokeRect(x + i * 28, y, 24, 16);
    }
  }

  // ----- Phase B: Transform enemies by hitting them -----
  function drawL6Transform() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#3a1a3a'); sky.addColorStop(1, '#1a3a2a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#1a3a20'; ctx.fillRect(0, H - 100, W, 100);

    // Walls
    ctx.fillStyle = '#2a1a20';
    ctx.fillRect(0, 0, W, 12); ctx.fillRect(0, H-12, W, 12);
    ctx.fillRect(0, 0, 12, H); ctx.fillRect(W-12, 0, 12, H);

    // Player
    drawPlayer(player.x, player.y);
    ctx.strokeStyle = '#ffdd55'; ctx.lineWidth = 3;
    ctx.shadowColor = '#ffdd55'; ctx.shadowBlur = 8;
    let swordEndX = player.x + 20 + (playerAttack.swinging > 0 ? 20 : 0);
    ctx.beginPath();
    ctx.moveTo(player.x + 14, player.y + 4);
    ctx.lineTo(swordEndX, player.y + 2);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Enemies and their tools (they also can't kill you — they transform on contact)
    transformEnemies.forEach(e => {
      if (e.state === 'monster') {
        // Slow wander toward player
        const dx = (player.x + 8) - e.x;
        const dy = (player.y + 8) - e.y;
        const d = Math.hypot(dx, dy);
        if (d > 1) {
          e.x += (dx / d) * 0.6;
          e.y += (dy / d) * 0.6;
        }
        // Draw monster
        ctx.fillStyle = e.hitFlash > 0 ? '#fff' : '#2a5a3a';
        ctx.beginPath(); ctx.arc(e.x, e.y, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ff3355';
        ctx.beginPath(); ctx.arc(e.x - 3, e.y - 2, 2, 0, Math.PI*2); ctx.arc(e.x + 3, e.y - 2, 2, 0, Math.PI*2); ctx.fill();
        // Their "tool" — a small weapon
        ctx.strokeStyle = '#aa4433'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(e.x + 8, e.y); ctx.lineTo(e.x + 14, e.y - 4);
        ctx.stroke();
        if (e.hitFlash > 0) e.hitFlash--;

        // Contact with player -> transforms PLAYER into monster briefly (no damage, just visual)
        if (d < 16) {
          // nudge player back to avoid repeated contact - but don't end game; it just doesn't kill
          player.x -= Math.sign(dx) * 2;
          player.y -= Math.sign(dy) * 2;
        }
      } else {
        // Transformed to human — stays in place, waves
        ctx.fillStyle = '#f4c37a';
        ctx.fillRect(e.x - 4, e.y - 8, 8, 6);
        ctx.fillStyle = '#3a7aaa';
        ctx.fillRect(e.x - 6, e.y - 2, 12, 8);
        ctx.fillStyle = '#ffdd55'; ctx.font = '12px VT323';
        ctx.fillText('FREE', e.x - 12, e.y - 14);
      }
    });

    // Swing attack
    if (playerAttack.cooldown > 0) playerAttack.cooldown--;
    if (playerAttack.swinging > 0) playerAttack.swinging--;
    if ((keys[' '] || keys['Enter']) && playerAttack.cooldown <= 0) {
      playerAttack.cooldown = 20;
      playerAttack.swinging = 8;
      transformEnemies.forEach(e => {
        if (e.state === 'monster') {
          const dx = e.x - (player.x + 16);
          const dy = e.y - (player.y + 8);
          if (Math.hypot(dx, dy) < 40) {
            e.state = 'human';
            e.hitFlash = 6;
          }
        }
      });
    }

    // HUD
    const remaining = transformEnemies.filter(e => e.state === 'monster').length;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(20, 20, 300, 50);
    ctx.fillStyle = '#ffdd55'; ctx.font = '18px VT323';
    ctx.fillText('Swords don\'t kill. They TRANSFORM.', 30, 42);
    ctx.fillStyle = '#55ff88';
    ctx.fillText(`Monsters remaining: ${remaining}`, 30, 62);

    timerEl.textContent = `${transformEnemies.length - remaining}/${transformEnemies.length}`;

    // Hint
    ctx.fillStyle = '#ffdd55'; ctx.font = '16px VT323';
    ctx.fillText('[SPACE] to swing', 20, H - 20);

    // Phase complete when all are transformed
    if (remaining === 0) {
      setTimeout(() => { initL6Gem(); }, 400);
      l6Phase = 'transform_done';
    }
  }

  // ----- Phase C: Pick up gem, throw into rift, retrieve -----
  function drawL6Gem() {
    ctx.fillStyle = '#0a0614'; ctx.fillRect(0, 0, W, H);
    // Stars
    for (let i = 0; i < 80; i++) {
      const sx = (i * 91) % W, sy = (i * 67) % H;
      ctx.fillStyle = `rgba(200,180,255,${0.2 + (i % 4) * 0.15})`;
      ctx.fillRect(sx, sy, 2, 2);
    }
    // Ground
    ctx.fillStyle = '#1a1028'; ctx.fillRect(0, H - 80, W, 80);

    // Dark rift (right side) — pulsing black hole
    const t = performance.now() / 300;
    const rPulse = darkRift.size + Math.sin(t) * 8;
    const gr = ctx.createRadialGradient(darkRift.x, darkRift.y, 5, darkRift.x, darkRift.y, rPulse);
    gr.addColorStop(0, '#000');
    gr.addColorStop(0.6, '#1a0028');
    gr.addColorStop(1, 'rgba(80,20,120,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(darkRift.x, darkRift.y, rPulse + 20, 0, Math.PI*2); ctx.fill();
    // Swirl lines
    ctx.strokeStyle = 'rgba(180,100,255,0.4)'; ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      for (let a = 0; a < Math.PI * 4; a += 0.1) {
        const rr = rPulse * (1 - a / (Math.PI * 4));
        const px = darkRift.x + Math.cos(a + t + i) * rr;
        const py = darkRift.y + Math.sin(a + t + i) * rr;
        if (a === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }

    // Gem logic
    if (gemState.phase === 'pickup') {
      drawGem(gemState.x, gemState.y);
      const pcx = player.x + 8, pcy = player.y + 8;
      if (Math.hypot(pcx - gemState.x, pcy - gemState.y) < 20) {
        gemState.carried = true;
        gemState.phase = 'throw';
        statusEl.textContent = 'THROW INTO THE RIFT [SPACE]';
      }
      ctx.fillStyle = '#ffdd55'; ctx.font = '16px VT323';
      ctx.fillText('→ Grab the gem', 20, 40);
    } else if (gemState.phase === 'throw') {
      // Gem floats above player
      drawGem(player.x + 8, player.y - 10);
      ctx.fillStyle = '#ffdd55'; ctx.font = '16px VT323';
      ctx.fillText('→ Press [SPACE] near the dark rift to throw', 20, 40);

      const nearRift = Math.hypot(player.x + 8 - darkRift.x, player.y + 8 - darkRift.y) < 140;
      if (nearRift && (keys[' '] || keys['Enter']) && playerAttack.cooldown <= 0) {
        playerAttack.cooldown = 30;
        gemState.phase = 'flying';
        gemState.throwT = 0;
        gemState.startX = player.x + 8;
        gemState.startY = player.y + 8;
      }
      if (playerAttack.cooldown > 0) playerAttack.cooldown--;
    } else if (gemState.phase === 'flying') {
      gemState.throwT += 1/60;
      const p = Math.min(1, gemState.throwT / 0.8);
      const gx = gemState.startX + (darkRift.x - gemState.startX) * p;
      const gy = gemState.startY + (darkRift.y - gemState.startY) * p - Math.sin(p * Math.PI) * 80;
      drawGem(gx, gy);
      if (p >= 1) {
        gemState.phase = 'inRift';
        gemState.retrieveT = 0;
        statusEl.textContent = 'GET IT BACK — FAST!';
      }
    } else if (gemState.phase === 'inRift') {
      // Gem is in rift glowing darkly; player has 4 seconds to touch the rift
      gemState.retrieveT += 1/60;
      // Pulse the rift ominously
      ctx.fillStyle = `rgba(255,50,80,${0.2 + Math.sin(performance.now()/100) * 0.2})`;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#ff3355'; ctx.font = '22px Special Elite';
      ctx.textAlign = 'center';
      ctx.fillText(`${(4 - gemState.retrieveT).toFixed(1)}s`, darkRift.x, darkRift.y - 90);
      ctx.textAlign = 'left';

      if (Math.hypot(player.x + 8 - darkRift.x, player.y + 8 - darkRift.y) < 60) {
        gemState.phase = 'retrieved';
        setTimeout(() => { initL6Freeing(); }, 400);
        l6Phase = 'gem_done';
      }
      if (gemState.retrieveT > 4) {
        loseGame('THE RIFT CONSUMED THE GEM');
      }
    }

    // Player on top
    drawPlayer(player.x, player.y);

    // Hint: walk near rift
    if (gemState.phase === 'inRift') {
      ctx.fillStyle = '#ffdd55'; ctx.font = '18px VT323';
      ctx.textAlign = 'center';
      ctx.fillText('RUN TO THE RIFT!', W/2, 60);
      ctx.textAlign = 'left';
    }
  }

  function drawGem(x, y) {
    const t = performance.now() / 200;
    ctx.shadowColor = '#ff55cc'; ctx.shadowBlur = 14 + Math.sin(t) * 4;
    ctx.fillStyle = '#ff55cc';
    ctx.beginPath();
    ctx.moveTo(x, y - 10);
    ctx.lineTo(x + 8, y);
    ctx.lineTo(x, y + 10);
    ctx.lineTo(x - 8, y);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x - 3, y - 3); ctx.lineTo(x + 3, y + 3);
    ctx.stroke();
  }

  // ----- Phase D: Free 5 civilizations with the gem -----
  function drawL6Freeing() {
    ctx.fillStyle = '#1a0a28'; ctx.fillRect(0, 0, W, H);
    // Stars
    for (let i = 0; i < 40; i++) {
      const sx = (i * 83) % W, sy = (i * 59) % H;
      ctx.fillStyle = `rgba(200,180,255,0.3)`;
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.fillStyle = '#2a1038';
    ctx.fillRect(0, 0, W, 12); ctx.fillRect(0, H-12, W, 12);
    ctx.fillRect(0, 0, 12, H); ctx.fillRect(W-12, 0, 12, H);

    // Cages
    cages.forEach(c => {
      if (c.freed) {
        // Freed — show glowing civilization
        ctx.fillStyle = c.color;
        ctx.shadowColor = c.color; ctx.shadowBlur = 14;
        ctx.fillRect(c.x + 10, c.y + 10, c.w - 20, c.h - 20);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff'; ctx.font = '14px VT323';
        ctx.fillText(c.name + ' FREE', c.x, c.y - 4);
      } else {
        // Cage bars
        ctx.fillStyle = '#222';
        ctx.fillRect(c.x, c.y, c.w, c.h);
        ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
        for (let bx = c.x + 6; bx < c.x + c.w; bx += 8) {
          ctx.beginPath(); ctx.moveTo(bx, c.y); ctx.lineTo(bx, c.y + c.h); ctx.stroke();
        }
        ctx.strokeRect(c.x, c.y, c.w, c.h);
        // Dimmed people inside
        ctx.fillStyle = `rgba(${parseInt(c.color.slice(1,3),16)},${parseInt(c.color.slice(3,5),16)},${parseInt(c.color.slice(5,7),16)},0.3)`;
        ctx.fillRect(c.x + 10, c.y + 10, c.w - 20, c.h - 20);
        ctx.fillStyle = '#aaa'; ctx.font = '14px VT323';
        ctx.fillText(c.name, c.x, c.y - 4);
      }
    });

    // Player with gem
    drawPlayer(player.x, player.y);
    drawGem(player.x + 8, player.y - 10);

    // Check contact with cages
    cages.forEach(c => {
      if (!c.freed) {
        const pcx = player.x + 8, pcy = player.y + 8;
        if (pcx > c.x - 8 && pcx < c.x + c.w + 8 && pcy > c.y - 8 && pcy < c.y + c.h + 8) {
          c.freed = true;
        }
      }
    });

    const freedCount = cages.filter(c => c.freed).length;
    timerEl.textContent = `${freedCount}/${cages.length}`;

    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(20, 20, 320, 34);
    ctx.fillStyle = '#ffdd55'; ctx.font = '18px VT323';
    ctx.fillText('Touch cages with the gem to free them', 30, 42);

    if (freedCount === cages.length) {
      setTimeout(() => { initL6Kraken(); }, 600);
      l6Phase = 'freeing_done';
    }
  }

  // ----- Phase E: The kraken rises -----
  function drawL6Kraken() {
    krakenState.rising += 1/60;
    krakenState.shake = Math.sin(performance.now() / 50) * 4 * Math.min(1, krakenState.rising / 2);

    ctx.save();
    ctx.translate(krakenState.shake, krakenState.shake * 0.5);

    // Sky going dark
    const darkness = Math.min(1, krakenState.rising / 4);
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, `rgba(10,0,20,${0.5 + darkness * 0.5})`);
    sky.addColorStop(1, `rgba(20,10,30,${0.3 + darkness * 0.5})`);
    ctx.fillStyle = '#0a0614'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    // Ocean line — rises over time
    const oceanY = H - 100 + (1 - Math.min(1, krakenState.rising / 6)) * 50;
    ctx.fillStyle = '#0a1a2a';
    ctx.fillRect(0, oceanY, W, H - oceanY);
    // Waves
    ctx.strokeStyle = 'rgba(80,120,200,0.3)';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      for (let x = 0; x < W; x += 20) {
        const y = oceanY + i * 8 + Math.sin((x + performance.now()/100) / 30) * 4;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    // Kraken tentacles rising
    const riseAmount = Math.min(1, krakenState.rising / 3);
    const tentacles = [
      { baseX: 150, phase: 0 },
      { baseX: 280, phase: 1.5 },
      { baseX: 440, phase: 0.7 },
      { baseX: 570, phase: 2.2 }
    ];
    tentacles.forEach(tn => {
      const baseY = oceanY;
      const topY = oceanY - 280 * riseAmount;
      ctx.strokeStyle = '#4a1a5a';
      ctx.lineWidth = 20;
      ctx.lineCap = 'round';
      ctx.beginPath();
      const segs = 12;
      for (let i = 0; i <= segs; i++) {
        const t = i / segs;
        const y = baseY + (topY - baseY) * t;
        const wobble = Math.sin(performance.now()/300 + tn.phase + t * 3) * 30 * t;
        const x = tn.baseX + wobble;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      // Suckers
      ctx.fillStyle = '#6a2a7a';
      for (let i = 1; i < segs; i += 2) {
        const t = i / segs;
        const y = baseY + (topY - baseY) * t;
        const wobble = Math.sin(performance.now()/300 + tn.phase + t * 3) * 30 * t;
        ctx.beginPath(); ctx.arc(tn.baseX + wobble, y, 5, 0, Math.PI*2); ctx.fill();
      }
    });

    // Massive glowing eye rising in center
    if (riseAmount > 0.5) {
      const eyeY = oceanY - (riseAmount - 0.5) * 320;
      const eyeSize = 60 * (riseAmount - 0.5) * 2;
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(W/2, eyeY, eyeSize + 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ff3355';
      ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 40;
      ctx.beginPath(); ctx.arc(W/2, eyeY, eyeSize, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(W/2, eyeY, eyeSize * 0.3, eyeSize * 0.8, 0, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Tiny player at bottom
    drawPlayer(player.x, H - 60);

    ctx.restore();

    // Overlay text
    ctx.fillStyle = `rgba(255,50,80,${0.4 + Math.sin(performance.now()/200) * 0.3})`;
    ctx.font = '42px Special Elite';
    ctx.textAlign = 'center';
    ctx.fillText('SOMETHING IS COMING', W/2, 80);
    ctx.fillStyle = '#ffdd55';
    ctx.font = '22px VT323';
    ctx.fillText('You feel it. This is the end.', W/2, 120);
    ctx.textAlign = 'left';

    // End after enough rising
    if (krakenState.rising > 6) {
      winLevel(6);
    }
  }

  // ========== STORY 2 ==========
  // A different protagonist. Levels use S1, S2 naming.
  let story = 1; // 1 = main, 2 = Story 2
  let sLevel = 1;
  let sPhase = 'run';
  let sTimer = 0;
  let krakenChase = { x: 0, y: 0, tentacles: [] };
  let wetAlone = { timer: 0 };
  let heist = {
    items: [],
    collected: 0,
    guardLight: 0,
    lightAngle: 0
  };
  let crew = [];
  let portal = { x: 0, y: 0, active: false, entered: false };

  function showStory2Intro() {
    story = 2;
    sLevel = 1;
    state = 'story2Intro';
    partLabel.textContent = '— STORY 2 —';
    levelEl.textContent = 'S1';
    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <h2>STORY 2</h2>
      <p>A different person. A different life. The kraken rose from the ocean and everyone ran — but they left you behind.</p>
      <p style="color:#ff6688;">You couldn't outrun it. The ocean took you.</p>
      <p style="color:#ffdd55;">Four hours later, wet and alone, you crawl ashore. You go into hiding.</p>
      <div class="controls">Arrow Keys or WASD to move<br>Don't let the kraken reach you.</div>
      <button id="s1-btn">START LEVEL S1</button>
    `;
    document.getElementById('s1-btn').addEventListener('click', () => {
      initStory2Level1();
      state = 'playing';
      overlay.classList.add('hidden');

  // -------- STORY 2 LEVEL 1: Run from the kraken -------
  function initStory2Level1() {
    sLevel = 1;
    levelEl.textContent = 'S1';
    statusEl.textContent = 'RUN!';
    timerEl.textContent = '—';
    player.x = W - 60; player.y = H / 2;
    sPhase = 'run';
    sTimer = 0;
    krakenChase = {
      x: -60,
      waterLevel: H,  // water rises over time
      tentacles: [
        { baseX: 80, phase: 0, len: 0 },
        { baseX: 180, phase: 1, len: 0 },
        { baseX: 280, phase: 2, len: 0 }
      ]
    };
    wetAlone.timer = 0;
  }

  function drawStory2Level1() {
    if (sPhase === 'run') {
      drawS1Run();
    } else if (sPhase === 'caught') {
      drawS1Caught();
    } else if (sPhase === 'wet') {
      drawS1Wet();
    }
  }

  function drawS1Run() {
    // Beach scene - sky, beach, rising ocean behind you
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#3a1a30');
    sky.addColorStop(0.4, '#6a3040');
    sky.addColorStop(1, '#c88855');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    sTimer += 1/60;
    // Water rises from left toward right
    const waterX = Math.min(W - 40, sTimer * 40);

    // Beach sand on right side of water
    ctx.fillStyle = '#d4a672';
    ctx.fillRect(waterX, H - 100, W - waterX, 100);

    // Ocean
    const oceanGrad = ctx.createLinearGradient(0, 0, waterX, 0);
    oceanGrad.addColorStop(0, '#0a1a2a');
    oceanGrad.addColorStop(1, '#2a4a6a');
    ctx.fillStyle = oceanGrad;
    ctx.fillRect(0, 0, waterX, H);

    // Foamy waves at edge
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let y = 0; y < H; y += 4) {
      const wobble = Math.sin(y/12 + performance.now()/100) * 6;
      if (y === 0) ctx.moveTo(waterX + wobble, y);
      else ctx.lineTo(waterX + wobble, y);
    }
    ctx.stroke();

    // Kraken tentacles reach from the ocean
    krakenChase.tentacles.forEach((t, idx) => {
      t.len = Math.min(waterX - 20, sTimer * 30 + idx * 20);
      if (t.len < 0) return;
      ctx.strokeStyle = '#4a1a5a';
      ctx.lineWidth = 18;
      ctx.lineCap = 'round';
      ctx.beginPath();
      const segs = 10;
      for (let i = 0; i <= segs; i++) {
        const p = i / segs;
        const x = 20 + t.len * p;
        const y = 60 + idx * 140 + Math.sin(performance.now()/300 + t.phase + p * 3) * 20;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      // Tentacle tip
      const tipX = 20 + t.len;
      const tipY = 60 + idx * 140 + Math.sin(performance.now()/300 + t.phase + 3) * 20;
      ctx.fillStyle = '#6a2a7a';
      ctx.beginPath(); ctx.arc(tipX, tipY, 12, 0, Math.PI*2); ctx.fill();
    });

    // Giant eye emerging
    if (sTimer > 3) {
      const eyeX = Math.min(100, (sTimer - 3) * 30);
      const eyeSize = 40 + Math.min(40, (sTimer - 3) * 8);
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(eyeX, H/2, eyeSize + 10, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ff3355';
      ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 30;
      ctx.beginPath(); ctx.arc(eyeX, H/2, eyeSize, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(eyeX, H/2, eyeSize * 0.3, eyeSize * 0.8, 0, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Fleeing people silhouettes running off-screen to the right, then fewer and fewer
    const fleeCount = Math.max(0, 5 - Math.floor(sTimer));
    for (let i = 0; i < fleeCount; i++) {
      const fx = W - 40 - i * 70 - sTimer * 20;
      const fy = H - 70 + (i % 2) * 10;
      ctx.fillStyle = '#222';
      ctx.fillRect(fx + 2, fy, 4, 4);
      ctx.fillRect(fx, fy + 4, 8, 6);
      ctx.fillRect(fx + 1, fy + 10, 2, 4);
      ctx.fillRect(fx + 5, fy + 10, 2, 4);
    }

    // Player running
    drawPlayer(player.x, player.y);

    // Panic text
    if (sTimer > 2 && sTimer < 5) {
      ctx.fillStyle = `rgba(255,50,80,${Math.sin(performance.now()/150) * 0.4 + 0.6})`;
      ctx.font = '32px Special Elite';
      ctx.textAlign = 'center';
      ctx.fillText('THEY LEFT YOU BEHIND', W/2, 60);
      ctx.textAlign = 'left';
    }

    // Collision: water reaches player
    if (waterX >= player.x) {
      sPhase = 'caught';
      wetAlone.timer = 0;
    }

    // Hint
    ctx.fillStyle = '#ffdd55'; ctx.font = '18px VT323';
    ctx.fillText('→ Keep running right', 20, 30);

    timerEl.textContent = Math.floor(sTimer) + 's';
  }

  function drawS1Caught() {
    // Screen flooded with water
    ctx.fillStyle = '#0a1a2a'; ctx.fillRect(0, 0, W, H);
    // Bubbles
    for (let i = 0; i < 20; i++) {
      const by = ((performance.now() / 40 + i * 97) % H);
      const bx = (i * 53 + Math.sin(performance.now()/500 + i) * 40) % W;
      ctx.fillStyle = `rgba(255,255,255,${0.2 + (i % 3) * 0.1})`;
      ctx.beginPath(); ctx.arc(bx, by, 3 + (i % 3), 0, Math.PI*2); ctx.fill();
    }
    // Kraken eye looming
    ctx.fillStyle = '#ff3355';
    ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 50;
    ctx.beginPath(); ctx.arc(W/2, H/2, 80, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(W/2, H/2, 24, 64, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // Flailing player
    const x = W/2 + Math.sin(performance.now()/150) * 100;
    const y = 80 + Math.sin(performance.now()/200) * 20;
    drawPlayer(x, y);

    ctx.fillStyle = '#fff'; ctx.font = '30px Special Elite';
    ctx.textAlign = 'center';
    ctx.fillText('THE OCEAN GOT YOU', W/2, 50);
    ctx.textAlign = 'left';

    wetAlone.timer += 1/60;
    if (wetAlone.timer > 3) {
      sPhase = 'wet';
      wetAlone.timer = 0;
    }
  }

  function drawS1Wet() {
    // Empty beach, cold evening light
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#2a2a3a');
    sky.addColorStop(1, '#6a5a5a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    // Wet sand
    ctx.fillStyle = '#8a6a4a';
    ctx.fillRect(0, H - 140, W, 140);
    // Tide line
    ctx.fillStyle = '#1a3a4a';
    ctx.fillRect(0, H - 50, W, 50);

    // Driftwood, seaweed scraps
    ctx.fillStyle = '#3a2818';
    ctx.fillRect(200, H - 150, 40, 6);
    ctx.fillRect(420, H - 130, 30, 5);
    ctx.fillStyle = '#2a4a2a';
    ctx.fillRect(100, H - 130, 20, 8);

    // Player sitting, dripping wet
    const px = W/2 - 8, py = H - 160;
    ctx.fillStyle = '#f4c37a';
    ctx.fillRect(px + 4, py, 8, 6);
    ctx.fillStyle = '#2a5a7a'; // darker blue from being wet
    ctx.fillRect(px + 2, py + 6, 12, 8);
    ctx.fillStyle = '#222';
    ctx.fillRect(px + 3, py + 14, 4, 2);
    ctx.fillRect(px + 9, py + 14, 4, 2);
    // Water drops
    ctx.fillStyle = 'rgba(100,150,200,0.6)';
    for (let i = 0; i < 4; i++) {
      const dy = py + 4 + ((performance.now()/200 + i * 30) % 40);
      ctx.fillRect(px + 4 + (i%2) * 8, dy, 2, 3);
    }

    wetAlone.timer += 1/60;

    // Text progression
    ctx.fillStyle = '#c8c8d8'; ctx.font = '24px Special Elite';
    ctx.textAlign = 'center';
    if (wetAlone.timer < 3) {
      ctx.fillText('FOUR HOURS LATER', W/2, 80);
      ctx.font = '18px VT323';
      ctx.fillStyle = '#aaaabb';
      ctx.fillText('You are wet. You are alone.', W/2, 110);
    } else if (wetAlone.timer < 6) {
      ctx.font = '28px Special Elite';
      ctx.fillText('YOU GO INTO HIDING', W/2, 80);
    } else if (wetAlone.timer < 9) {
      ctx.fillStyle = '#ffdd55';
      ctx.font = '32px Special Elite';
      ctx.fillText('10 YEARS LATER', W/2, H/2);
    } else {
      // Transition to Level S2
      initStory2Level2();

  function drawS2Heist() {
    // Government vault — cold blue lab
    ctx.fillStyle = '#0a1420'; ctx.fillRect(0, 0, W, H);
    // Floor grid
    ctx.strokeStyle = '#1a2838'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    // Walls
    ctx.fillStyle = '#2a3a4a';
    ctx.fillRect(0, 0, W, 16); ctx.fillRect(0, H-16, W, 16);
    ctx.fillRect(0, 0, 16, H); ctx.fillRect(W-16, 0, 16, H);

    // Central portal machine (dormant)
    ctx.fillStyle = '#1a2a3a';
    ctx.beginPath(); ctx.arc(W/2, H/2, 60, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#3a5a7a'; ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = '#555'; ctx.font = '14px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('PORTAL', W/2, H/2 - 70);
    ctx.fillText('INERT', W/2, H/2 + 4);
    ctx.textAlign = 'left';

    // Display cases on pedestals
    heist.items.forEach(it => {
      if (it.got) return;
      ctx.fillStyle = '#1a2838';
      ctx.fillRect(it.x - 18, it.y - 18, 36, 36);
      ctx.strokeStyle = '#3a5a7a';
      ctx.strokeRect(it.x - 18, it.y - 18, 36, 36);
      // Item
      ctx.fillStyle = it.color;
      ctx.shadowColor = it.color; ctx.shadowBlur = 14;
      if (it.name === 'STAR DUST') {
        for (let i = 0; i < 6; i++) {
          const a = i * Math.PI / 3 + performance.now()/1000;
          ctx.fillRect(it.x + Math.cos(a) * 8 - 1, it.y + Math.sin(a) * 8 - 1, 3, 3);
        }
      } else if (it.name === 'DRAGON SCALE') {
        ctx.beginPath();
        ctx.moveTo(it.x, it.y - 10);
        ctx.lineTo(it.x + 8, it.y);
        ctx.lineTo(it.x, it.y + 10);
        ctx.lineTo(it.x - 8, it.y);
        ctx.closePath();
        ctx.fill();
      } else if (it.name === 'KRAKEN EGGS') {
        ctx.beginPath(); ctx.arc(it.x - 5, it.y, 5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(it.x + 5, it.y + 2, 6, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(it.x, it.y - 6, 4, 0, Math.PI*2); ctx.fill();
      } else if (it.name === 'BLOOP SKIN') {
        ctx.beginPath();
        ctx.moveTo(it.x - 10, it.y); ctx.quadraticCurveTo(it.x, it.y - 12, it.x + 10, it.y);
        ctx.quadraticCurveTo(it.x, it.y + 12, it.x - 10, it.y);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff'; ctx.font = '11px VT323';
      ctx.textAlign = 'center';
      ctx.fillText(it.name, it.x, it.y - 24);
      ctx.textAlign = 'left';
    });

    // Guard with rotating searchlight from center
    heist.lightAngle += 0.012;
    const lightRange = 220;
    const lightSpread = 0.5;
    ctx.save();
    ctx.translate(W/2, H/2);
    ctx.rotate(heist.lightAngle);
    const grad = ctx.createRadialGradient(0, 0, 20, 0, 0, lightRange);
    grad.addColorStop(0, 'rgba(255,240,200,0.5)');
    grad.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    for (let i = 0; i <= 24; i++) {
      const a = -lightSpread + (lightSpread * 2 * i / 24);
      ctx.lineTo(Math.cos(a) * lightRange, Math.sin(a) * lightRange);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Guard body
    ctx.fillStyle = '#3a3a4a';
    ctx.beginPath(); ctx.arc(W/2, H/2, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffdd55';
    ctx.beginPath(); ctx.arc(W/2 + Math.cos(heist.lightAngle) * 6, H/2 + Math.sin(heist.lightAngle) * 6, 2, 0, Math.PI*2); ctx.fill();

    // Player
    drawPlayer(player.x, player.y);

    // Collect
    const pcx = player.x + 8, pcy = player.y + 8;
    heist.items.forEach(it => {
      if (!it.got && Math.hypot(pcx - it.x, pcy - it.y) < 22) {
        it.got = true;
        heist.collected++;
      }
    });

    // Detection by searchlight
    const dx = pcx - W/2, dy = pcy - H/2;
    const distLight = Math.hypot(dx, dy);
    if (distLight < lightRange) {
      let diff = Math.atan2(dy, dx) - heist.lightAngle;
      while (diff > Math.PI) diff -= 2 * Math.PI;
      while (diff < -Math.PI) diff += 2 * Math.PI;
      if (Math.abs(diff) < lightSpread) {
        loseGame('THE SEARCHLIGHT FOUND YOU');
        return;
      }
    }

    timerEl.textContent = `${heist.collected}/4`;

    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(20, 20, 280, 32);
    ctx.fillStyle = '#ffdd55'; ctx.font = '16px VT323';
    ctx.fillText('Steal the 4 portal ingredients', 30, 42);

    if (heist.collected >= 4) {
      sPhase = 'crew';
      sTimer = 0;
      statusEl.textContent = 'MEET THE CREW';
    }
  }
