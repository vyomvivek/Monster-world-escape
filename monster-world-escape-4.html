  function initPvPFight() {
    pvpMode = true;
    coopMode = false;
    pvpWinner = null;
    enterCoopCanvas(); // same portrait canvas
    partLabel.textContent = '— PVP DEATHMATCH —';
    levelEl.textContent = 'PVP';
    statusEl.textContent = 'FIGHT!';
    p1 = { x: CW/2 - 8, y: CH - 180, size: 16, speed: 2.8, hp: 5, maxHp: 5, color: '#55ff88', shirt: '#228855', attackCooldown: 0, swinging: 0, invuln: 0, facing: 1, damage: 1 };
    p2 = { x: CW/2 - 8, y: 160, size: 16, speed: 2.8, hp: 5, maxHp: 5, color: '#55aaff', shirt: '#3366aa', attackCooldown: 0, swinging: 0, invuln: 0, facing: 1, damage: 1 };
    pvpPickups = [];
    pvpNextPickup = 240;
    pvpRoundTimer = 0;
    timerEl.textContent = '5 - 5';
  }

  function triggerPvPAtk(attacker, victim) {
    if (!attacker || attacker.attackCooldown > 0 || attacker.hp <= 0) return;
    attacker.attackCooldown = 22;
    attacker.swinging = 12;
    const swordX = attacker.x + 8 + attacker.facing * 18;
    const swordY = attacker.y + 8;
    // Generous reach: the sword connects if the other player is within ~45 px
    // from the swing point in any direction. This makes phone play feel good
    // without needing pixel-perfect positioning.
    if (victim.hp > 0 && victim.invuln <= 0 && Math.hypot(victim.x + 8 - swordX, victim.y + 8 - swordY) < 45) {
      victim.hp -= attacker.damage;
      victim.invuln = 40;
      // Small knockback
      const dx = victim.x - attacker.x;
      const dy = victim.y - attacker.y;
      const d = Math.hypot(dx, dy) || 1;
      victim.x += (dx / d) * 12;
      victim.y += (dy / d) * 12;
      victim.x = Math.max(16, Math.min(CW - 16 - victim.size, victim.x));
      victim.y = Math.max(16, Math.min(CH - 16 - victim.size, victim.y));
    }
  }

  function updatePvPPlayer(p, joy, atkKey, upK, dnK, lfK, rtK, enemy) {
    if (p.hp <= 0) return;
    let dx = 0, dy = 0;
    if (joy.id !== null) { dx += joy.dx; dy += joy.dy; }
    if (keys[upK] || (upK.toLowerCase && keys[upK.toLowerCase()])) dy -= 1;
    if (keys[dnK] || (dnK.toLowerCase && keys[dnK.toLowerCase()])) dy += 1;
    if (keys[lfK] || (lfK.toLowerCase && keys[lfK.toLowerCase()])) dx -= 1;
    if (keys[rtK] || (rtK.toLowerCase && keys[rtK.toLowerCase()])) dx += 1;
    const m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    p.x += dx * p.speed;
    p.y += dy * p.speed;
    p.x = Math.max(16, Math.min(CW - 16 - p.size, p.x));
    p.y = Math.max(16, Math.min(CH - 16 - p.size, p.y));
    if (dx !== 0) p.facing = Math.sign(dx);
    if (p.attackCooldown > 0) p.attackCooldown--;
    if (p.swinging > 0) p.swinging--;
    if (p.invuln > 0) p.invuln--;
    if (keys[atkKey] || (atkKey.toLowerCase && keys[atkKey.toLowerCase()])) triggerPvPAtk(p, enemy);
  }

  function updatePvPPickups() {
    pvpNextPickup--;
    if (pvpNextPickup <= 0) {
      pvpPickups.push({
        x: 40 + Math.random() * (CW - 80),
        y: -20,
        vy: 1.2,
        life: 900
      });
      pvpNextPickup = 300;
    }
    pvpPickups.forEach(pu => {
      pu.y += pu.vy;
      if (pu.y > CH - 50) { pu.y = CH - 50; pu.vy = 0; }
      pu.life--;
    });
    [p1, p2].forEach(p => {
      pvpPickups.forEach(pu => {
        if (pu.life > 0 && p.hp > 0 && Math.hypot(p.x + 8 - pu.x, p.y + 8 - pu.y) < 22) {
          p.hp = Math.min(p.maxHp, p.hp + 2);
          pu.life = 0;
        }
      });
    });
    pvpPickups = pvpPickups.filter(pu => pu.life > 0);
  }

  function drawPvPPickups() {
    pvpPickups.forEach(pu => {
      const bob = pu.vy === 0 ? Math.sin(performance.now()/300 + pu.x) * 3 : 0;
      ctx.fillStyle = '#55ff88';
      ctx.shadowColor = '#55ff88'; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(pu.x, pu.y + bob, 14, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#0a2a14';
      ctx.font = 'bold 20px VT323';
      ctx.textAlign = 'center';
      ctx.fillText('+', pu.x, pu.y + bob + 7);
      ctx.textAlign = 'left';
      if (pu.life < 150 && Math.floor(pu.life / 8) % 2 === 0) {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(pu.x, pu.y + bob, 16, 0, Math.PI*2); ctx.stroke();
      }
    });
  }

  function drawPvPScene() {
    // Arena — desert battleground
    const sky = ctx.createLinearGradient(0, 0, 0, CH);
    sky.addColorStop(0, '#2a0a18');
    sky.addColorStop(0.5, '#5a2818');
    sky.addColorStop(1, '#2a1a0a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, CW, CH);

    // Circular arena floor
    ctx.fillStyle = '#3a1a10';
    ctx.beginPath();
    ctx.ellipse(CW/2, CH/2, CW * 0.45, CH * 0.44, 0, 0, Math.PI*2);
    ctx.fill();
    // Ring markings
    ctx.strokeStyle = '#5a2a18'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(CW/2, CH/2, CW * 0.42, CH * 0.41, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(CW/2, CH/2, CW * 0.3, CH * 0.3, 0, 0, Math.PI*2);
    ctx.stroke();

    // Walls
    ctx.fillStyle = '#2a1010';
    ctx.fillRect(0, 0, CW, 16);
    ctx.fillRect(0, CH-16, CW, 16);
    ctx.fillRect(0, 0, 16, CH);
    ctx.fillRect(CW-16, 0, 16, CH);

    // Center line (divider)
    ctx.strokeStyle = 'rgba(255,100,50,0.2)';
    ctx.setLineDash([6, 10]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(20, CH/2); ctx.lineTo(CW - 20, CH/2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawPvPHUD() {
    // P2 HP at top
    drawHPRow(8, 8, p2, 'P2');
    // P1 HP at bottom
    drawHPRow(8, CH - 24, p1, 'P1');
    // Round timer in middle
    pvpRoundTimer += 1/60;
    const mm = Math.floor(pvpRoundTimer / 60);
    const ss = Math.floor(pvpRoundTimer % 60).toString().padStart(2, '0');
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(CW/2 - 40, CH/2 - 12, 80, 24);
    ctx.strokeStyle = '#ff8855';
    ctx.strokeRect(CW/2 - 40, CH/2 - 12, 80, 24);
    ctx.fillStyle = '#ff8855';
    ctx.font = '18px VT323';
    ctx.textAlign = 'center';
    ctx.fillText(mm + ':' + ss, CW/2, CH/2 + 5);
    ctx.textAlign = 'left';
  }

  function drawPvPTouchControls() {
    // Only joysticks and ATK buttons — no STK in PvP
    const drawJoy = (c, joyState, col) => {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.arc(c.x, c.y, 55, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(c.x, c.y, 55, 0, Math.PI*2); ctx.stroke();
      const knobX = c.x + (joyState.id !== null ? joyState.dx * 40 : 0);
      const knobY = c.y + (joyState.id !== null ? joyState.dy * 40 : 0);
      ctx.fillStyle = col;
      ctx.shadowColor = col; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(knobX, knobY, 22, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    };
    drawJoy(p1JoyCenter(), touches.p1Joy, '#55ff88');
    drawJoy(p2JoyCenter(), touches.p2Joy, '#55aaff');
    const drawBtn = (c, label, col, active) => {
      ctx.fillStyle = active ? col : 'rgba(0,0,0,0.4)';
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = active ? '#000' : col;
      ctx.font = 'bold 16px VT323';
      ctx.textAlign = 'center';
      ctx.fillText(label, c.x, c.y + 6);
      ctx.textAlign = 'left';
    };
    drawBtn(p1AtkBtn(), 'ATK', '#ff8855', touches.p1Atk.id !== null);
    drawBtn(p2AtkBtn(), 'ATK', '#ff8855', touches.p2Atk.id !== null);
  }

  // In PvP, the ATK touch handler needs to target the OTHER player
  // The existing touch start handler calls triggerAtk(p1/p2) which targets boss.
  // So we use a separate flag: in PvP mode, translate those calls.
  // Rather than rewiring, check at touch time:
  const origTriggerAtk = typeof triggerAtk === 'function' ? triggerAtk : null;
  // Override is handled inline in runPvPFight's update instead; touch start
  // already fires triggerAtk but in PvP that's harmless (boss is null) —
  // so we also listen for the touch press as a trigger.

  function runPvPFight() {
    drawPvPScene();
    if (!pvpWinner) {
      updatePvPPlayer(p1, touches.p1Joy, 'f', 'w', 's', 'a', 'd', p2);
      updatePvPPlayer(p2, touches.p2Joy, 'Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', p1);
      // Also handle touch-press attacks (one-shot on press-down)
      if (touches.p1Atk.id !== null && !touches.p1Atk.consumed) {
        triggerPvPAtk(p1, p2);
        touches.p1Atk.consumed = true;
      }
      if (touches.p1Atk.id === null) touches.p1Atk.consumed = false;
      if (touches.p2Atk.id !== null && !touches.p2Atk.consumed) {
        triggerPvPAtk(p2, p1);
        touches.p2Atk.consumed = true;
      }
      if (touches.p2Atk.id === null) touches.p2Atk.consumed = false;

      updatePvPPickups();
    }

    drawPvPPickups();
    if (p1.hp > 0) drawCoopP(p1, 1);
    if (p2.hp > 0) drawCoopP(p2, 2);

    // Tombstones for down player
    [p1, p2].forEach((p, idx) => {
      if (p.hp <= 0) {
        ctx.fillStyle = '#555';
        ctx.fillRect(p.x - 2, p.y + 4, 20, 14);
        ctx.fillStyle = '#222'; ctx.font = '10px VT323';
        ctx.textAlign = 'center';
        ctx.fillText('RIP', p.x + 8, p.y + 14);
        ctx.textAlign = 'left';
      }
    });

    drawPvPHUD();
    drawPvPTouchControls();

    timerEl.textContent = p1.hp + ' - ' + p2.hp;

    if (!pvpWinner) {
      if (p1.hp <= 0 && p2.hp > 0) {
        pvpWinner = 2;
        setTimeout(() => showPvPResult('P2'), 500);
      } else if (p2.hp <= 0 && p1.hp > 0) {
        pvpWinner = 1;
        setTimeout(() => showPvPResult('P1'), 500);
      } else if (p1.hp <= 0 && p2.hp <= 0) {
        pvpWinner = 0;
        setTimeout(() => showPvPResult('DRAW'), 500);
      }
    }
  }

  function showPvPResult(who) {
    state = 'pvpDone';
    exitCoopCanvas();
    const color = who === 'P1' ? '#55ff88' : who === 'P2' ? '#55aaff' : '#aaaaaa';
    const text = who === 'DRAW' ? 'BOTH PLAYERS FELL' : who + ' WINS';
    const sub = who === 'DRAW' ? 'Mutual destruction. Call it a tie.' :
                who === 'P1'   ? 'Player 1 stands victorious.' :
                                 'Player 2 stands victorious.';
    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <h2 style="color:${color}">${text}</h2>
      <p>${sub}</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
        <button id="pvp-again">REMATCH</button>
        <button id="pvp-menu" style="background:#222;color:#aaa;border-color:#444;">MAIN MENU</button>
      </div>`;
    document.getElementById('pvp-again').addEventListener('click', () => {
      initPvPFight(); state = 'playing'; overlay.classList.add('hidden');
    });
    document.getElementById('pvp-menu').addEventListener('click', () => {
      pvpMode = false; showMainMenu();
    });
  }

  // ========== BOSS VS BOSS MODE ==========
  // Reuses the REAL co-op fight. You control the boss (with joystick + ATK
  // to fire its attack pattern). AI controls one hero (p1) who chases you and
  // swings a sword when close. p2 is disabled. You die when boss HP hits 0.
  // You win when the hero's HP hits 0.

  let bvbMode = false;
  let bvbBossType = 'king';
  let bvbPlayerShotsCd = 0;

  function showBvBIntro() {
    state = 'bvbIntro';
    bvbMode = true;
    coopMode = false;
    pvpMode = false;
    partLabel.textContent = '— BOSS VS BOSS —';
    levelEl.textContent = 'BvB';
    statusEl.textContent = 'PLAY AS THE BOSS';
    timerEl.textContent = '—';
    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <h2>BOSS VS BOSS</h2>
      <p>Flip the script. You play as the BOSS. An AI hero tries to take you down.</p>
      <div style="background:#1a0a28;border:2px solid #cc88ff;padding:10px;margin:10px 0;max-width:460px;">
        <div style="color:#cc88ff;font-size:20px;font-family:'Special Elite',serif;">CONTROLS</div>
        <div style="color:#c8f0c8;font-size:17px;">
          Joystick (left) to move your boss<br>
          ATK button (right) to fire your attack pattern<br>
          Kill the hero before they kill you
        </div>
      </div>
      <p style="color:#ffdd55;font-size:20px;margin-top:12px;">CHOOSE WHICH BOSS YOU PLAY AS</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
        <button id="bvb-king" style="background:#330011;color:#ff6688;border-color:#ff3355;">👑 MONSTER KING · 60 HP</button>
        <button id="bvb-prince" style="background:#2a1a40;color:#ffdd55;border-color:#ddaa33;">🤴 PRINCE · 45 HP</button>
        <button id="bvb-demon" style="background:#2a0022;color:#ff55cc;border-color:#aa22ff;">💀 DEMON KING · 75 HP</button>
      </div>
      <button id="bvb-back-btn" style="background:#222;color:#aaa;border-color:#444;margin-top:8px;">BACK</button>
    `;
    document.getElementById('bvb-king').addEventListener('click', () => {
      initBvBFight('king'); state = 'playing'; overlay.classList.add('hidden');
    });
    document.getElementById('bvb-prince').addEventListener('click', () => {
      initBvBFight('prince'); state = 'playing'; overlay.classList.add('hidden');
    });
    document.getElementById('bvb-demon').addEventListener('click', () => {
      initBvBFight('demon'); state = 'playing'; overlay.classList.add('hidden');
    });
    document.getElementById('bvb-back-btn').addEventListener('click', () => {
      bvbMode = false; exitCoopCanvas(); showMainMenu();
    });
  }

  function initBvBFight(type) {
    bvbMode = true;
    coopMode = false;
    pvpMode = false;
    coopGameOver = false;
    bvbBossType = type || 'king';
    bvbPlayerShotsCd = 0;
    enterCoopCanvas();
    partLabel.textContent = '— BOSS VS BOSS —';
    levelEl.textContent = 'BvB';
    statusEl.textContent = 'KILL THE HERO';

    // One hero (p1). Give them more HP than default since they're AI.
    p1 = {
      x: CW/2 - 8, y: CH - 180, size: 16, speed: 2.0,
      hp: 10, maxHp: 10, color: '#55ff88', shirt: '#228855',
      attackCooldown: 0, swinging: 0, invuln: 0, facing: 1,
      damage: 1, powerTimer: 0, powerType: null, shielded: false,
      shootCooldown: 0
    };
    // p2 disabled
    p2 = {
      x: -100, y: -100, size: 16, speed: 0,
      hp: 0, maxHp: 0, color: '#55aaff', shirt: '#3366aa',
      attackCooldown: 0, swinging: 0, invuln: 0, facing: 1,
      damage: 1, powerTimer: 0, powerType: null, shielded: false,
      shootCooldown: 0
    };

    // Boss is now the PLAYER. Use the existing boss stats + visuals.
    let hp, size, label;
    if (bvbBossType === 'prince')     { hp = 45; size = 38; label = 'PRINCE'; }
    else if (bvbBossType === 'demon') { hp = 75; size = 52; label = 'DEMON KING'; }
    else                              { hp = 60; size = 46; label = 'KING'; }

    boss = {
      x: CW / 2, y: 180, size: size,
      hp: hp, maxHp: hp,
      attackTimer: 99999,   // AI auto-attacks disabled — player triggers manually
      hitFlash: 0,
      label: label, type: bvbBossType
    };
    bossProjectiles = [];
    coopPowerUps = [];
    stackMeter = 0;
    shockwave = null;
    bossPhase = 1;
    nextPUSpawn = 99999;  // no power-ups in BvB
    timerEl.textContent = 'HP ' + hp;
  }

  function updateBvBBossAsPlayer() {
    // Move the boss by joystick / WASD instead of AI drift
    let dx = 0, dy = 0;
    if (touches.p1Joy.id !== null) { dx += touches.p1Joy.dx; dy += touches.p1Joy.dy; }
    if (keys['w'] || keys['ArrowUp']) dy -= 1;
    if (keys['s'] || keys['ArrowDown']) dy += 1;
    if (keys['a'] || keys['ArrowLeft']) dx -= 1;
    if (keys['d'] || keys['ArrowRight']) dx += 1;
    const m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    const bossSpeed = 2.0;
    boss.x += dx * bossSpeed;
    boss.y += dy * bossSpeed;
    boss.x = Math.max(boss.size + 20, Math.min(CW - boss.size - 20, boss.x));
    boss.y = Math.max(boss.size + 20, Math.min(CH - boss.size - 20, boss.y));

    if (boss.hitFlash > 0) boss.hitFlash--;

    // Phase tracking still works (makes attacks more varied as boss takes damage)
    if (boss.hp < boss.maxHp * 0.66 && bossPhase < 2) bossPhase = 2;
    if (boss.hp < boss.maxHp * 0.33 && bossPhase < 3) bossPhase = 3;

    // Player presses ATK to fire the boss's current-phase attack pattern
    if (bvbPlayerShotsCd > 0) bvbPlayerShotsCd--;
    const atkPressed = touches.p1Atk.id !== null || keys['f'] || keys['Enter'] || keys[' '];
    if (atkPressed && bvbPlayerShotsCd <= 0) {
      bvbPlayerShotsCd = 45;  // rate limit
      // Pick a pattern based on phase, using existing fireBoth/fireRing/fireHoming/fireSpiral
      const r = Math.random();
      if (boss.type === 'prince') {
        if (bossPhase === 1) fireBoth(5, 3.0);
        else if (bossPhase === 2) { if (r < 0.5) fireBoth(7, 3.2); else fireRing(12, 2.8); }
        else { if (r < 0.4) fireBoth(9, 3.6); else if (r < 0.7) fireRing(16, 3.0); else fireHoming(); }
      } else if (boss.type === 'demon') {
        if (bossPhase === 1) { if (r < 0.6) fireBoth(5, 2.6); else fireRing(12, 2.4); }
        else if (bossPhase === 2) { if (r < 0.35) fireBoth(7, 2.8); else if (r < 0.7) fireRing(16, 2.6); else fireHoming(); }
        else {
          if (r < 0.25) fireBoth(9, 3.2);
          else if (r < 0.5) fireRing(20, 2.8);
          else if (r < 0.8) fireSpiral(18, 2.6);
          else { fireHoming(); fireHoming(); }
        }
      } else {
        if (bossPhase === 1) fireBoth(4, 2.4);
        else if (bossPhase === 2) { if (r < 0.5) fireBoth(6, 2.8); else fireRing(10, 2.4); }
        else { if (r < 0.35) fireBoth(8, 3.2); else if (r < 0.7) fireRing(14, 2.6); else fireHoming(); }
      }
    }
  }

  function updateBvBHeroAI() {
    // AI controls p1. Chase the boss, swing sword when close.
    const hero = p1;
    if (hero.hp <= 0) return;
    if (hero.attackCooldown > 0) hero.attackCooldown--;
    if (hero.swinging > 0) hero.swinging--;
    if (hero.invuln > 0) hero.invuln--;

    // Movement: steer toward the boss but keep some distance to dodge projectiles
    const dx = boss.x - (hero.x + 8);
    const dy = boss.y - (hero.y + 8);
    const dist = Math.hypot(dx, dy) || 1;
    // If too far, approach; if very close, back off a little
    let mx = 0, my = 0;
    if (dist > 40) {
      mx = dx / dist; my = dy / dist;
    } else if (dist < 28) {
      mx = -dx / dist; my = -dy / dist;
    } else {
      // Orbit a bit — strafe perpendicular
      mx = -dy / dist; my = dx / dist;
    }
    // Dodge incoming projectiles: if one is close and coming at us, sidestep
    let dodgeX = 0, dodgeY = 0;
    for (const pr of bossProjectiles) {
      const pdx = (hero.x + 8) - pr.x;
      const pdy = (hero.y + 8) - pr.y;
      const pd = Math.hypot(pdx, pdy);
      if (pd < 40 && (pr.vx * -pdx + pr.vy * -pdy) > 0) {
        // Projectile is heading toward us
        dodgeX += pdx / (pd + 1) * 2;
        dodgeY += pdy / (pd + 1) * 2;
      }
    }
    mx += dodgeX;
    my += dodgeY;
    const mag = Math.hypot(mx, my) || 1;
    mx /= mag; my /= mag;
    hero.x += mx * hero.speed;
    hero.y += my * hero.speed;
    hero.x = Math.max(16, Math.min(CW - 16 - hero.size, hero.x));
    hero.y = Math.max(16, Math.min(CH - 16 - hero.size, hero.y));
    if (mx !== 0) hero.facing = Math.sign(mx);

    // Sword swing: if close, try to hit the boss
    if (dist < 40 && hero.attackCooldown <= 0) {
      hero.attackCooldown = 28;
      hero.swinging = 12;
      if (dist < boss.size + 30) {
        boss.hp = Math.max(0, boss.hp - 1);
        boss.hitFlash = 8;
      }
    }
  }

  function runBvBFight() {
    // Same scene as co-op fight (throne room portrait)
    drawCoopScene();
    if (!coopGameOver) {
      updateBvBBossAsPlayer();
      updateBvBHeroAI();
      updateProjCoop();     // reuse existing projectile logic, which damages p1/p2
    }
    drawCoopBoss();
    drawCoopProj();
    if (p1.hp > 0) drawCoopP(p1, 1);
    drawBvBHUD();
    drawBvBTouchControls();

    timerEl.textContent = 'HP ' + boss.hp + ' vs ' + p1.hp;

    if (!coopGameOver) {
      if (p1.hp <= 0) {
        coopGameOver = true;
        setTimeout(() => showBvBResult('win'), 300);
      } else if (boss.hp <= 0) {
        coopGameOver = true;
        setTimeout(() => showBvBResult('lose'), 300);
      }
    }
  }

  function drawBvBHUD() {
    // Boss (player) HP at bottom — their status
    const yb = CH - 30;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(16, yb - 4, CW - 32, 22);
    ctx.fillStyle = '#220011'; ctx.fillRect(18, yb, CW - 36, 14);
    const bfrac = Math.max(0, boss.hp / boss.maxHp);
    const bossColor = boss.type === 'prince' ? '#aa55ff' : boss.type === 'demon' ? '#ff3355' : '#ff3355';
    ctx.fillStyle = bossColor;
    ctx.shadowColor = bossColor; ctx.shadowBlur = 8;
    ctx.fillRect(18, yb, (CW - 36) * bfrac, 14);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = '12px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('YOU (' + (boss.label || 'BOSS') + ') ' + boss.hp + '/' + boss.maxHp, CW/2, yb + 11);
    ctx.textAlign = 'left';

    // Hero HP at top
    const yh = 8;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(16, yh - 2, CW - 32, 22);
    ctx.fillStyle = '#002211'; ctx.fillRect(18, yh, CW - 36, 14);
    const hfrac = Math.max(0, p1.hp / p1.maxHp);
    ctx.fillStyle = '#55ff88';
    ctx.shadowColor = '#55ff88'; ctx.shadowBlur = 8;
    ctx.fillRect(18, yh, (CW - 36) * hfrac, 14);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = '12px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('HERO ' + p1.hp + '/' + p1.maxHp, CW/2, yh + 11);
    ctx.textAlign = 'left';

    // Attack ready indicator
    const ar = bvbPlayerShotsCd <= 0;
    ctx.fillStyle = ar ? '#ffdd55' : '#555';
    ctx.font = '14px VT323';
    ctx.fillText(ar ? 'ATK READY' : 'reloading...', CW - 120, yh + 34);
  }

  function drawBvBTouchControls() {
    // Same layout as co-op/PvP but only one set
    const drawJoy = (c, joyState, col) => {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.arc(c.x, c.y, 55, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(c.x, c.y, 55, 0, Math.PI*2); ctx.stroke();
      const knobX = c.x + (joyState.id !== null ? joyState.dx * 40 : 0);
      const knobY = c.y + (joyState.id !== null ? joyState.dy * 40 : 0);
      ctx.fillStyle = col;
      ctx.shadowColor = col; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(knobX, knobY, 22, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    };
    drawJoy({ x: 80, y: CH - 90 }, touches.p1Joy, '#cc88ff');
    const btn = { x: CW - 70, y: CH - 90, r: 48 };
    const active = touches.p1Atk.id !== null;
    ctx.fillStyle = active ? '#ff3355' : 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ff3355'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.r, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = active ? '#000' : '#ff3355';
    ctx.font = 'bold 18px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('ATK', btn.x, btn.y + 6);
    ctx.textAlign = 'left';
  }

  function showBvBResult(outcome) {
    state = 'bvbDone';
    exitCoopCanvas();
    const title = outcome === 'win' ? 'THE BOSS WINS' : 'THE HERO WINS';
    const sub = outcome === 'win'
      ? `As ${boss.label}, you crushed the hero.`
      : `The hero took you down, even as ${boss.label}.`;
    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <h2 style="color:${outcome === 'win' ? '#ff6688' : '#55ff88'}">${title}</h2>
      <p>${sub}</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
        <button id="bvb-again">FIGHT AGAIN</button>
        <button id="bvb-pick">PICK BOSS</button>
        <button id="bvb-menu" style="background:#222;color:#aaa;border-color:#444;">MAIN MENU</button>
      </div>`;
    document.getElementById('bvb-again').addEventListener('click', () => {
      initBvBFight(bvbBossType); state = 'playing'; overlay.classList.add('hidden');
    });
    document.getElementById('bvb-pick').addEventListener('click', () => {
      showBvBIntro();
    });
    document.getElementById('bvb-menu').addEventListener('click', () => {
      bvbMode = false; showMainMenu();
    });
  }

  // Also register touch handling so this mode gets joystick + ATK input
  // (the existing coopTS/TM/TE handlers already check coopMode||pvpMode, so
  // we need to extend them. Simplest: add bvbMode to the guards.)
  // We do that by patching check at runtime via a wrapper attached to the canvas:
  canvas.addEventListener('touchstart', function(e) {
    if (!bvbMode || state !== 'playing') return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      const p = canvasPt(t);
      const atk = { x: CW - 70, y: CH - 90, r: 48 };
      if (Math.hypot(p.x - atk.x, p.y - atk.y) <= atk.r) {
        touches.p1Atk.id = t.identifier;
        continue;
      }
      const joy = { x: 80, y: CH - 90 };
      if (Math.hypot(p.x - joy.x, p.y - joy.y) <= 90) {
        touches.p1Joy.id = t.identifier;
        touches.p1Joy.cx = joy.x; touches.p1Joy.cy = joy.y;
        touches.p1Joy.dx = 0; touches.p1Joy.dy = 0;
      }
    }
  }, { passive: false });
  canvas.addEventListener('touchmove', function(e) {
    if (!bvbMode || state !== 'playing') return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      const p = canvasPt(t);
      const j = touches.p1Joy;
      if (j.id === t.identifier) {
        let dx = p.x - j.cx, dy = p.y - j.cy;
        const L = Math.hypot(dx, dy), MX = 60;
        if (L > MX) { dx = dx * MX / L; dy = dy * MX / L; }
        j.dx = dx / MX; j.dy = dy / MX;
      }
    }
  }, { passive: false });
  canvas.addEventListener('touchend', function(e) {
    if (!bvbMode) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (touches.p1Joy.id === t.identifier) {
        touches.p1Joy.id = null; touches.p1Joy.dx = 0; touches.p1Joy.dy = 0;
      }
      if (touches.p1Atk.id === t.identifier) touches.p1Atk.id = null;
    }
  }, { passive: false });

  // -------- STORY 2 LEVEL 4: Escape & Revenge --------
  // Phases:
  //  keys   - find 3 keys hidden around the cell (average day - click/touch to search)
  //  dig    - dig through the floor (press SPACE repeatedly to break through)
  //  maze   - navigate a top-down maze
  //  prince - boss fight vs the Prince (melee)
  //  king   - boss fight vs the Demon King (melee)
  //  absorb - scripted cutscene: you absorb both bodies and become all-powerful
  let s4Phase = 'keys';
  let s4Keys = [];
  let s4KeysFound = 0;
  let s4DigProgress = 0;
  let s4MazeGrid = null;
  let s4MazeCellSize = 0;
  let s4MazeOffset = { x: 0, y: 0 };
  let s4Prince = null;
  let s4King = null;
  let s4PlayerHP = 10;
  let s4PlayerAtkCd = 0;
  let s4PlayerSwinging = 0;
  let s4PlayerInvuln = 0;
  let s4BossProjectiles = [];
  let s4AbsorbTimer = 0;

  function initStory2Level4() {
    sLevel = 4;
    levelEl.textContent = 'S4';
    partLabel.textContent = '— STORY 2 —';
    statusEl.textContent = 'FIND THE KEYS';
    timerEl.textContent = '0/3';
    s4Phase = 'keys';
    s4KeysFound = 0;
    // Hide 3 keys around the cell — player walks over them to find
    s4Keys = [
      { x: 100, y: 120, found: false },
      { x: 540, y: 200, found: false },
      { x: 320, y: 380, found: false }
    ];
    player.x = 350; player.y = 240;
    s4DigProgress = 0;
    s4PlayerHP = 10;
  }

  function drawStory2Level4() {
    if (s4Phase === 'keys')     drawS4Keys();
    else if (s4Phase === 'dig')    drawS4Dig();
    else if (s4Phase === 'maze')   drawS4Maze();
    else if (s4Phase === 'prince') drawS4PrinceFight();
    else if (s4Phase === 'king')   drawS4KingFight();
    else if (s4Phase === 'absorb') drawS4Absorb();
  }

  // Phase: find 3 hidden keys in the cell
  function drawS4Keys() {
    // Jail cell interior
    ctx.fillStyle = '#1a0a28'; ctx.fillRect(0, 0, W, H);
    // Floor
    ctx.fillStyle = '#2a1838'; ctx.fillRect(0, 0, W, H);
    // Cell bars along top
    ctx.strokeStyle = '#666'; ctx.lineWidth = 4;
    for (let bx = 20; bx < W; bx += 28) {
      ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx, 40); ctx.stroke();
    }
    ctx.fillStyle = '#3a2048'; ctx.fillRect(0, 40, W, 8);
    // Walls
    ctx.fillStyle = '#3a1a48';
    ctx.fillRect(0, 48, 20, H);
    ctx.fillRect(W - 20, 48, 20, H);
    ctx.fillRect(0, H - 20, W, 20);

    // Furniture (places keys could hide under)
    ctx.fillStyle = '#5a3a28';
    ctx.fillRect(80, 100, 80, 40);   // bed
    ctx.fillRect(500, 180, 90, 40);  // chair/desk
    ctx.fillRect(280, 360, 80, 40);  // barrel

    ctx.strokeStyle = '#7a5038';
    ctx.strokeRect(80, 100, 80, 40);
    ctx.strokeRect(500, 180, 90, 40);
    ctx.strokeRect(280, 360, 80, 40);

    // Keys (glow if close to player to help find them)
    const pcx = player.x + 8, pcy = player.y + 8;
    s4Keys.forEach(k => {
      if (k.found) return;
      const dist = Math.hypot(pcx - k.x, pcy - k.y);
      if (dist < 40) {
        // Glowing key icon
        ctx.fillStyle = '#ffdd55';
        ctx.shadowColor = '#ffdd55';
        ctx.shadowBlur = 16 + Math.sin(performance.now()/200) * 6;
        // Key shape
        ctx.beginPath(); ctx.arc(k.x, k.y, 7, 0, Math.PI*2); ctx.fill();
        ctx.fillRect(k.x + 4, k.y - 2, 12, 4);
        ctx.fillRect(k.x + 12, k.y - 5, 2, 10);
        ctx.shadowBlur = 0;
      }
      // Walk into to pick up
      if (dist < 14) {
        k.found = true;
        s4KeysFound++;
        timerEl.textContent = s4KeysFound + '/3';
      }
    });

    // Player
    drawPlayer(player.x, player.y);

    // HUD text
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(20, H - 60, W - 40, 36);
    ctx.fillStyle = '#ffdd55'; ctx.font = '18px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('Keys found: ' + s4KeysFound + '/3 · Walk near hidden keys to find them', W/2, H - 36);
    ctx.textAlign = 'left';

    if (s4KeysFound >= 3) {
      s4Phase = 'dig';
      s4DigProgress = 0;
      statusEl.textContent = 'DIG OUT · TAP SPACE';
      timerEl.textContent = '0%';
      player.x = W/2 - 8; player.y = H - 120;
    }
  }

  // Phase: dig out of the cell floor - hold/tap SPACE to progress
  function drawS4Dig() {
    ctx.fillStyle = '#1a0a28'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#2a1838'; ctx.fillRect(0, 0, W, H - 100);
    // Dirt floor
    ctx.fillStyle = '#3a2818'; ctx.fillRect(0, H - 100, W, 100);
    // Walls
    ctx.fillStyle = '#3a1a48';
    ctx.fillRect(0, 0, 20, H); ctx.fillRect(W - 20, 0, 20, H);

    // Hole being dug
    const holeSize = 20 + s4DigProgress * 0.8; // grows from 20 to 100 as progress goes 0->100
    const hx = W/2, hy = H - 50;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(hx, hy, holeSize, holeSize * 0.5, 0, 0, Math.PI*2);
    ctx.fill();
    // Dirt particles flying
    if (keys[' '] || keys['Enter']) {
      for (let i = 0; i < 4; i++) {
        const px = hx + (Math.random() - 0.5) * holeSize * 1.5;
        const py = hy - Math.random() * 30;
        ctx.fillStyle = `rgba(${100 + Math.random()*60},${60 + Math.random()*30},30,0.8)`;
        ctx.fillRect(px, py, 3, 3);
      }
      // Progress
      s4DigProgress = Math.min(100, s4DigProgress + 0.8);
      timerEl.textContent = Math.floor(s4DigProgress) + '%';
    }

    // Player at hole
    drawPlayer(hx - 8, hy - 30);

    // Hint
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(20, 40, W - 40, 36);
    ctx.fillStyle = '#ffdd55'; ctx.font = '18px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('HOLD SPACE to dig · ' + Math.floor(s4DigProgress) + '%', W/2, 64);
    ctx.textAlign = 'left';

    if (s4DigProgress >= 100) {
      s4Phase = 'maze';
      initS4Maze();
    }
  }

  // Phase: maze generated randomly - navigate from start to end
  function initS4Maze() {
    statusEl.textContent = 'NAVIGATE THE MAZE';
    timerEl.textContent = '—';
    // Grid-based maze. 15x10 cells. Use randomized DFS for generation.
    const cols = 15, rows = 10;
    s4MazeCellSize = Math.floor(Math.min((W - 40) / cols, (H - 60) / rows));
    s4MazeOffset.x = Math.floor((W - cols * s4MazeCellSize) / 2);
    s4MazeOffset.y = Math.floor((H - rows * s4MazeCellSize) / 2);
    // Initialize walls
    const grid = [];
    for (let r = 0; r < rows; r++) {
      const row = [];
      for (let c = 0; c < cols; c++) {
        row.push({ top: true, right: true, bottom: true, left: true, visited: false });
      }
      grid.push(row);
    }
    // Randomized DFS
    const stack = [{ r: 0, c: 0 }];
    grid[0][0].visited = true;
    while (stack.length > 0) {
      const cur = stack[stack.length - 1];
      const neighbors = [];
      if (cur.r > 0 && !grid[cur.r - 1][cur.c].visited) neighbors.push({ r: cur.r - 1, c: cur.c, dir: 'top' });
      if (cur.c < cols - 1 && !grid[cur.r][cur.c + 1].visited) neighbors.push({ r: cur.r, c: cur.c + 1, dir: 'right' });
      if (cur.r < rows - 1 && !grid[cur.r + 1][cur.c].visited) neighbors.push({ r: cur.r + 1, c: cur.c, dir: 'bottom' });
      if (cur.c > 0 && !grid[cur.r][cur.c - 1].visited) neighbors.push({ r: cur.r, c: cur.c - 1, dir: 'left' });
      if (neighbors.length === 0) {
        stack.pop();
        continue;
      }
      const n = neighbors[Math.floor(Math.random() * neighbors.length)];
      // Break wall between cur and n
      if (n.dir === 'top')    { grid[cur.r][cur.c].top = false; grid[n.r][n.c].bottom = false; }
      if (n.dir === 'right')  { grid[cur.r][cur.c].right = false; grid[n.r][n.c].left = false; }
      if (n.dir === 'bottom') { grid[cur.r][cur.c].bottom = false; grid[n.r][n.c].top = false; }
      if (n.dir === 'left')   { grid[cur.r][cur.c].left = false; grid[n.r][n.c].right = false; }
      grid[n.r][n.c].visited = true;
      stack.push({ r: n.r, c: n.c });
    }
    s4MazeGrid = { cols, rows, cells: grid };
    // Place player at top-left cell
    player.x = s4MazeOffset.x + s4MazeCellSize/2 - 8;
    player.y = s4MazeOffset.y + s4MazeCellSize/2 - 8;
  }

  function drawS4Maze() {
    ctx.fillStyle = '#0a0614'; ctx.fillRect(0, 0, W, H);
    // Dim cave glow
    const bg = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, W);
    bg.addColorStop(0, '#1a1a28'); bg.addColorStop(1, '#0a0614');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    const g = s4MazeGrid;
    const size = s4MazeCellSize;
    const ox = s4MazeOffset.x, oy = s4MazeOffset.y;

    // Draw walls
    ctx.strokeStyle = '#aa88ff'; ctx.lineWidth = 3;
    ctx.shadowColor = '#aa88ff'; ctx.shadowBlur = 4;
    for (let r = 0; r < g.rows; r++) {
      for (let c = 0; c < g.cols; c++) {
        const cell = g.cells[r][c];
        const x = ox + c * size;
        const y = oy + r * size;
        if (cell.top)    { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + size, y); ctx.stroke(); }
        if (cell.right)  { ctx.beginPath(); ctx.moveTo(x + size, y); ctx.lineTo(x + size, y + size); ctx.stroke(); }
        if (cell.bottom) { ctx.beginPath(); ctx.moveTo(x, y + size); ctx.lineTo(x + size, y + size); ctx.stroke(); }
        if (cell.left)   { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + size); ctx.stroke(); }
      }
    }
    ctx.shadowBlur = 0;

    // Exit marker at bottom-right cell
    const exitX = ox + (g.cols - 1) * size + size/2;
    const exitY = oy + (g.rows - 1) * size + size/2;
    ctx.fillStyle = '#55ff88';
    ctx.shadowColor = '#55ff88'; ctx.shadowBlur = 12 + Math.sin(performance.now()/200) * 4;
    ctx.beginPath(); ctx.arc(exitX, exitY, 10, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = '10px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('EXIT', exitX, exitY + 3);
    ctx.textAlign = 'left';

    // Wall collision while player moves: do it manually by adjusting player.x / player.y
    // Try proposed movement, then push back if inside walls
    handleMazeCollision();

    drawPlayer(player.x, player.y);

    // Did player reach exit?
    const pcx = player.x + 8, pcy = player.y + 8;
    if (Math.hypot(pcx - exitX, pcy - exitY) < 18) {
      s4Phase = 'prince';
      initS4Prince();
    }

    // Hint
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(20, 10, W - 40, 28);
    ctx.fillStyle = '#ffdd55'; ctx.font = '16px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('Navigate to the green exit', W/2, 30);
    ctx.textAlign = 'left';
  }

  function handleMazeCollision() {
    // Keep player within each cell bounded by walls
    const g = s4MazeGrid;
    if (!g) return;
    const size = s4MazeCellSize;
    const ox = s4MazeOffset.x, oy = s4MazeOffset.y;
    const pad = 10;
    const pcx = player.x + 8, pcy = player.y + 8;
    const c = Math.floor((pcx - ox) / size);
    const r = Math.floor((pcy - oy) / size);
    if (r < 0 || r >= g.rows || c < 0 || c >= g.cols) {
      // clamp to grid edges
      player.x = Math.max(ox + 2, Math.min(ox + g.cols * size - 18, player.x));
      player.y = Math.max(oy + 2, Math.min(oy + g.rows * size - 18, player.y));
      return;
    }
    const cell = g.cells[r][c];
    const cx = ox + c * size, cy = oy + r * size;
    // If wall on top, block y
    if (cell.top && pcy < cy + pad) player.y = cy + pad - 8;
    if (cell.bottom && pcy > cy + size - pad) player.y = cy + size - pad - 8;
    if (cell.left && pcx < cx + pad) player.x = cx + pad - 8;
    if (cell.right && pcx > cx + size - pad) player.x = cx + size - pad - 8;
  }

  // Phase: Prince boss fight
  function initS4Prince() {
    statusEl.textContent = 'FIGHT THE PRINCE';
    timerEl.textContent = 'HP 10';
    player.x = 80; player.y = H/2;
    s4PlayerHP = 10;
    s4PlayerAtkCd = 0;
    s4Prince = { x: W - 120, y: H/2, size: 28, hp: 10, maxHp: 10, atkCd: 60, hitFlash: 0 };
    s4BossProjectiles = [];
  }

  function drawS4PrinceFight() {
    // Red throne chamber at the end of the maze
    ctx.fillStyle = '#2a0a28'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#4a1030';
    for (let i = 0; i < W; i += 40) {
      ctx.fillRect(i, 0, 20, 10);
      ctx.fillRect(i, H - 10, 20, 10);
    }

    // Update player
    if (s4PlayerAtkCd > 0) s4PlayerAtkCd--;
    if (s4PlayerSwinging > 0) s4PlayerSwinging--;
    if (s4PlayerInvuln > 0) s4PlayerInvuln--;

    // Player move
    let dx = 0, dy = 0;
    if (keys['w'] || keys['ArrowUp']) dy -= 1;
    if (keys['s'] || keys['ArrowDown']) dy += 1;
    if (keys['a'] || keys['ArrowLeft']) dx -= 1;
    if (keys['d'] || keys['ArrowRight']) dx += 1;
    const m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    player.x = Math.max(16, Math.min(W - 32, player.x + dx * 2.6));
    player.y = Math.max(16, Math.min(H - 32, player.y + dy * 2.6));
    if (dx !== 0) player.facing = Math.sign(dx);

    // Player attack on SPACE
    if ((keys[' '] || keys['Enter']) && s4PlayerAtkCd <= 0) {
      s4PlayerAtkCd = 22;
      s4PlayerSwinging = 12;
      const swordX = player.x + 8 + (player.facing || 1) * 18;
      const swordY = player.y + 8;
      if (Math.hypot(s4Prince.x - swordX, s4Prince.y - swordY) < s4Prince.size + 30) {
        s4Prince.hp = Math.max(0, s4Prince.hp - 1);
        s4Prince.hitFlash = 8;
      }
    }

    // Prince AI
    const pr = s4Prince;
    if (pr.hitFlash > 0) pr.hitFlash--;
    pr.atkCd--;
    // Drift toward player
    const tdx = (player.x + 8) - pr.x;
    const tdy = (player.y + 8) - pr.y;
    const td = Math.hypot(tdx, tdy) || 1;
    pr.x += (tdx / td) * 0.6;
    pr.y += (tdy / td) * 0.6;
    pr.x = Math.max(30, Math.min(W - 30, pr.x));
    pr.y = Math.max(30, Math.min(H - 30, pr.y));
    if (pr.atkCd <= 0) {
      pr.atkCd = 70;
      // Fire 3 shots at player
      for (let i = -1; i <= 1; i++) {
        const a = Math.atan2(tdy, tdx) + i * 0.2;
        s4BossProjectiles.push({ x: pr.x, y: pr.y, vx: Math.cos(a)*3.5, vy: Math.sin(a)*3.5, life: 180, color: '#ffdd55' });
      }
    }

    // Update projectiles
    s4BossProjectiles = s4BossProjectiles.filter(p => {
      p.x += p.vx; p.y += p.vy; p.life--;
      if (Math.hypot(p.x - player.x - 8, p.y - player.y - 8) < 12 && s4PlayerInvuln <= 0) {
        s4PlayerHP = Math.max(0, s4PlayerHP - 1);
        s4PlayerInvuln = 40;
        return false;
      }
      return p.life > 0 && p.x > -10 && p.x < W + 10 && p.y > -10 && p.y < H + 10;
    });

    // Draw prince
    ctx.fillStyle = pr.hitFlash > 0 ? '#fff' : '#2a1a3a';
    ctx.shadowColor = '#aa55ff'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.size, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // Crown
    ctx.fillStyle = '#ffdd55';
    ctx.beginPath();
    ctx.moveTo(pr.x - 12, pr.y - pr.size + 2); ctx.lineTo(pr.x - 8, pr.y - pr.size - 6);
    ctx.lineTo(pr.x - 4, pr.y - pr.size); ctx.lineTo(pr.x, pr.y - pr.size - 10);
    ctx.lineTo(pr.x + 4, pr.y - pr.size); ctx.lineTo(pr.x + 8, pr.y - pr.size - 6);
    ctx.lineTo(pr.x + 12, pr.y - pr.size + 2);
    ctx.closePath(); ctx.fill();
    // Eyes
    ctx.fillStyle = '#ffdd55';
    ctx.beginPath(); ctx.arc(pr.x - 8, pr.y - 4, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(pr.x + 8, pr.y - 4, 3, 0, Math.PI*2); ctx.fill();

    // Projectiles
    s4BossProjectiles.forEach(p => {
      ctx.fillStyle = p.color || '#ffdd55';
      ctx.shadowColor = p.color || '#ffdd55'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    });

    // Player
    ctx.globalAlpha = s4PlayerInvuln > 0 && s4PlayerInvuln % 6 < 3 ? 0.4 : 1;
    drawPlayer(player.x, player.y);
    // Sword
    ctx.strokeStyle = '#ffdd55'; ctx.lineWidth = 3;
    ctx.shadowColor = '#ffdd55'; ctx.shadowBlur = s4PlayerSwinging > 0 ? 10 : 4;
    const ext = s4PlayerSwinging > 0 ? 30 : 16;
    const fac = player.facing || 1;
    ctx.beginPath();
    ctx.moveTo(player.x + 8 + fac * 8, player.y + 6);
    ctx.lineTo(player.x + 8 + fac * (8 + ext), player.y + 4);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    // HUD
    drawS4BossHUD(pr, 'PRINCE', '#aa55ff');
    timerEl.textContent = 'HP ' + s4PlayerHP;

    if (pr.hp <= 0) {
      // Skip the Demon King fight for now — go straight to victory
      winStory2Level4();
    }
    if (s4PlayerHP <= 0) {
      loseGame('THE PRINCE STRUCK YOU DOWN');
    }
  }

  // Phase: Demon King fight (king transformed)
  function initS4King() {
    statusEl.textContent = 'THE KING BECOMES A DEMON';
    timerEl.textContent = 'HP ' + s4PlayerHP;
    s4King = { x: W/2, y: H/2, size: 40, hp: 50, maxHp: 50, atkCd: 40, hitFlash: 0, introTimer: 90 };
    s4BossProjectiles = [];
  }

  function drawS4KingFight() {
    // Flickering hell flames background
    ctx.fillStyle = '#1a0010'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = `rgba(255,50,80,${0.08 + Math.sin(performance.now()/180) * 0.04})`;
    ctx.fillRect(0, 0, W, H);

    const k = s4King;
    if (k.hitFlash > 0) k.hitFlash--;

    // Intro cinematic (first 1.5s)
    if (k.introTimer > 0) {
      k.introTimer--;
      ctx.fillStyle = '#ff3355';
      ctx.font = '28px Special Elite';
      ctx.textAlign = 'center';
      ctx.fillText('THE KING BECOMES A DEMON', W/2, H/2 - 60);
      ctx.textAlign = 'left';
      // Dramatic glow around king
      const pulse = (90 - k.introTimer) / 90;
      ctx.fillStyle = `rgba(255,85,204,${pulse * 0.4})`;
      ctx.beginPath(); ctx.arc(k.x, k.y, k.size + pulse * 30, 0, Math.PI*2); ctx.fill();
      drawDemonKingSprite(k);
      drawPlayer(player.x, player.y);
      return;
    }

    // Update player (same controls as prince fight)
    if (s4PlayerAtkCd > 0) s4PlayerAtkCd--;
    if (s4PlayerSwinging > 0) s4PlayerSwinging--;
    if (s4PlayerInvuln > 0) s4PlayerInvuln--;

    let dx = 0, dy = 0;
    if (keys['w'] || keys['ArrowUp']) dy -= 1;
    if (keys['s'] || keys['ArrowDown']) dy += 1;
    if (keys['a'] || keys['ArrowLeft']) dx -= 1;
    if (keys['d'] || keys['ArrowRight']) dx += 1;
    const m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    player.x = Math.max(16, Math.min(W - 32, player.x + dx * 2.6));
    player.y = Math.max(16, Math.min(H - 32, player.y + dy * 2.6));
    if (dx !== 0) player.facing = Math.sign(dx);

    if ((keys[' '] || keys['Enter']) && s4PlayerAtkCd <= 0) {
      s4PlayerAtkCd = 22;
      s4PlayerSwinging = 12;
      const swordX = player.x + 8 + (player.facing || 1) * 18;
      const swordY = player.y + 8;
      if (Math.hypot(k.x - swordX, k.y - swordY) < k.size + 30) {
        k.hp = Math.max(0, k.hp - 1);
        k.hitFlash = 8;
      }
    }

    // Demon King AI — harder than Prince, floats, fires rings
    k.atkCd--;
    const tdx = (player.x + 8) - k.x, tdy = (player.y + 8) - k.y;
    const td = Math.hypot(tdx, tdy) || 1;
    k.x += (tdx / td) * 0.4;
    k.y += (tdy / td) * 0.4 + Math.sin(performance.now()/500) * 0.3;
    k.x = Math.max(30, Math.min(W - 30, k.x));
    k.y = Math.max(30, Math.min(H - 30, k.y));
    if (k.atkCd <= 0) {
      k.atkCd = 55;
      // Ring of 8 shots
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2 + Math.random() * 0.2;
        s4BossProjectiles.push({ x: k.x, y: k.y, vx: Math.cos(a)*2.8, vy: Math.sin(a)*2.8, life: 200, color: '#ff55cc' });
      }
    }

    // Projectiles
    s4BossProjectiles = s4BossProjectiles.filter(p => {
      p.x += p.vx; p.y += p.vy; p.life--;
      if (Math.hypot(p.x - player.x - 8, p.y - player.y - 8) < 12 && s4PlayerInvuln <= 0) {
        s4PlayerHP = Math.max(0, s4PlayerHP - 1);
        s4PlayerInvuln = 40;
        return false;
      }
      return p.life > 0 && p.x > -10 && p.x < W + 10 && p.y > -10 && p.y < H + 10;
    });

    drawDemonKingSprite(k);

    s4BossProjectiles.forEach(p => {
      ctx.fillStyle = p.color || '#ff55cc';
      ctx.shadowColor = p.color || '#ff55cc'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    });

    ctx.globalAlpha = s4PlayerInvuln > 0 && s4PlayerInvuln % 6 < 3 ? 0.4 : 1;
    drawPlayer(player.x, player.y);
    ctx.strokeStyle = '#ffdd55'; ctx.lineWidth = 3;
    ctx.shadowColor = '#ffdd55'; ctx.shadowBlur = s4PlayerSwinging > 0 ? 10 : 4;
    const ext = s4PlayerSwinging > 0 ? 30 : 16;
    const fac = player.facing || 1;
    ctx.beginPath();
    ctx.moveTo(player.x + 8 + fac * 8, player.y + 6);
    ctx.lineTo(player.x + 8 + fac * (8 + ext), player.y + 4);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    drawS4BossHUD(k, 'DEMON KING', '#ff55cc');
    timerEl.textContent = 'HP ' + s4PlayerHP;

    if (k.hp <= 0) {
      s4Phase = 'absorb';
      s4AbsorbTimer = 0;
      statusEl.textContent = 'YOU ABSORB THEIR POWER';
    }
    if (s4PlayerHP <= 0) {
      loseGame('THE DEMON KING SLEW YOU');
    }
  }

  function drawDemonKingSprite(k) {
    ctx.fillStyle = k.hitFlash > 0 ? '#fff' : '#1a0010';
    ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 26;
    ctx.beginPath(); ctx.arc(k.x, k.y, k.size, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // Horns
    ctx.fillStyle = '#1a0008';
    ctx.beginPath();
    ctx.moveTo(k.x - k.size*0.5, k.y - k.size*0.7);
    ctx.lineTo(k.x - k.size*0.9, k.y - k.size*1.3);
    ctx.lineTo(k.x - k.size*0.3, k.y - k.size*0.85);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(k.x + k.size*0.5, k.y - k.size*0.7);
    ctx.lineTo(k.x + k.size*0.9, k.y - k.size*1.3);
    ctx.lineTo(k.x + k.size*0.3, k.y - k.size*0.85);
    ctx.closePath(); ctx.fill();
    // Eyes
    ctx.fillStyle = '#ff3355';
    ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(k.x - 10, k.y - 4, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(k.x + 10, k.y - 4, 4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // Ambient pink flames
    for (let i = 0; i < 4; i++) {
      const fa = (performance.now()/200 + i * Math.PI/2) % (Math.PI*2);
      const fx = k.x + Math.cos(fa) * (k.size + 12);
      const fy = k.y + Math.sin(fa) * (k.size + 12);
      ctx.fillStyle = `rgba(255,85,204,${0.3 + Math.sin(performance.now()/150 + i)*0.2})`;
      ctx.beginPath(); ctx.arc(fx, fy, 5, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawS4BossHUD(boss, name, color) {
    // Top bar: boss HP
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(20, 8, W - 40, 22);
    ctx.fillStyle = '#220011';
    ctx.fillRect(22, 10, W - 44, 18);
    const frac = Math.max(0, boss.hp / boss.maxHp);
    ctx.fillStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = 8;
    ctx.fillRect(22, 10, (W - 44) * frac, 18);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = '14px VT323';
    ctx.textAlign = 'center';
    ctx.fillText(name + '  ' + boss.hp + '/' + boss.maxHp, W/2, 23);
    ctx.textAlign = 'left';

    // Bottom bar: player HP
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(20, H - 30, W - 40, 22);
    ctx.fillStyle = '#002211';
    ctx.fillRect(22, H - 28, W - 44, 18);
    const pf = Math.max(0, s4PlayerHP / 10);
    ctx.fillStyle = '#55ff88';
    ctx.fillRect(22, H - 28, (W - 44) * pf, 18);
    ctx.strokeStyle = '#55ff88'; ctx.strokeRect(22, H - 28, W - 44, 18);
    ctx.fillStyle = '#fff'; ctx.font = '14px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('YOU  ' + s4PlayerHP + '/10', W/2, H - 15);
    ctx.textAlign = 'left';
  }

  // Phase: absorb both bodies and become all-powerful
  function drawS4Absorb() {
    ctx.fillStyle = '#0a0014'; ctx.fillRect(0, 0, W, H);
    s4AbsorbTimer += 1/60;

    // Two corpses on the ground fading as energy streams into the player
    const corpseAlpha = Math.max(0, 1 - s4AbsorbTimer / 4);
    const princePos = { x: W * 0.3, y: H / 2 };
    const kingPos = { x: W * 0.7, y: H / 2 };
    if (corpseAlpha > 0) {
      ctx.globalAlpha = corpseAlpha;
      // Prince corpse
      ctx.fillStyle = '#2a1a3a';
      ctx.beginPath(); ctx.arc(princePos.x, princePos.y, 25, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#aa55ff'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(princePos.x - 10, princePos.y - 5); ctx.lineTo(princePos.x - 5, princePos.y);
      ctx.moveTo(princePos.x - 10, princePos.y); ctx.lineTo(princePos.x - 5, princePos.y - 5);
      ctx.moveTo(princePos.x + 5, princePos.y - 5); ctx.lineTo(princePos.x + 10, princePos.y);
      ctx.moveTo(princePos.x + 5, princePos.y); ctx.lineTo(princePos.x + 10, princePos.y - 5);
      ctx.stroke();
      // King corpse
      ctx.fillStyle = '#1a0010';
      ctx.beginPath(); ctx.arc(kingPos.x, kingPos.y, 35, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#ff3355'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(kingPos.x - 12, kingPos.y - 5); ctx.lineTo(kingPos.x - 5, kingPos.y);
      ctx.moveTo(kingPos.x - 12, kingPos.y); ctx.lineTo(kingPos.x - 5, kingPos.y - 5);
      ctx.moveTo(kingPos.x + 5, kingPos.y - 5); ctx.lineTo(kingPos.x + 12, kingPos.y);
      ctx.moveTo(kingPos.x + 5, kingPos.y); ctx.lineTo(kingPos.x + 12, kingPos.y - 5);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Energy streaks from both to player
    const pcx = W/2, pcy = H/2 + 60;
    if (s4AbsorbTimer < 4) {
      ctx.strokeStyle = '#aa55ff';
      ctx.shadowColor = '#aa55ff'; ctx.shadowBlur = 14;
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const a = (performance.now()/80 + i) % 6.28;
        ctx.beginPath();
        ctx.moveTo(princePos.x + Math.cos(a)*15, princePos.y + Math.sin(a)*15);
        ctx.lineTo(pcx, pcy);
        ctx.stroke();
      }
      ctx.strokeStyle = '#ff3355';
      ctx.shadowColor = '#ff3355';
      for (let i = 0; i < 4; i++) {
        const a = (performance.now()/80 + i + 1) % 6.28;
        ctx.beginPath();
        ctx.moveTo(kingPos.x + Math.cos(a)*20, kingPos.y + Math.sin(a)*20);
        ctx.lineTo(pcx, pcy);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
    }

    // Player growing and pulsing
    const growT = Math.min(1, s4AbsorbTimer / 4);
    const pSize = 16 + growT * 24;
    const pulse = Math.sin(performance.now()/150) * 0.2 + 0.8;

    // Player transformed sprite
    ctx.fillStyle = '#2a0022';
    ctx.shadowColor = '#ff55cc'; ctx.shadowBlur = 24 * pulse;
    ctx.beginPath(); ctx.arc(pcx, pcy, pSize, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    if (growT > 0.3) {
      // Horns sprouting
      const hg = (growT - 0.3) / 0.7;
      ctx.fillStyle = '#1a0008';
      ctx.beginPath();
      ctx.moveTo(pcx - pSize*0.5, pcy - pSize*0.7);
      ctx.lineTo(pcx - pSize*0.9, pcy - pSize*(0.7 + hg*0.6));
      ctx.lineTo(pcx - pSize*0.3, pcy - pSize*0.85);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(pcx + pSize*0.5, pcy - pSize*0.7);
      ctx.lineTo(pcx + pSize*0.9, pcy - pSize*(0.7 + hg*0.6));
      ctx.lineTo(pcx + pSize*0.3, pcy - pSize*0.85);
      ctx.closePath(); ctx.fill();
    }
    // Glowing eyes
    ctx.fillStyle = '#ffdd55';
    ctx.shadowColor = '#ffdd55'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(pcx - pSize*0.3, pcy - pSize*0.2, pSize * 0.12, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(pcx + pSize*0.3, pcy - pSize*0.2, pSize * 0.12, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // Text beats
    ctx.fillStyle = '#ffdd55';
    ctx.font = '28px Special Elite';
    ctx.textAlign = 'center';
    if (s4AbsorbTimer < 2) {
      ctx.fillText('YOU TAKE THEIR POWER', W/2, 80);
    } else if (s4AbsorbTimer < 4) {
      ctx.fillStyle = '#ff55cc';
      ctx.fillText('BECOME WHAT YOU DESTROYED', W/2, 80);
    } else {
      ctx.fillStyle = '#fff';
      ctx.font = '34px Special Elite';
      ctx.fillText('YOU ARE ALL-POWERFUL', W/2, 80);
    }
    ctx.textAlign = 'left';

    if (s4AbsorbTimer > 6) {
      winStory2Level4();
    }
  }

  function winStory2Level4() {
    state = 'story2Complete';
    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <h2>STORY 2 — CHAPTER COMPLETE</h2>
      <p>You broke out. You fought through the maze. You killed the Prince and the Demon King.</p>
      <p style="color:#ff55cc;">You took their bodies. You took their power. You are as strong as both combined.</p>
      <div class="to-be-continued">TO BE CONTINUED...</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
        <button id="s2-replay">REPLAY STORY 2</button>
        <button id="s2-menu" style="background:#222;color:#aaa;border-color:#444;">MAIN MENU</button>
      </div>
    `;
    document.getElementById('s2-replay').addEventListener('click', () => {
      showStory2Intro();
    });
    document.getElementById('s2-menu').addEventListener('click', () => {
      story = 1;
      keysEarned = 0;
      updateKeysDisplay();
      showMainMenu();
    });
  }

  function loseGame(reason) {
    state = 'lost';
    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <h2>CAUGHT</h2>
      <p>${reason}.</p>
      <p>The monsters drag you back. Earth is still in the dark.</p>
      <button id="retry-btn">TRY AGAIN</button>
    `;
    document.getElementById('retry-btn').addEventListener('click', () => {
      if (story === 2) {
        if (sLevel === 1) initStory2Level1();
        else if (sLevel === 2) initStory2Level2();
        else if (sLevel === 3) initStory2Level3();
        else if (sLevel === 4) {
          // Restart from current phase, not the very beginning
          if (s4Phase === 'prince') initS4Prince();
          else if (s4Phase === 'king') {
            // Restart Demon King fight — keep S4 progress, refresh HP
            initS4King();
            s4PlayerHP = 10;
          } else {
            initStory2Level4();
          }
        }
      } else {
        if (level === 1) initLevel1();
        else if (level === 2) initLevel2();
        else if (level === 3) initLevel3();
        else if (level === 4) initLevel4();
        else if (level === 5) initLevel5();
        else if (level === 6) initLevel6();
      }
      state = 'playing'; overlay.classList.add('hidden');
    });
  }

  function showPartTwoIntro() {
    state = 'part2Intro';
    partLabel.textContent = '— PART 2: INVASION —';
    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <h2>PART 2</h2>
      <p>You collected 2 keys in Part 1. Insert them into the gate.</p>
      <div class="key-slots">
        <div class="key-slot" id="slot0">⚷</div>
        <div class="key-slot" id="slot1">⚷</div>
        <div class="key-slot" id="slot2">⚷</div>
        <div class="key-slot" id="slot3">⚷</div>
      </div>
      <p style="color:#88aa88;font-size:20px;">Earn keys 3 and 4 by clearing Levels 3 and 4.</p>
      <button id="enter-p2-btn">ENTER LEVEL 3</button>
    `;
    setTimeout(() => { document.getElementById('slot0').classList.add('filled'); }, 300);
    setTimeout(() => { document.getElementById('slot1').classList.add('filled'); }, 800);
    document.getElementById('enter-p2-btn').addEventListener('click', () => {
      initLevel3(); state = 'playing'; overlay.classList.add('hidden');
    });
  }

  function showMainMenu() {
    state = 'menu';
    story = 1;
    level = 1; levelEl.textContent = '1';
    partLabel.textContent = '— THE ESCAPE —';
    statusEl.textContent = 'SNEAK PAST THE LASER';
    timerEl.textContent = '—';
    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <h2>MONSTER WORLD</h2>
      <p>You woke up in a world run by monsters. They've enslaved humans as workers while they prepare to invade Earth. You have to escape — uncaught, unseen — and warn humanity before it's too late.</p>
      <p style="color:#ffdd55;font-size:20px;">Clear each level to earn a KEY. Collect all 4 to finish the story.</p>
      <div class="controls">Arrow Keys or WASD to move<br>Don't touch the red lasers. Don't get spotted.</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
        <button id="start-btn">START LEVEL 1</button>
        <button id="coop-btn" style="background:#1a1a44;color:#88ddff;border-color:#55aaff;">👥 2-PLAYER BOSS</button>
        <button id="pvp-btn" style="background:#2a0a0a;color:#ff8855;border-color:#ff5533;">⚔ PVP DEATHMATCH</button>
        <button id="bvb-btn" style="background:#220033;color:#cc88ff;border-color:#aa55ff;">🐲 BOSS VS BOSS</button>
      </div>
    `;
    document.getElementById('start-btn').addEventListener('click', () => {
      initLevel1(); state = 'playing'; overlay.classList.add('hidden');
    });
    document.getElementById('coop-btn').addEventListener('click', () => {
      showCoopIntro();
    });
    document.getElementById('pvp-btn').addEventListener('click', () => {
      showPvPIntro();
    });
    document.getElementById('bvb-btn').addEventListener('click', () => {
      showBvBIntro();
    });
  }

  function loop() {
    if (state === 'absorbing') {
      runAbsorptionCutscene();
    } else if (state === 'playing') {
      if (bvbMode) {
        runBvBFight();
      } else if (pvpMode) {
        runPvPFight();
      } else if (coopMode) {
        runCoopFight();
      } else if (story === 2) {
        // Story 2 movement control — only during interactive phases
        const interactive = (sLevel === 1 && sPhase === 'run') ||
                            (sLevel === 2 && (sPhase === 'heist' || sPhase === 'crew')) ||
                            (sLevel === 3 && (sPhase === 'catch' || sPhase === 'deliver')) ||
                            (sLevel === 4 && (s4Phase === 'keys' || s4Phase === 'maze'));
        if (interactive) updatePlayer();
        if (sLevel === 1) drawStory2Level1();
        else if (sLevel === 2) drawStory2Level2();
        else if (sLevel === 3) drawStory2Level3();
        else if (sLevel === 4) drawStory2Level4();
      } else {
        const scriptedPhase =
          (level === 4 && l4Phase === 'fly') ||
          (level === 5 && (l5Phase === 'multiply' || l5Phase === 'rally')) ||
          (level === 6 && l6Phase === 'kraken');
        if (!scriptedPhase) updatePlayer();
        if (level === 1) drawLevel1();
        else if (level === 2) drawLevel2();
        else if (level === 3) drawLevel3();
        else if (level === 4) {
          if (l4Phase === 'build') drawLevel4Build();
          else drawLevel4Fly();
        }
        else if (level === 5) drawLevel5();
        else if (level === 6) drawLevel6();
      }
    }
    requestAnimationFrame(loop);
  }

  updateKeysDisplay();
  showMainMenu();
  loop();
</script>
</body>
</html>
