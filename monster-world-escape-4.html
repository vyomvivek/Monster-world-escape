  function drawS2Portal() {
    // Swirling portal field
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

    sTimer += 1/60;
    const t = performance.now() / 400;

    // Swirl of stars spiraling toward center
    for (let i = 0; i < 200; i++) {
      const angle = (i * 0.1) + t;
      const progress = ((i * 3 + t * 60) % 300) / 300;
      const rr = (1 - progress) * 400;
      const sx = W/2 + Math.cos(angle + progress * 8) * rr;
      const sy = H/2 + Math.sin(angle + progress * 8) * rr;
      const bright = 1 - progress;
      ctx.fillStyle = `rgba(${180 + bright * 70},${100 + bright * 100},255,${bright})`;
      ctx.fillRect(sx, sy, 2, 2);
    }

    // Portal ring pulsing
    const ringSize = 100 + Math.sin(t * 3) * 20;
    ctx.strokeStyle = '#ff55cc';
    ctx.shadowColor = '#ff55cc'; ctx.shadowBlur = 30;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(W/2, H/2, ringSize, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = '#88aaff';
    ctx.shadowColor = '#88aaff';
    ctx.beginPath(); ctx.arc(W/2, H/2, ringSize * 0.7, 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;

    // Silhouettes entering one by one
    const entries = [0, 0.4, 0.8, 1.2, 1.6];
    entries.forEach((delay, i) => {
      if (sTimer > delay && sTimer < delay + 1) {
        const p = (sTimer - delay);
        const sx = 100 + i * 30 + p * (W/2 - 100 - i * 30);
        const sy = H/2;
        const alpha = 1 - p * 0.6;
        ctx.globalAlpha = alpha;
        drawPlayer(sx, sy);
        ctx.globalAlpha = 1;
      }
    });

    // Text
    ctx.fillStyle = '#fff';
    ctx.font = '28px Special Elite';
    ctx.textAlign = 'center';
    ctx.fillText('THROUGH THE PORTAL', W/2, 60);
    ctx.textAlign = 'left';

    if (sTimer > 3) {
      sPhase = 'babyKraken';
      sTimer = 0;
    }
  }

  function drawS2BabyKraken() {

    ctx.textAlign = 'center';

  // Phase: catch the baby kraken (it jitters and flees)
  function drawS3Catch() {
    drawKrakenCavern();

    // Big kraken looms in the background on the right
    drawBigKrakenSilhouette(bigKraken.x, bigKraken.y);

    // Baby kraken flees when you get close
    babyKraken.jitterT += 1/60;
    const pcx = player.x + 8, pcy = player.y + 8;
    const dx = babyKraken.x - pcx, dy = babyKraken.y - pcy;
    const dist = Math.hypot(dx, dy);

    if (!s3Carrying) {
      if (dist < 120) {
        // flee from player - slow, drifty
        const fx = dx / (dist || 1), fy = dy / (dist || 1);
        babyKraken.vx = babyKraken.vx * 0.85 + fx * 0.4;
        babyKraken.vy = babyKraken.vy * 0.85 + fy * 0.4;
        // hard cap - much slower than the player
        const speed = Math.hypot(babyKraken.vx, babyKraken.vy);
        const maxSpeed = 0.9;
        if (speed > maxSpeed) {
          babyKraken.vx = (babyKraken.vx / speed) * maxSpeed;
          babyKraken.vy = (babyKraken.vy / speed) * maxSpeed;
        }
      } else {
        // gentle wandering when player is far away
        babyKraken.vx = babyKraken.vx * 0.95 + (Math.random() - 0.5) * 0.2;
        babyKraken.vy = babyKraken.vy * 0.95 + (Math.random() - 0.5) * 0.2;
      }
      babyKraken.x += babyKraken.vx;
      babyKraken.y += babyKraken.vy;
      // bounce off walls
      if (babyKraken.x < 40) { babyKraken.x = 40; babyKraken.vx = Math.abs(babyKraken.vx); }
      if (babyKraken.x > W - 180) { babyKraken.x = W - 180; babyKraken.vx = -Math.abs(babyKraken.vx); }
      if (babyKraken.y < 40) { babyKraken.y = 40; babyKraken.vy = Math.abs(babyKraken.vy); }
      if (babyKraken.y > H - 40) { babyKraken.y = H - 40; babyKraken.vy = -Math.abs(babyKraken.vy); }

      drawBabyKrakenSprite(babyKraken.x, babyKraken.y);

      // Catch: just touch it (no SPACE needed, since it's frantic)
      if (dist < 22) {
        s3Carrying = true;
        sPhase = 'deliver';
        statusEl.textContent = 'DELIVER IT TO THE BIG ONE';
      }

      // Timer-based escape: if 20s pass without catching, restart the phase
      s3Timer += 1/60;
      if (s3Timer > 20) {
        loseGame('THE BABY KRAKEN ESCAPED');
        return;
      }

      ctx.fillStyle = '#ffdd55'; ctx.font = '16px VT323';
      ctx.fillText('→ Chase the baby and TOUCH it to catch', 20, 30);
      timerEl.textContent = Math.max(0, Math.ceil(20 - s3Timer)) + 's';
    }

    drawPlayer(player.x, player.y);

    // Crew watching on the left edge
    drawCrewMember(60, H - 100, '#aa2244', '#ffdd55');
    drawCrewMember(100, H - 100, '#3355aa', '#442211');
    drawCrewMember(30, H - 140, '#228855', '#663322');
    drawCrewMember(130, H - 140, '#aa3388', '#22aaaa');
  }

  function drawS3Deliver() {
    drawKrakenCavern();

    // Big kraken gets slightly bigger/more alert
    drawBigKrakenSilhouette(bigKraken.x, bigKraken.y);

    // Baby follows player
    const pcx = player.x + 8, pcy = player.y + 8;
    babyKraken.x = pcx;
    babyKraken.y = pcy - 20;

    drawBabyKrakenSprite(babyKraken.x, babyKraken.y);
    drawPlayer(player.x, player.y);

    // Crew watching on the left
    drawCrewMember(60, H - 100, '#aa2244', '#ffdd55');
    drawCrewMember(100, H - 100, '#3355aa', '#442211');
    drawCrewMember(30, H - 140, '#228855', '#663322');
    drawCrewMember(130, H - 140, '#aa3388', '#22aaaa');

    // Delivery zone near the big kraken
    const distToBig = Math.hypot(pcx - bigKraken.x, pcy - bigKraken.y);
    if (distToBig < 100) {
      ctx.fillStyle = `rgba(255,221,85,${Math.sin(performance.now()/200) * 0.3 + 0.7})`;

  function drawBabyKrakenSprite(x, y, scale) {
    scale = scale || 1;
    const bob = Math.sin(performance.now()/500) * 3;
    ctx.save();
    ctx.translate(x, y + bob);
    ctx.scale(scale, scale);
    // Body
    ctx.fillStyle = '#6a3a8a';
    ctx.shadowColor = '#aa66cc'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(0, 4, 18, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // Head bump
    ctx.fillStyle = '#7a4a9a';
    ctx.beginPath(); ctx.arc(0, -4, 12, 0, Math.PI*2); ctx.fill();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-5, -4, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -4, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-4, -3, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -3, 1.5, 0, Math.PI*2); ctx.fill();
    // Tentacles
    ctx.strokeStyle = '#6a3a8a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI + (i / 4) * Math.PI;
      const tx = Math.cos(a) * 15;
      const ty = 12;
      const wiggle = Math.sin(performance.now()/200 + i) * 3;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.quadraticCurveTo(tx + wiggle, ty + 10, tx + wiggle/2, ty + 18);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBigKrakenSilhouette(x, y, scale) {
    scale = scale || 1;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    // Body
    ctx.fillStyle = '#2a0a3a';
    ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(0, 0, 60, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // Head bump
    ctx.fillStyle = '#4a1a5a';
    ctx.beginPath(); ctx.arc(0, -24, 34, 0, Math.PI*2); ctx.fill();
    // Angry eyes
    ctx.fillStyle = '#ff3355';
    ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(-12, -24, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(12, -24, 5, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(-12, -24, 1.5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12, -24, 1.5, 4, 0, 0, Math.PI*2); ctx.fill();
    // Lower tentacles curling down
    ctx.strokeStyle = '#4a1a5a'; ctx.lineWidth = 10; ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI + (i / 5) * Math.PI;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 40, Math.sin(a) * 20 + 40);
      const wiggle = Math.sin(performance.now()/400 + i) * 6;
      ctx.quadraticCurveTo(Math.cos(a) * 60 + wiggle, 80, Math.cos(a) * 40, 120);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ========== 2-PLAYER CO-OP BOSS FIGHT (phone-friendly, portrait) ==========
  let coopMode = false;
  let p1 = null, p2 = null;
  let boss = null;
  let bossProjectiles = [];
  let coopPowerUps = [];
  let bossPhase = 1;
  let coopGameOver = false;
  let stackMeter = 0;
  let shockwave = null;
  let nextPUSpawn = 200;
  let origCW = 720, origCH = 480;

  const CW = 420, CH = 720;
  const touches = {
    p1Joy: { id: null, dx: 0, dy: 0, cx: 0, cy: 0 },
    p2Joy: { id: null, dx: 0, dy: 0, cx: 0, cy: 0 },
    p1Atk: { id: null }, p2Atk: { id: null },
    p1Stk: { id: null }, p2Stk: { id: null }
  };

  function enterCoopCanvas() {
    origCW = canvas.width; origCH = canvas.height;
    canvas.width = CW; canvas.height = CH;
    canvas.classList.add('coop');
    const mc = document.querySelector('.mobile-controls');
    if (mc) mc.style.display = 'none';
  }

  function exitCoopCanvas() {
    canvas.width = origCW; canvas.height = origCH;
    canvas.classList.remove('coop');
    const mc = document.querySelector('.mobile-controls');
    if (mc) mc.style.display = '';
    Object.values(touches).forEach(t => { t.id = null; if (t.dx !== undefined) { t.dx = 0; t.dy = 0; } });
  }

  function canvasPt(t) {
    const r = canvas.getBoundingClientRect();
    return { x: (t.clientX - r.left) * (canvas.width / r.width), y: (t.clientY - r.top) * (canvas.height / r.height) };
  }

  // UI element regions (computed from CW/CH)
  function p1JoyCenter() { return { x: 80, y: CH - 90 }; }
  function p2JoyCenter() { return { x: 80, y: 90 }; }
  function p1AtkBtn()    { return { x: CW - 70, y: CH - 90, r: 44 }; }
  function p2AtkBtn()    { return { x: CW - 70, y: 90, r: 44 }; }
  function p1StkBtn()    { return { x: CW - 160, y: CH - 90, r: 32 }; }
  function p2StkBtn()    { return { x: CW - 160, y: 90, r: 32 }; }

  function inCircle(p, c) { return Math.hypot(p.x - c.x, p.y - c.y) <= c.r; }

  function coopTS(e) {
    if (!(coopMode || pvpMode) || state !== 'playing') return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      const p = canvasPt(t);
      if (inCircle(p, p1AtkBtn()))      {
        touches.p1Atk.id = t.identifier;
        if (pvpMode) triggerPvPAtk(p1, p2);
        else triggerAtk(p1);
        continue;
      }
      if (inCircle(p, p2AtkBtn()))      {
        touches.p2Atk.id = t.identifier;
        if (pvpMode) triggerPvPAtk(p2, p1);
        else triggerAtk(p2);
        continue;
      }
      if (inCircle(p, p1StkBtn()))      { touches.p1Stk.id = t.identifier; continue; }
      if (inCircle(p, p2StkBtn()))      { touches.p2Stk.id = t.identifier; continue; }
      if (p.y > CH / 2 && p.x < CW / 2) {
        const c = p1JoyCenter();
        touches.p1Joy.id = t.identifier; touches.p1Joy.cx = c.x; touches.p1Joy.cy = c.y;
        touches.p1Joy.dx = 0; touches.p1Joy.dy = 0;
        continue;
      }
      if (p.y < CH / 2 && p.x < CW / 2) {
        const c = p2JoyCenter();
        touches.p2Joy.id = t.identifier; touches.p2Joy.cx = c.x; touches.p2Joy.cy = c.y;
        touches.p2Joy.dx = 0; touches.p2Joy.dy = 0;
        continue;
      }
    }
  }

  function coopTM(e) {
    if (!(coopMode || pvpMode) || state !== 'playing') return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      const p = canvasPt(t);
      for (const joyKey of ['p1Joy', 'p2Joy']) {
        const j = touches[joyKey];
        if (j.id === t.identifier) {
          let dx = p.x - j.cx, dy = p.y - j.cy;
          const L = Math.hypot(dx, dy), MX = 60;
          if (L > MX) { dx = dx * MX / L; dy = dy * MX / L; }
          j.dx = dx / MX; j.dy = dy / MX;
        }
      }
    }
  }

  function coopTE(e) {
    if (!(coopMode || pvpMode)) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      for (const k of Object.keys(touches)) {
        if (touches[k].id === t.identifier) {
          touches[k].id = null;
          if (touches[k].dx !== undefined) { touches[k].dx = 0; touches[k].dy = 0; }
        }
      }
    }
  }

  canvas.addEventListener('touchstart', coopTS, { passive: false });
  canvas.addEventListener('touchmove', coopTM, { passive: false });
  canvas.addEventListener('touchend', coopTE, { passive: false });
  canvas.addEventListener('touchcancel', coopTE, { passive: false });

  function triggerAtk(p) {
    if (!p || p.attackCooldown > 0 || p.hp <= 0) return;
    p.attackCooldown = 22;
    p.swinging = 12;
    const swordX = p.x + 8 + p.facing * 18;
    const swordY = p.y + 8;
    if (Math.hypot(boss.x - swordX, boss.y - swordY) < boss.size + 50) {
      boss.hp -= p.damage;
      boss.hitFlash = 8;
    }
  }

  // Player arrows fired from crossbows
  let playerArrows = [];

  function triggerShoot(p) {
    if (!p || p.shootCooldown > 0 || p.hp <= 0) return;
    p.shootCooldown = 45;
    // Arrow flies in the direction the player is facing; also has vertical
    // component toward the boss so aim is helpful without being auto-aim.
    const originX = p.x + 8 + p.facing * 14;
    const originY = p.y + 8;
    // Aim: primarily horizontal in facing direction, but tilt toward boss's Y
    const toBossY = boss.y - originY;
    const tilt = Math.max(-0.7, Math.min(0.7, toBossY / 200));
    const baseAngle = p.facing > 0 ? 0 : Math.PI;
    const ang = baseAngle + (p.facing > 0 ? tilt : -tilt);
    const speed = 7;
    playerArrows.push({
      x: originX, y: originY,
      vx: Math.cos(ang) * speed,
      vy: Math.sin(ang) * speed,
      life: 80,
      damage: p.damage,
      owner: p
    });
  }

      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
        <button id="boss-king" style="background:#330011;color:#ff6688;border-color:#ff3355;">👑 MONSTER KING · 60 HP</button>
        <button id="boss-prince" style="background:#2a1a40;color:#ffdd55;border-color:#ddaa33;">🤴 PRINCE · 45 HP</button>
        <button id="boss-demon" style="background:#2a0022;color:#ff55cc;border-color:#aa22ff;">💀 DEMON KING · 75 HP</button>
      </div>
      <p style="color:#88aa88;font-size:16px;margin-top:6px;">Prince is fast. Demon King is risen from the dead — toughest of all.</p>
      <button id="coop-back-btn" style="background:#222;color:#aaa;border-color:#444;margin-top:8px;">BACK</button>
    `;
    document.getElementById('boss-king').addEventListener('click', () => {
      initCoopFight('king'); state = 'playing'; overlay.classList.add('hidden');
    });
    document.getElementById('boss-prince').addEventListener('click', () => {
      initCoopFight('prince'); state = 'playing'; overlay.classList.add('hidden');
    });
    document.getElementById('boss-demon').addEventListener('click', () => {
      initCoopFight('demon'); state = 'playing'; overlay.classList.add('hidden');
    });
    document.getElementById('coop-back-btn').addEventListener('click', () => {
      coopMode = false; exitCoopCanvas(); showMainMenu();
    });
  }

  function initCoopFight(type) {
    coopMode = true;
    coopGameOver = false;
    bossType = type || 'king';
    enterCoopCanvas();
    partLabel.textContent = '— 2-PLAYER BOSS —';
    levelEl.textContent = 'CO';
    p1 = { x: CW/2 - 8, y: CH - 220, size: 16, speed: 2.6, hp: 5, maxHp: 5, color: '#55ff88', shirt: '#228855', attackCooldown: 0, swinging: 0, invuln: 0, facing: 1, damage: 1, powerTimer: 0, powerType: null, shielded: false, shootCooldown: 0 };
    p2 = { x: CW/2 - 8, y: 200, size: 16, speed: 2.6, hp: 5, maxHp: 5, color: '#55aaff', shirt: '#3366aa', attackCooldown: 0, swinging: 0, invuln: 0, facing: 1, damage: 1, powerTimer: 0, powerType: null, shielded: false, shootCooldown: 0 };

    // Per-boss stats
    let hp, size, label;
    if (bossType === 'prince')     { hp = 45; size = 38; label = 'PRINCE'; statusEl.textContent = 'FACE THE PRINCE'; }
    else if (bossType === 'demon') { hp = 75; size = 52; label = 'DEMON KING'; statusEl.textContent = 'RISEN FROM THE DEAD'; }
    else                           { hp = 60; size = 46; label = 'KING'; statusEl.textContent = 'DEFEAT THE KING'; }

    boss = {
      x: CW/2, y: CH/2, size: size,
      hp: hp, maxHp: hp,
      attackTimer: 70, hitFlash: 0,
      label: label, type: bossType
    };
    bossProjectiles = [];
    playerArrows = [];
    coopPowerUps = [];
    stackMeter = 0;
    shockwave = null;
    bossPhase = 1;
    nextPUSpawn = 200;
    timerEl.textContent = 'HP ' + hp;
  }

  function updateCoopP(p, joy, atkKey, upK, dnK, lfK, rtK) {
    if (p.hp <= 0) return;
    let dx = 0, dy = 0;
    if (joy.id !== null) { dx += joy.dx; dy += joy.dy; }
    if (keys[upK] || (upK.toLowerCase && keys[upK.toLowerCase()])) dy -= 1;
    if (keys[dnK] || (dnK.toLowerCase && keys[dnK.toLowerCase()])) dy += 1;
    if (keys[lfK] || (lfK.toLowerCase && keys[lfK.toLowerCase()])) dx -= 1;
    if (keys[rtK] || (rtK.toLowerCase && keys[rtK.toLowerCase()])) dx += 1;
    const m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    p.x += dx * p.speed;
    p.y += dy * p.speed;
    p.x = Math.max(16, Math.min(CW - 16 - p.size, p.x));
    p.y = Math.max(16, Math.min(CH - 16 - p.size, p.y));
    if (dx !== 0) p.facing = Math.sign(dx);
    if (p.attackCooldown > 0) p.attackCooldown--;
    if (p.swinging > 0) p.swinging--;
    if (p.invuln > 0) p.invuln--;
    if (p.shootCooldown > 0) p.shootCooldown--;
    if (p.powerTimer > 0) {
      p.powerTimer--;
      if (p.powerTimer === 0) {
        if (p.powerType === 'damage') p.damage = 1;
        if (p.powerType === 'speed') p.speed = 2.6;
        if (p.powerType === 'shield') p.shielded = false;
        p.powerType = null;
      }
    }
    if (keys[atkKey] || (atkKey.toLowerCase && keys[atkKey.toLowerCase()])) triggerAtk(p);
  }

  function updateBossAI() {
    boss.attackTimer--;
    if (boss.hitFlash > 0) boss.hitFlash--;
    if (boss.hp < boss.maxHp * 0.66 && bossPhase < 2) bossPhase = 2;
    if (boss.hp < boss.maxHp * 0.33 && bossPhase < 3) bossPhase = 3;
    const tx = CW/2 + Math.sin(performance.now()/900) * 80;
    const ty = CH/2 + Math.cos(performance.now()/1200) * 30;
    // Prince moves more quickly; Demon King drifts heavier
    const driftRate = boss.type === 'prince' ? 0.035 : boss.type === 'demon' ? 0.015 : 0.02;
    boss.x += (tx - boss.x) * driftRate;
    boss.y += (ty - boss.y) * driftRate;

    if (boss.attackTimer <= 0) {
      const r = Math.random();
      // Per-boss attack patterns
      if (boss.type === 'prince') {
        // Prince: fast spread + quick rings
        if (bossPhase === 1) { fireBoth(5, 3.0); boss.attackTimer = 50; }
        else if (bossPhase === 2) {
          if (r < 0.5) { fireBoth(7, 3.2); boss.attackTimer = 44; }
          else { fireRing(12, 2.8); boss.attackTimer = 50; }
        } else {
          if (r < 0.4) { fireBoth(9, 3.6); boss.attackTimer = 38; }
          else if (r < 0.7) { fireRing(16, 3.0); boss.attackTimer = 42; }
          else { fireHoming(); boss.attackTimer = 45; }
        }
      } else if (boss.type === 'demon') {
        // Demon King: heavier rings, double homing, skull spirals in phase 3
        if (bossPhase === 1) {
          if (r < 0.6) { fireBoth(5, 2.6); boss.attackTimer = 70; }
          else { fireRing(12, 2.4); boss.attackTimer = 80; }
        } else if (bossPhase === 2) {
          if (r < 0.35) { fireBoth(7, 2.8); boss.attackTimer = 60; }
          else if (r < 0.7) { fireRing(16, 2.6); boss.attackTimer = 70; }
          else { fireHoming(); boss.attackTimer = 55; }
        } else {
          if (r < 0.25) { fireBoth(9, 3.2); boss.attackTimer = 50; }
          else if (r < 0.5) { fireRing(20, 2.8); boss.attackTimer = 60; }
          else if (r < 0.8) { fireSpiral(18, 2.6); boss.attackTimer = 75; }
          else { fireHoming(); fireHoming(); boss.attackTimer = 70; }
        }
      } else if (boss.type === 'absorbed') {
        // Absorbed Prince — combines Prince's speed with Demon King's nastiness
        if (bossPhase === 1) {
          if (r < 0.4) { fireBoth(7, 3.2); boss.attackTimer = 48; }
          else if (r < 0.75) { fireRing(14, 2.8); boss.attackTimer = 55; }
          else { fireHoming(); boss.attackTimer = 50; }
        } else if (bossPhase === 2) {
          if (r < 0.3) { fireBoth(9, 3.4); boss.attackTimer = 42; }
          else if (r < 0.55) { fireRing(18, 3.0); boss.attackTimer = 50; }
          else if (r < 0.8) { fireSpiral(16, 2.8); boss.attackTimer = 60; }
          else { fireHoming(); fireHoming(); boss.attackTimer = 55; }
        } else {
          // Absolute chaos in final phase
          if (r < 0.25) { fireBoth(11, 3.6); boss.attackTimer = 36; }
          else if (r < 0.45) { fireRing(22, 3.2); boss.attackTimer = 45; }
          else if (r < 0.65) { fireSpiral(20, 3.0); boss.attackTimer = 52; }
          else if (r < 0.85) { fireBoth(7, 3.4); fireRing(12, 2.6); boss.attackTimer = 55; }
          else { fireHoming(); fireHoming(); boss.attackTimer = 45; }
        }
      } else {
        if (bossPhase === 1) { fireBoth(4, 2.4); boss.attackTimer = 70; }
        else if (bossPhase === 2) {
          if (r < 0.5) { fireBoth(6, 2.8); boss.attackTimer = 58; }
          else { fireRing(10, 2.4); boss.attackTimer = 70; }
        } else {
          if (r < 0.35) { fireBoth(8, 3.2); boss.attackTimer = 50; }
          else if (r < 0.7) { fireRing(14, 2.6); boss.attackTimer = 55; }
          else { fireHoming(); boss.attackTimer = 60; }
        }
      }
    }
  }

  function fireSpiral(n, sp) {
    // Fires a slow rotating spiral — Demon King signature
    const baseAngle = performance.now() / 400;
    for (let i = 0; i < n; i++) {
      const a = baseAngle + (i / n) * Math.PI * 2;
      bossProjectiles.push({ x: boss.x, y: boss.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 280, type: 'f' });
    }
  }

  function fireBoth(n, sp) {
    for (let i = 0; i < n; i++) {
      const sp2 = (i - (n-1)/2) * 0.18;
      bossProjectiles.push({ x: boss.x, y: boss.y + boss.size*0.8, vx: Math.sin(sp2)*sp, vy: Math.cos(sp2)*sp, life: 260, type: 'f' });
      bossProjectiles.push({ x: boss.x, y: boss.y - boss.size*0.8, vx: Math.sin(sp2)*sp, vy: -Math.cos(sp2)*sp, life: 260, type: 'f' });
    }
  }

  function fireRing(n, sp) {
    for (let i = 0; i < n; i++) {
      const a = (i/n) * Math.PI * 2;
      bossProjectiles.push({ x: boss.x, y: boss.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 260, type: 'f' });
    }
  }

  function fireHoming() {
    [p1, p2].forEach(p => {
      if (p.hp <= 0) return;
      const dx = p.x+8 - boss.x, dy = p.y+8 - boss.y, d = Math.hypot(dx, dy) || 1;
      bossProjectiles.push({ x: boss.x, y: boss.y, vx: (dx/d)*2.2, vy: (dy/d)*2.2, life: 300, type: 'h', target: p });
    });
  }

  function updateProjCoop() {
    bossProjectiles = bossProjectiles.filter(pr => {
      pr.life--;
      if (pr.type === 'h' && pr.target && pr.target.hp > 0) {
        const dx = pr.target.x+8 - pr.x, dy = pr.target.y+8 - pr.y, d = Math.hypot(dx, dy) || 1;
        pr.vx = pr.vx*0.95 + (dx/d)*0.18;
        pr.vy = pr.vy*0.95 + (dy/d)*0.18;
      }
      pr.x += pr.vx; pr.y += pr.vy;
      [p1, p2].forEach(p => {
        if (p.hp > 0 && p.invuln <= 0) {
          if (Math.hypot(pr.x - p.x-8, pr.y - p.y-8) < 12) {
            if (p.shielded) { p.shielded = false; p.powerType = null; p.powerTimer = 0; }
            else { p.hp--; p.invuln = 50; }
            pr.life = 0;
          }
        }
      });
      return pr.life > 0 && pr.x > -20 && pr.x < CW+20 && pr.y > -20 && pr.y < CH+20;
    });
  }

  function updatePlayerArrows() {
    playerArrows = playerArrows.filter(a => {
      a.life--;
      a.x += a.vx;
      a.y += a.vy;
      // Hit boss?
      if (Math.hypot(a.x - boss.x, a.y - boss.y) < boss.size) {
        boss.hp -= a.damage;
        boss.hitFlash = 8;
        return false;
      }
      return a.life > 0 && a.x > -10 && a.x < CW + 10 && a.y > -10 && a.y < CH + 10;
    });
  }

  function drawPlayerArrows() {
    playerArrows.forEach(a => {
      const ang = Math.atan2(a.vy, a.vx);
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(ang);
      // Shaft
      ctx.strokeStyle = '#c8aa66';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(6, 0); ctx.stroke();
      // Arrowhead (glowing)
      ctx.fillStyle = '#ffdd55';
      ctx.shadowColor = '#ffdd55'; ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.moveTo(10, 0); ctx.lineTo(4, -3); ctx.lineTo(4, 3);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      // Fletching
      ctx.fillStyle = '#ff6688';
      ctx.beginPath();
      ctx.moveTo(-10, 0); ctx.lineTo(-14, -3); ctx.lineTo(-12, 0); ctx.lineTo(-14, 3);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    });
  }

  function updateStackAndWave() {
    const p1Stk = touches.p1Stk.id !== null || keys['g'] || keys[' '];
    const p2Stk = touches.p2Stk.id !== null || keys['Shift'];
    if (p1Stk && p2Stk && !shockwave) {
      stackMeter = Math.min(100, stackMeter + 1.5);
      if (stackMeter >= 100) {
        shockwave = { r: 10, maxR: Math.max(CW, CH), life: 40, damageApplied: false };
        stackMeter = 0;
      }
    } else {
      stackMeter = Math.max(0, stackMeter - 0.3);
    }
    if (shockwave) {
      shockwave.r += (shockwave.maxR - shockwave.r) * 0.15;
      shockwave.life--;
      if (!shockwave.damageApplied && shockwave.r > Math.hypot(boss.x - CW/2, boss.y - CH/2)) {
        boss.hp -= 8;
        boss.hitFlash = 12;
        shockwave.damageApplied = true;
        bossProjectiles = [];
      }
      if (shockwave.life <= 0) shockwave = null;
    }
  }

  function updatePUCoop() {
    nextPUSpawn--;
    if (nextPUSpawn <= 0) {
      const types = ['heal', 'damage', 'speed', 'shield'];
      coopPowerUps.push({ x: 40 + Math.random()*(CW-80), y: -20, vy: 1.2, type: types[Math.floor(Math.random()*4)], life: 900 });
      nextPUSpawn = 260;
    }
    coopPowerUps.forEach(pu => {
      pu.y += pu.vy;
      if (pu.y > CH - 60) { pu.y = CH - 60; pu.vy = 0; }
      pu.life--;
    });
    [p1, p2].forEach(p => {
      coopPowerUps.forEach(pu => {
        if (pu.life > 0 && p.hp > 0 && Math.hypot(p.x+8 - pu.x, p.y+8 - pu.y) < 22) {
          applyPU(p, pu.type);
          pu.life = 0;
        }
      });
    });
    coopPowerUps = coopPowerUps.filter(pu => pu.life > 0);
  }

  function applyPU(p, t) {
    if (t === 'heal') p.hp = Math.min(p.maxHp, p.hp + 2);
    else if (t === 'damage') { p.damage = 2; p.powerType = 'damage'; p.powerTimer = 600; }
    else if (t === 'speed') { p.speed = 4.0; p.powerType = 'speed'; p.powerTimer = 600; }
    else if (t === 'shield') { p.shielded = true; p.powerType = 'shield'; p.powerTimer = 900; }
  }

  function drawCoopScene() {
    ctx.fillStyle = '#1a0a20'; ctx.fillRect(0, 0, CW, CH);
    const cg = ctx.createLinearGradient(0, 0, CW, 0);
    cg.addColorStop(0, '#1a0a20'); cg.addColorStop(0.4, '#4a1020');
    cg.addColorStop(0.6, '#4a1020'); cg.addColorStop(1, '#1a0a20');
    ctx.fillStyle = cg; ctx.fillRect(CW*0.3, 0, CW*0.4, CH);
    ctx.fillStyle = '#2a1028';
    ctx.fillRect(0, 0, CW, 16); ctx.fillRect(0, CH-16, CW, 16);
    ctx.fillRect(0, 0, 16, CH); ctx.fillRect(CW-16, 0, 16, CH);
    if (bossPhase === 3) {
      ctx.fillStyle = `rgba(255,50,80,${Math.sin(performance.now()/180)*0.06 + 0.08})`;
      ctx.fillRect(0, 0, CW, CH);
    }
  }

  function drawCoopBoss() {
    const bx = boss.x, by = boss.y;
    const t = boss.type;

    // Per-boss color scheme
    const fill = boss.hitFlash > 0 ? '#fff' :
                 (t === 'prince' ? '#2a1a3a' :
                  t === 'demon'  ? '#1a0010' :
                  t === 'absorbed' ? '#2a0022' : '#1a0010');
    const glow = t === 'prince' ? '#aa55ff' :
                 t === 'demon'  ? '#ff3355' :
                 t === 'absorbed' ? '#ff55cc' : '#ff3355';
    const eyeColor = t === 'prince' ? '#ffdd55' :
                     t === 'demon'  ? '#ff3355' :
                     t === 'absorbed' ? '#ff3355' : '#ff3355';

    ctx.fillStyle = fill;
    ctx.shadowColor = glow; ctx.shadowBlur = t === 'demon' ? 30 : 22;
    ctx.beginPath(); ctx.arc(bx, by, boss.size, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    if (t === 'absorbed') {
      // Absorbed Prince — huge horns + broken crown + pink death marks
      ctx.fillStyle = '#1a0008';
      // Huge horns (bigger than demon's)
      ctx.beginPath();
      ctx.moveTo(bx - boss.size*0.5, by - boss.size*0.7);
      ctx.lineTo(bx - boss.size*1.1, by - boss.size*1.5);
      ctx.lineTo(bx - boss.size*0.3, by - boss.size*0.85);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(bx + boss.size*0.5, by - boss.size*0.7);
      ctx.lineTo(bx + boss.size*1.1, by - boss.size*1.5);
      ctx.lineTo(bx + boss.size*0.3, by - boss.size*0.85);
      ctx.closePath(); ctx.fill();
      // Broken prince crown between horns
      ctx.fillStyle = '#ffdd55';
      ctx.beginPath();
      ctx.moveTo(bx - 18, by - boss.size + 4);
      ctx.lineTo(bx - 12, by - boss.size - 10);
      ctx.lineTo(bx - 6, by - boss.size);
      ctx.lineTo(bx, by - boss.size - 14);
      ctx.lineTo(bx + 6, by - boss.size);
      ctx.lineTo(bx + 12, by - boss.size - 10);
      ctx.lineTo(bx + 18, by - boss.size + 4);
      ctx.closePath(); ctx.fill();
      // Pink cracks crawling across the body
      ctx.strokeStyle = '#ff55cc'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(bx - boss.size*0.6, by + boss.size*0.2);
      ctx.lineTo(bx - boss.size*0.3, by);
      ctx.lineTo(bx, by + boss.size*0.4);
      ctx.lineTo(bx + boss.size*0.3, by + boss.size*0.1);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(bx + boss.size*0.5, by - boss.size*0.1);
      ctx.lineTo(bx + boss.size*0.2, by + boss.size*0.05);
      ctx.stroke();
    } else if (t === 'demon') {
      // Demon King — horns + skull cracks
      ctx.fillStyle = '#1a0008';
      // Left horn
      ctx.beginPath();
      ctx.moveTo(bx - boss.size*0.5, by - boss.size*0.7);
      ctx.lineTo(bx - boss.size*0.9, by - boss.size*1.3);
      ctx.lineTo(bx - boss.size*0.3, by - boss.size*0.85);
      ctx.closePath(); ctx.fill();
      // Right horn
      ctx.beginPath();
      ctx.moveTo(bx + boss.size*0.5, by - boss.size*0.7);
      ctx.lineTo(bx + boss.size*0.9, by - boss.size*1.3);
      ctx.lineTo(bx + boss.size*0.3, by - boss.size*0.85);
      ctx.closePath(); ctx.fill();
      // Skull cracks (undead vibe)
      ctx.strokeStyle = '#ff3355'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(bx - boss.size*0.5, by + boss.size*0.2);
      ctx.lineTo(bx - boss.size*0.2, by + boss.size*0.05);
      ctx.lineTo(bx, by + boss.size*0.3);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(bx + boss.size*0.4, by - boss.size*0.1);
      ctx.lineTo(bx + boss.size*0.15, by + boss.size*0.05);
      ctx.stroke();
    } else if (t === 'prince') {
      // Prince — smaller thinner crown
      ctx.fillStyle = '#ffdd55';
      ctx.beginPath();
      ctx.moveTo(bx - 18, by - boss.size + 4);
      ctx.lineTo(bx - 12, by - boss.size - 6);
      ctx.lineTo(bx - 6, by - boss.size);
      ctx.lineTo(bx, by - boss.size - 10);
      ctx.lineTo(bx + 6, by - boss.size);
      ctx.lineTo(bx + 12, by - boss.size - 6);
      ctx.lineTo(bx + 18, by - boss.size + 4);
      ctx.closePath(); ctx.fill();
    } else {
      // King — big spiked crown
      ctx.fillStyle = '#ffdd55';
      ctx.beginPath();
      ctx.moveTo(bx-28, by-boss.size+6); ctx.lineTo(bx-20, by-boss.size-10);
      ctx.lineTo(bx-10, by-boss.size-2); ctx.lineTo(bx, by-boss.size-16);
      ctx.lineTo(bx+10, by-boss.size-2); ctx.lineTo(bx+20, by-boss.size-10);
      ctx.lineTo(bx+28, by-boss.size+6);
      ctx.closePath(); ctx.fill();
    }

    // Eyes
    ctx.fillStyle = eyeColor;
    ctx.shadowColor = eyeColor; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(bx-14, by-4, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx+14, by-4, 5, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(bx-14, by-4, 1.5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx+14, by-4, 1.5, 4, 0, 0, Math.PI*2); ctx.fill();

    // Spikes
    const spikeColor = t === 'prince' ? '#2a0040' :
                       t === 'demon'  ? '#440011' : '#440011';
    ctx.strokeStyle = spikeColor; ctx.lineWidth = 2;
    for (let i = 0; i < 12; i++) {
      const a = (i/12)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(bx + Math.cos(a)*boss.size, by + Math.sin(a)*boss.size);
      ctx.lineTo(bx + Math.cos(a)*(boss.size+8), by + Math.sin(a)*(boss.size+8));
      ctx.stroke();
    }

    // Demon King — extra ambient purple flames
    if (t === 'demon') {
      for (let i = 0; i < 4; i++) {
        const fa = (performance.now()/200 + i * Math.PI/2) % (Math.PI*2);
        const fx = bx + Math.cos(fa) * (boss.size + 14);
        const fy = by + Math.sin(fa) * (boss.size + 14);
        ctx.fillStyle = `rgba(255,85,204,${0.3 + Math.sin(performance.now()/150 + i)*0.2})`;
        ctx.beginPath(); ctx.arc(fx, fy, 5, 0, Math.PI*2); ctx.fill();
      }
    }

    // Absorbed Prince — much denser, faster ring of pink-red death flames
    if (t === 'absorbed') {
      for (let i = 0; i < 8; i++) {
        const fa = (performance.now()/120 + i * Math.PI/4) % (Math.PI*2);
        const fx = bx + Math.cos(fa) * (boss.size + 18);
        const fy = by + Math.sin(fa) * (boss.size + 18);
        ctx.fillStyle = `rgba(255,85,204,${0.4 + Math.sin(performance.now()/120 + i)*0.3})`;
        ctx.beginPath(); ctx.arc(fx, fy, 7, 0, Math.PI*2); ctx.fill();
      }
      // Pulsing outer aura
      const auraPulse = 0.5 + Math.sin(performance.now()/200) * 0.2;
      ctx.strokeStyle = `rgba(255,50,80,${auraPulse * 0.3})`;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(bx, by, boss.size + 24, 0, Math.PI*2); ctx.stroke();
    }
  }

  function drawCoopP(p, num) {
    const flash = p.invuln > 0 && p.invuln % 6 < 3;
    if (flash) ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#f4c37a'; ctx.fillRect(p.x+4, p.y, 8, 6);
    ctx.fillStyle = p.shirt; ctx.fillRect(p.x+2, p.y+6, 12, 8);
    ctx.fillStyle = '#222';
    ctx.fillRect(p.x+3, p.y+14, 4, 2); ctx.fillRect(p.x+9, p.y+14, 4, 2);
    ctx.fillStyle = p.color; ctx.font = '11px VT323';
    ctx.textAlign = 'center'; ctx.fillText('P'+num, p.x+8, p.y-3);
    ctx.textAlign = 'left';
    ctx.strokeStyle = '#ffdd55'; ctx.lineWidth = 3;
    ctx.shadowColor = '#ffdd55'; ctx.shadowBlur = p.swinging > 0 ? 10 : 4;
    const ext = p.swinging > 0 ? 30 : 16;
    ctx.beginPath();
    ctx.moveTo(p.x+8 + p.facing*8, p.y+6);
    ctx.lineTo(p.x+8 + p.facing*(8+ext), p.y+4);
    ctx.stroke();
    ctx.shadowBlur = 0;
    if (p.shielded) {
      ctx.strokeStyle = '#88ddff'; ctx.shadowColor = '#88ddff'; ctx.shadowBlur = 10; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x+8, p.y+8, 14, 0, Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }

  function drawCoopProj() {
    bossProjectiles.forEach(pr => {
      if (pr.type === 'h') {
        ctx.fillStyle = '#ff55cc'; ctx.shadowColor = '#ff55cc'; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(pr.x, pr.y, 6, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle = '#ff6633'; ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(pr.x, pr.y, 7, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ffdd55';
        ctx.beginPath(); ctx.arc(pr.x, pr.y, 3, 0, Math.PI*2); ctx.fill();
      }
      ctx.shadowBlur = 0;
    });
  }

  function drawCoopPU() {
    const icons = { heal: '+', damage: 'x', speed: '>', shield: 'o' };
    const cols = { heal: '#55ff88', damage: '#ff3355', speed: '#88aaff', shield: '#ffdd55' };
    coopPowerUps.forEach(pu => {
      const bob = pu.vy === 0 ? Math.sin(performance.now()/300 + pu.x)*3 : 0;
      ctx.fillStyle = cols[pu.type];
      ctx.shadowColor = cols[pu.type]; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(pu.x, pu.y+bob, 16, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#0a0614'; ctx.font = 'bold 18px VT323';
      ctx.textAlign = 'center';
      ctx.fillText(icons[pu.type], pu.x, pu.y+bob+6);
      ctx.textAlign = 'left';
      if (pu.life < 150 && Math.floor(pu.life/8) % 2 === 0) {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(pu.x, pu.y+bob, 18, 0, Math.PI*2); ctx.stroke();
      }
    });
  }

  function drawCoopWave() {
    if (!shockwave) return;
    ctx.strokeStyle = `rgba(255,221,85,${shockwave.life/40})`;
    ctx.lineWidth = 6;
    ctx.shadowColor = '#ffdd55'; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.arc(CW/2, CH/2, shockwave.r, 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function drawHPRow(x, y, p, label) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(x-2, y-2, 160, 22);
    ctx.fillStyle = '#fff'; ctx.font = '12px VT323'; ctx.fillText(label, x, y+13);
    for (let i = 0; i < p.maxHp; i++) {
      ctx.fillStyle = i < p.hp ? p.color : '#333';
      ctx.fillRect(x + 22 + i*24, y, 20, 14);
      ctx.strokeStyle = '#000'; ctx.strokeRect(x + 22 + i*24, y, 20, 14);
    }
  }

  function drawCoopHUD() {
    // P2 HP at top
    drawHPRow(8, 8, p2, 'P2');
    // P1 HP at bottom
    drawHPRow(8, CH-24, p1, 'P1');
    // Power indicators
    if (p2.powerType && p2.powerTimer > 0) {
      ctx.fillStyle = '#ffdd55'; ctx.font = '11px VT323';
      ctx.fillText(p2.powerType.toUpperCase() + ' ' + Math.ceil(p2.powerTimer/60) + 's', 170, 18);
    }
    if (p1.powerType && p1.powerTimer > 0) {
      ctx.fillStyle = '#ffdd55'; ctx.font = '11px VT323';
      ctx.fillText(p1.powerType.toUpperCase() + ' ' + Math.ceil(p1.powerTimer/60) + 's', 170, CH-14);
    }
    // Boss HP in center
    const midY = CH/2 - 74;
    const bw = CW - 40;
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(18, midY-4, bw+4, 16);
    ctx.fillStyle = '#220011'; ctx.fillRect(20, midY, bw, 10);
    const frac = Math.max(0, boss.hp / boss.maxHp);
    ctx.fillStyle = '#ff3355'; ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 8;
    ctx.fillRect(20, midY, bw*frac, 10);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ff3355'; ctx.strokeRect(20, midY, bw, 10);
    ctx.fillStyle = '#ff6688'; ctx.font = '12px Special Elite';
    ctx.textAlign = 'center';
    ctx.fillText((boss.label || 'KING') + ' ' + boss.hp + '/' + boss.maxHp, CW/2, midY-6);
    ctx.textAlign = 'left';
    // Stack meter on right middle
    const smX = CW - 28, smY = CH/2 - 50, smH = 100;
    ctx.fillStyle = '#222'; ctx.fillRect(smX, smY, 12, smH);
    const sf = stackMeter / 100;
    ctx.fillStyle = sf >= 1 ? '#fff' : '#ffdd55';
    ctx.shadowColor = '#ffdd55'; ctx.shadowBlur = sf > 0.3 ? 12 : 0;
    ctx.fillRect(smX, smY + smH*(1-sf), 12, smH*sf);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffdd55'; ctx.strokeRect(smX, smY, 12, smH);
    ctx.fillStyle = '#ffdd55'; ctx.font = '9px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('STACK', smX+6, smY-6);
    ctx.textAlign = 'left';
  }

  function drawTouchControls() {
    // Joysticks
    const drawJoy = (c, joyState, col) => {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.arc(c.x, c.y, 55, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(c.x, c.y, 55, 0, Math.PI*2); ctx.stroke();
      const knobX = c.x + (joyState.id !== null ? joyState.dx * 40 : 0);
      const knobY = c.y + (joyState.id !== null ? joyState.dy * 40 : 0);
      ctx.fillStyle = col;
      ctx.shadowColor = col; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(knobX, knobY, 22, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    };
    drawJoy(p1JoyCenter(), touches.p1Joy, '#55ff88');
    drawJoy(p2JoyCenter(), touches.p2Joy, '#55aaff');
    // Attack buttons
    const drawBtn = (c, label, col, active) => {
      ctx.fillStyle = active ? col : 'rgba(0,0,0,0.4)';
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = active ? '#000' : col;
      ctx.font = 'bold 16px VT323';
      ctx.textAlign = 'center';
      ctx.fillText(label, c.x, c.y + 6);
      ctx.textAlign = 'left';
    };
    drawBtn(p1AtkBtn(), 'ATK', '#ff6688', touches.p1Atk.id !== null);
    drawBtn(p2AtkBtn(), 'ATK', '#ff6688', touches.p2Atk.id !== null);
    drawBtn(p1StkBtn(), 'STK', '#ffdd55', touches.p1Stk.id !== null);
    drawBtn(p2StkBtn(), 'STK', '#ffdd55', touches.p2Stk.id !== null);
  }

  function runCoopFight() {
    drawCoopScene();
    if (!coopGameOver) {
      updateCoopP(p1, touches.p1Joy, 'f', 'w', 's', 'a', 'd');
      updateCoopP(p2, touches.p2Joy, 'Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight');
      updateBossAI();
      updateProjCoop();
      updatePlayerArrows();
      updatePUCoop();
      updateStackAndWave();
    }
    drawCoopBoss();
    drawCoopPU();
    drawCoopProj();
    drawPlayerArrows();
    if (p1.hp > 0) drawCoopP(p1, 1);
    if (p2.hp > 0) drawCoopP(p2, 2);
    drawCoopWave();
    drawCoopHUD();
    drawTouchControls();
    timerEl.textContent = 'HP ' + boss.hp;
    if (!coopGameOver) {
      if (boss.hp <= 0) {
        // Demon King's death triggers the Prince's absorption — a second boss fight
        if (bossType === 'demon') {
          coopGameOver = true;
          setTimeout(startAbsorptionCutscene, 200);
        } else {
          coopGameOver = true;
          setTimeout(coopWin, 200);
        }
      }
      else if (p1.hp <= 0 && p2.hp <= 0) { coopGameOver = true; setTimeout(coopLose, 200); }
    }
  }

  // -------- Demon King -> Prince absorption transition --------
  let absorbingState = null;

  function startAbsorptionCutscene() {
    state = 'absorbing';
    absorbingState = {
      t: 0,
      corpseX: boss.x, corpseY: boss.y,
      princeX: CW/2, princeY: -60,  // Prince swoops in from top
      princeSize: 30
    };
    // Clear projectiles and shockwave so the cutscene is clean
    bossProjectiles = [];
    playerArrows = [];
    shockwave = null;
    coopPowerUps = [];
    statusEl.textContent = 'THE PRINCE ARRIVES...';
  }

  function runAbsorptionCutscene() {
    drawCoopScene();
    // Draw the dead Demon King body, fading
    const a = absorbingState;
    a.t += 1/60;

    // Phase A (0-1.5s): Demon corpse still visible, Prince descends
    // Phase B (1.5-3.5s): Prince reaches corpse, absorption glow
    // Phase C (3.5-5.5s): Merged form rises and transforms
    // Phase D (5.5s+): start final fight

    // Demon corpse (fading out)
    const corpseAlpha = Math.max(0, 1 - a.t / 3.5);
    if (corpseAlpha > 0) {
      ctx.globalAlpha = corpseAlpha;
      // Dim version of demon body
      ctx.fillStyle = '#1a0010';
      ctx.beginPath(); ctx.arc(a.corpseX, a.corpseY, 52, 0, Math.PI*2); ctx.fill();
      // X eyes (dead)
      ctx.strokeStyle = '#ff3355'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(a.corpseX - 18, a.corpseY - 8); ctx.lineTo(a.corpseX - 10, a.corpseY);
      ctx.moveTo(a.corpseX - 18, a.corpseY); ctx.lineTo(a.corpseX - 10, a.corpseY - 8);
      ctx.moveTo(a.corpseX + 10, a.corpseY - 8); ctx.lineTo(a.corpseX + 18, a.corpseY);
      ctx.moveTo(a.corpseX + 10, a.corpseY); ctx.lineTo(a.corpseX + 18, a.corpseY - 8);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Prince descending
    if (a.t < 1.8) {
      a.princeY = -60 + (a.t / 1.8) * (a.corpseY - (-60));
    } else {
      a.princeY = a.corpseY;
    }
    if (a.t < 3.5) {
      // Draw prince sprite above/at corpse
      const px = a.princeX, py = a.princeY;
      ctx.fillStyle = '#2a1a3a';
      ctx.shadowColor = '#aa55ff'; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(px, py, a.princeSize, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      // Prince crown
      ctx.fillStyle = '#ffdd55';
      ctx.beginPath();
      ctx.moveTo(px - 14, py - a.princeSize + 2);
      ctx.lineTo(px - 8, py - a.princeSize - 6);
      ctx.lineTo(px - 4, py - a.princeSize - 2);
      ctx.lineTo(px, py - a.princeSize - 10);
      ctx.lineTo(px + 4, py - a.princeSize - 2);
      ctx.lineTo(px + 8, py - a.princeSize - 6);
      ctx.lineTo(px + 14, py - a.princeSize + 2);
      ctx.closePath(); ctx.fill();
      // Eyes
      ctx.fillStyle = '#ffdd55';
      ctx.beginPath(); ctx.arc(px - 10, py - 4, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(px + 10, py - 4, 4, 0, Math.PI*2); ctx.fill();
    }

    // Absorption energy rings (phase B)
    if (a.t > 1.5 && a.t < 3.5) {
      const ringT = (a.t - 1.5) / 2;
      for (let i = 0; i < 4; i++) {
        const rp = (ringT * 2 + i * 0.25) % 1;
        ctx.strokeStyle = `rgba(255,85,204,${(1 - rp) * 0.8})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(a.corpseX, a.corpseY, 30 + rp * 60, 0, Math.PI*2);
        ctx.stroke();
      }
      // Energy streaks from corpse to prince
      ctx.strokeStyle = '#ff55cc';
      ctx.shadowColor = '#ff55cc'; ctx.shadowBlur = 14;
      ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const streakA = (performance.now()/100 + i * 0.8);
        const sx = a.corpseX + Math.cos(streakA) * 40;
        const sy = a.corpseY + Math.sin(streakA) * 40;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(a.princeX, a.princeY);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
    }

    // Phase C: growing transformed silhouette
    if (a.t > 3.5 && a.t < 5.5) {
      const growT = (a.t - 3.5) / 2;
      const grown = 30 + growT * 30;
      const flicker = Math.sin(performance.now()/60) * 0.3 + 0.7;
      ctx.fillStyle = '#1a0022';
      ctx.shadowColor = '#ff55cc'; ctx.shadowBlur = 40 * flicker;
      ctx.beginPath(); ctx.arc(a.corpseX, a.corpseY, grown, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      // Horns sprouting
      if (growT > 0.3) {
        const hornGrow = (growT - 0.3) / 0.7;
        ctx.fillStyle = '#1a0008';
        ctx.beginPath();
        ctx.moveTo(a.corpseX - grown*0.5, a.corpseY - grown*0.7);
        ctx.lineTo(a.corpseX - grown*0.9, a.corpseY - grown*(0.7 + hornGrow*0.6));
        ctx.lineTo(a.corpseX - grown*0.3, a.corpseY - grown*0.85);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(a.corpseX + grown*0.5, a.corpseY - grown*0.7);
        ctx.lineTo(a.corpseX + grown*0.9, a.corpseY - grown*(0.7 + hornGrow*0.6));
        ctx.lineTo(a.corpseX + grown*0.3, a.corpseY - grown*0.85);
        ctx.closePath(); ctx.fill();
      }
      // Players heal visual (white flash on them during phase C)
      if (growT < 0.3) {
        ctx.globalAlpha = 0.5 - growT;
        ctx.fillStyle = '#55ff88';
        ctx.fillRect(0, CH - 40, CW, 40);
        ctx.fillStyle = '#55aaff';
        ctx.fillRect(0, 0, CW, 40);
        ctx.globalAlpha = 1;
      }
    }

    // Still draw players (so they stay visible)
    if (p1.hp > 0) drawCoopP(p1, 1);
    if (p2.hp > 0) drawCoopP(p2, 2);

    // Text overlays
    ctx.textAlign = 'center';
    ctx.font = '22px Special Elite';
    if (a.t < 1.8) {
      ctx.fillStyle = '#ffdd55';
      ctx.fillText('THE PRINCE ARRIVES', CW/2, 60);
    } else if (a.t < 3.5) {
      ctx.fillStyle = '#ff55cc';
      ctx.fillText('HE ABSORBS THE KING...', CW/2, 60);
    } else if (a.t < 5.5) {
      ctx.fillStyle = '#ff3355';
      ctx.fillText('A NEW HORROR RISES', CW/2, 60);
    }
    ctx.textAlign = 'left';

    if (a.t >= 5.5) {
      startAbsorbedFight();
    }
  }

    p2.maxHp = 7;
    p2.hp = 7;
    p2.invuln = 60;

    boss = {
      x: CW/2, y: CH/2, size: 58,
      hp: 120, maxHp: 120,
      attackTimer: 60, hitFlash: 0,

    };

    playerArrows = [];

    stackMeter = 0;
